{% load i18n static layui_tags %}
{% static_version as sv %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% system_name %}</title>
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme-mode', theme === 'dark' ? 'dark' : 'light');
        })();
    </script>
    {% favicon_url as favicon %}
    {% if favicon %}
    <link rel="icon" type="image/x-icon" href="{{ favicon }}">
    {% else %}
    <link rel="icon" type="image/x-icon" href="{% static 'layui/favicon.ico' %}?v={{ sv }}">
    {% endif %}
    <link rel="stylesheet" href="{% static 'layui/lib/layui.css' %}?v={{ sv }}">
    <link rel="stylesheet" href="{% static 'layui/css/themes.css' %}?v={{ sv }}">
    <link rel="stylesheet" href="{% static 'layui/css/admin.css' %}?v={{ sv }}">
    <style>
        .layui-form-checkbox[lay-skin="primary"] span { color: var(--text-primary); }
        .layui-form-switch { background: var(--bg-tertiary); border-color: var(--border-color); }
        .layui-form-switch.layui-form-onswitch { border-color: var(--primary-color); }
        .layui-form-switch em { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="admin-layout">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-left">
                <div class="logo-area">
                    <div class="logo-icon">
                        <i class="layui-icon {% logo_icon %}"></i>
                    </div>
                    <span class="logo-text">{% system_name %}</span>
                </div>
                <div class="sidebar-toggle" id="sidebarToggle" title="">
                    <i class="layui-icon layui-icon-shrink-right"></i>
                </div>
            </div>
            <div class="header-right">
                <div class="header-action-btn" id="langBtn" title="中文">
                    <i class="layui-icon layui-icon-flag"></i>
                </div>
                <div class="header-action-btn" id="themeToggle" title="深色/浅色切换">
                    <i class="layui-icon layui-icon-light" id="themeIcon"></i>
                </div>
                <div class="header-action-btn" id="frontendBtn" title="访问前台">
                    <i class="layui-icon layui-icon-website"></i>
                </div>
                <div class="header-action-btn" id="fullscreenBtn" title="">
                    <i class="layui-icon layui-icon-screen-full"></i>
                </div>
                <div class="header-user-area" id="userArea">
                    <div class="user-avatar" id="userAvatar">
                        <i class="layui-icon layui-icon-user"></i>
                    </div>
                    <span class="user-name" id="userName">{{ user.get_full_name|default:user.username }}</span>
                    <i class="user-arrow"></i>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-item" id="profileBtn">
                            <i class="layui-icon layui-icon-user"></i>
                            <span data-i18n="header.personalCenter">个人中心</span>
                        </div>
                        <div class="dropdown-item" id="changePasswordBtn">
                            <i class="layui-icon layui-icon-password"></i>
                            <span data-i18n="header.changePassword">修改密码</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <div class="dropdown-item danger" id="logoutBtn">
                            <i class="layui-icon layui-icon-logout"></i>
                            <span data-i18n="header.logout">退出登录</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Body -->
        <div class="admin-body">
            <aside class="admin-sidebar" id="adminSidebar">
                <div class="sidebar-menu" id="sidebarMenu">
                    <div class="empty-state" style="padding: 40px 20px;">
                        <i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop"></i>
                        <p data-i18n="common.loading">加载中..</p>
                    </div>
                </div>
            </aside>
            <div class="admin-content">
                <div class="tab-header" id="tabHeader"></div>
                <div class="tab-content" id="tabContent"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="admin-footer" id="adminFooter">
        <span class="footer-copyright">{% copyright_text %}</span>
    </footer>

    <!-- Change Password Popup Template -->
    <script type="text/html" id="changePasswordTpl">
        <div style="padding: 20px 20px 10px;">
            <form class="layui-form" id="changePasswordForm" lay-filter="changePasswordForm">
                <div class="layui-form-item">
                    <label class="layui-form-label">原密码</label>
                    <div class="layui-input-block">
                        <input type="password" name="old_password" lay-verify="required"
                               placeholder="" autocomplete="current-password" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">新密码</label>
                    <div class="layui-input-block">
                        <input type="password" name="new_password" lay-verify="required"
                               placeholder="" autocomplete="new-password" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">确认密码</label>
                    <div class="layui-input-block">
                        <input type="password" name="confirm_password" lay-verify="required"
                               placeholder="" autocomplete="new-password" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item" style="display:flex;justify-content:flex-end;margin-top:10px;">
                    <button type="button" class="layui-btn layui-btn-normal" id="submitPasswordBtn"
                            style="width: 160px; border-radius: 6px;">
                        <span>确认修改</span>
                    </button>
                </div>
            </form>
        </div>
    </script>

    <!-- Profile Popup Template -->
    <script type="text/html" id="profileTpl">
        <div style="padding: 30px 20px 10px;">
            <form class="layui-form" id="profileForm" lay-filter="profileForm">
                <div class="layui-form-item">
                    <label class="layui-form-label">用户名</label>
                    <div class="layui-input-block">
                        <input type="text" name="username" id="profileUsername" readonly
                               class="layui-input layui-disabled" style="background: var(--bg-tertiary);">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">昵称</label>
                    <div class="layui-input-block">
                        <input type="text" name="nickname" id="profileNickname"
                               placeholder="" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">手机号</label>
                    <div class="layui-input-block">
                        <input type="text" name="phone" id="profilePhone"
                               placeholder="" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">角色</label>
                    <div class="layui-input-block">
                        <input type="text" name="roles" id="profileRoles" readonly
                               class="layui-input layui-disabled" style="background: var(--bg-tertiary);">
                    </div>
                </div>
                <div class="layui-form-item" style="display:flex;justify-content:flex-end;margin-top:20px;">
                    <button type="button" class="layui-btn layui-btn-normal" id="submitProfileBtn"
                            style="width: 160px; border-radius: 6px;">
                        <span>保存修改</span>
                    </button>
                </div>
            </form>
        </div>
    </script>

    <script src="{% static 'layui/lib/layui.js' %}?v={{ sv }}"></script>
    <script src="{% static 'layui/js/common.js' %}?v={{ sv }}"></script>
    <script src="{% static 'layui/js/i18n.js' %}?v={{ sv }}"></script>
    {% webssh_url as webssh_url_val %}
    <script>
    // Global config
    window.LAYUI_CONFIG = {
        webssh_url: '{{ webssh_url_val|escapejs }}',
        admin_login_url: '{% url "admin:login" %}',
        home_quick_links: {{ layui_config.home_quick_links|default:"[]"|safe }},
        home_stats_cards: {{ layui_config.home_stats_cards|default:"[]"|safe }},
        form_filter_disabled: '{{ layui_config.form_filter_disabled|default:"false"|escapejs }}',
    };

    // ==================== Global Variables ====================
    var currentUser = null;
    var currentTheme = 'dark';
    var tabs = {};
    var activeTabUrl = '';
    var sidebarCollapsed = false;

    // ==================== Initialize ====================
    layui.use(['form', 'layer', 'element'], function() {
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.$;

        // Expose to iframe children
        window.openTab = openTab;
        window.switchTab = switchTab;
        window.closeTab = closeTab;
        window.applyThemeMode = applyThemeMode;
        window.getCurrentTheme = function() { return currentTheme; };

        // Initialize language
        var currentLang = I18N.getLang();
        window.LANG = currentLang;
        updateLangUI(currentLang);
        window.I18N = I18N;
        window.t = t;

        var _originalTexts = {};
        function updateLangUI(lang) {
            var label = lang === 'en' ? 'English' : '中文';
            $('#langBtn').attr('title', label);
            $('[data-i18n]').each(function() {
                var $el = $(this);
                var key = $el.attr('data-i18n');
                if (!key) return;
                try {
                    var translated = (typeof t === 'function') ? t(key) : null;
                    if (translated && translated !== key && typeof translated === 'string') {
                        $el.text(translated);
                    } else if (!_originalTexts[key]) {
                        _originalTexts[key] = $el.text();
                    }
                } catch(e) {
                    if (!_originalTexts[key]) {
                        _originalTexts[key] = $el.text();
                    }
                }
            });
        }

        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || data.type !== 'languageChange' || !data.lang) return;
            if (I18N.currentLang === data.lang) return;
            I18N.setLang(data.lang);
            updateLangUI(data.lang);
            window.LANG = data.lang;
            if (window.currentUser) window.currentUser.language = data.lang;
        });

        // Language switch
        $(document).on('click', '#langBtn', function() {
            var current = I18N.getLang();
            var next = current === 'zh-hans' ? 'en' : 'zh-hans';
            postApi('/admin/api/rbac/set-language/', {language: next}, function(res) {
                if (res.code === 200) {
                    I18N.setLang(next);
                    updateLangUI(next);
                    window.LANG = next;
                    if (window.currentUser) window.currentUser.language = next;
                    $('iframe[id^="iframe_"]').each(function() {
                        try {
                            this.contentWindow.postMessage({ type: 'languageChange', lang: next }, '*');
                        } catch(e) {}
                    });
                    layer.msg(t('common.languageChanged'), {icon: 1});
                    setTimeout(function() { location.reload(); }, 800);
                }
            });
        });

        // Fetch user info and menus on page load
        $.get('/admin/api/rbac/userinfo/', function(res) {
            if (res.code === 200) {
                currentUser = res.data;
                window.currentUser = currentUser;
                var rawTheme = res.data.theme || 'dark';
                var themeAliasMap = {'默认深色': 'dark', '默认浅色': 'light'};
                currentTheme = themeAliasMap[rawTheme] || rawTheme;
                renderMenu(res.data.menus);
                applyThemeMode(currentTheme === 'dark');
                updateUserInfo(res.data);
                // Default open dashboard
                openTab(t('header.home'), '/static/layui/pages/dashboard.html');

                // Get system config
                $.get('/admin/api/rbac/system/config/', function(configRes) {
                    if (configRes.code === 200 && configRes.data) {
                        // 将配置存储到全局变量，供其他页面使用
                        window.systemConfig = configRes.data;
                        
                        var config = configRes.data;
                        if (config.system_name) {
                            $('.logo-text').text(config.system_name);
                            document.title = config.system_name;
                        }
                        if (config.logo_icon) {
                            $('.logo-icon i').attr('class', 'layui-icon ' + config.logo_icon);
                        }
                        if (config.logo_url) {
                            $('.logo-icon').html('<img src="' + config.logo_url + '" style="width:32px;height:32px;border-radius:6px;">');
                        }
                        if (config.frontend_url) {
                            $('#frontendBtn').show().attr('data-url', config.frontend_url);
                        }
                        if (config.favicon_url) {
                            $('link[rel="icon"]').attr('href', config.favicon_url);
                        }
                        var footerHtml = '';
                        if (config.system_description) {
                            footerHtml += '<span class="footer-desc">' + escapeHtml(config.system_description) + '</span>';
                        }
                        if (config.system_version) {
                            footerHtml += '<span class="footer-version">' + escapeHtml(config.system_version) + '</span>';
                        }
                        if (config.copyright) {
                            footerHtml += '<span class="footer-copyright">' + escapeHtml(config.copyright) + '</span>';
                        }
                        if (footerHtml) {
                            $('#adminFooter').html(footerHtml);
                        }
                    }
                });
            } else {
                location.href = window.LAYUI_CONFIG.admin_login_url;
            }
        }).fail(function() {
            location.href = window.LAYUI_CONFIG.admin_login_url || '/admin/login/';
        });

        // ==================== Render Menu Tree ====================
        function renderMenu(menus) {
            var html = '';
            menus.forEach(function(menu) {
                if (menu.menu_type === 1) {
                    html += renderDirectory(menu);
                } else if (menu.menu_type === 2) {
                    html += renderMenuItem(menu);
                }
            });
            $('#sidebarMenu').html(html || '<div class="empty-state"><p>' + t('sidebar.noPermission') + '</p></div>');
        }

        function renderDirectory(menu) {
            var children = menu.children || [];
            // 检查可见子菜单（考虑 backend_visible）
            var hasVisibleChildren = children.some(function(c) {

                return c.visible !== false && (c.backend_visible === undefined || c.backend_visible === true);
            });
            if (!hasVisibleChildren) return '';
            // 如果目录本身不可见，也不显示
            if (menu.visible === false || (menu.backend_visible !== undefined && menu.backend_visible === false)) return '';
            var name = menu.name;
            var icon = menu.icon || 'layui-icon-app';
            if (window.LANG === 'en' && menu.name_en) {
                name = menu.name_en;
            } else if (window.LANG === 'zh-hans' && menu.name_zh_hans) {
                name = menu.name_zh_hans;
            }
            var groupId = 'menu-group-' + menu.id;
            var html = '<div class="menu-group has-children" data-menu-id="' + menu.id + '">';
            html += '<div class="menu-group-title" role="button" tabindex="0" aria-expanded="true" aria-controls="' + groupId + '">';
            html += '<i class="layui-icon ' + escapeAttr(icon) + ' menu-dir-icon"></i>';
            html += '<span class="menu-group-name">' + escapeHtml(name) + '</span>';
            html += '<span class="menu-arrow" aria-hidden="true"></span>';
            html += '</div>';
            html += '<div class="sub-menu open" id="' + groupId + '">';
            children.forEach(function(child) {
                // 检查子菜单的可见性
                if (child.visible === false) return;
                if (child.backend_visible !== undefined && child.backend_visible === false) return;
                if (child.menu_type === 1) {
                    html += renderDirectory(child);
                } else if (child.menu_type === 2) {
                    html += renderMenuItem(child);
                }
            });
            html += '</div></div>';
            return html;
        }

        // Menu path to page file mapping
        var menuPathMap = {
            '/permission/menu': '/static/layui/pages/menu.html',
            '/permission/role': '/static/layui/pages/role.html',
            '/permission/user': '/static/layui/pages/user.html',
            '/system/rbac-constraints': '/static/layui/pages/constraints.html',
            '/permission/abac': '/static/layui/pages/abac.html',
            '/system/scope-nodes': '/static/layui/pages/scope.html',
            '/permission-demo/orders': '/static/permission_demo/pages/order.html',
            '/static/permission_demo/pages/order.html': '/static/permission_demo/pages/order.html',
            '/profile': '/static/layui/pages/profile.html',
            '/system/log': '/static/layui/pages/log.html',
            '/system/info': '/static/layui/pages/dashboard.html',
            '/system/config': '/static/layui/pages/config.html',
            '/ops/server': '/static/layui/pages/server.html',
            '/ops/ai-config': '/static/layui/pages/ai-config.html',
        };

        function renderMenuItem(menu) {
            // 检查菜单是否可见（visible 和 backend_visible）
            if (menu.visible === false) return '';
            if (menu.backend_visible !== undefined && menu.backend_visible === false) return '';
            var icon = menu.icon || 'layui-icon-app';
            var rawUrl = menu.path || menu.component || '';
            var url = menuPathMap[rawUrl] || rawUrl;
            // 根据语言环境选择菜单名称
            var title = menu.name;
            if (window.LANG === 'en' && menu.name_en) {
                title = menu.name_en;
            } else if (window.LANG === 'zh-hans' && menu.name_zh_hans) {
                title = menu.name_zh_hans;
            }
            title = escapeHtml(title);
            return '<div class="menu-item" data-url="' + escapeAttr(url) + '" data-title="' + escapeAttr(title) + '">' +
                   '<i class="layui-icon ' + escapeAttr(icon) + ' menu-icon"></i>' +
                   '<span class="menu-text">' + title + '</span>' +
                   '</div>';
        }

        // ==================== Menu Click Events ====================
        $(document).on('click', '.menu-item[data-url]', function() {
            var url = $(this).data('url');
            var title = $(this).data('title');
            if (!url) return;
            $('.menu-item').removeClass('active');
            $(this).addClass('active');
            openTab(title, url);
            if ($(window).width() <= 768) {
                $('#adminSidebar').removeClass('mobile-show');
            }
        });

        // Menu group collapse/expand
        function toggleMenuGroup($title) {
            var $subMenu = $title.siblings('.sub-menu');
            var expanded = $title.attr('aria-expanded') === 'true';
            $title.toggleClass('collapsed', expanded);
            $title.attr('aria-expanded', expanded ? 'false' : 'true');
            $subMenu.toggleClass('open', !expanded);
        }

        $(document).off('click.menuGroup').on('click.menuGroup', '.menu-group-title', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMenuGroup($(this));
        });

        $(document).off('keydown.menuGroup').on('keydown.menuGroup', '.menu-group-title', function(e) {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            e.stopPropagation();
            toggleMenuGroup($(this));
        });

        // ==================== Tab Management ====================
        function openTab(title, url) {
            if (!url) return;
            if (tabs[url]) { switchTab(url); return; }
            tabs[url] = { title: title, url: url, isHome: url.indexOf('dashboard') > -1 };
            var tabId = 'tab_' + url.replace(/[^a-zA-Z0-9]/g, '_');
            var isHome = tabs[url].isHome;
            var tabHtml = '<div class="tab-item' + (isHome ? ' home' : '') + '" data-url="' + escapeAttr(url) + '">' +
                          '<span>' + escapeHtml(title) + '</span>' +
                          (isHome ? '' : '<i class="layui-icon layui-icon-close tab-close"></i>') +
                          '</div>';
            $('#tabHeader').append(tabHtml);
            var cacheSep = url.indexOf('?') > -1 ? '&' : '?';
            var iframeUrl = url + cacheSep + '_v={% now "YmdHi" %}';
            var iframeHtml = '<iframe class="tab-iframe" id="iframe_' + tabId + '" src="' + escapeAttr(iframeUrl) + '"></iframe>';
            $('#tabContent').append(iframeHtml);
            switchTab(url);
        }

        function switchTab(url) {
            if (!tabs[url]) return;
            activeTabUrl = url;
            $('.tab-item').removeClass('active');
            $('.tab-item[data-url="' + url + '"]').addClass('active');
            $('.tab-iframe').removeClass('active');
            var tabId = 'tab_' + url.replace(/[^a-zA-Z0-9]/g, '_');
            var iframe = $('#iframe_' + tabId);
            if (iframe.length) iframe.addClass('active');
            // Scroll tab into view
            var activeTab = $('.tab-item.active');
            if (activeTab.length) {
                var tabHeader = $('#tabHeader')[0];
                var tabLeft = activeTab.position().left;
                var tabWidth = activeTab.outerWidth();
                var headerWidth = tabHeader.clientWidth;
                var scrollLeft = tabHeader.scrollLeft;
                if (tabLeft < 0) { tabHeader.scrollLeft = scrollLeft + tabLeft - 20; }
                else if (tabLeft + tabWidth > headerWidth) { tabHeader.scrollLeft = scrollLeft + tabLeft + tabWidth - headerWidth + 20; }
            }
            // Sync menu highlight
            $('.menu-item').removeClass('active');
            $('.menu-item[data-url="' + url + '"]').addClass('active');
        }

        function closeTab(url) {
            if (!tabs[url] || tabs[url].isHome) return;
            $('.tab-item[data-url="' + url + '"]').remove();
            var tabId = 'tab_' + url.replace(/[^a-zA-Z0-9]/g, '_');
            $('#iframe_' + tabId).remove();
            delete tabs[url];
            if (activeTabUrl === url) {
                var tabKeys = Object.keys(tabs);
                if (tabKeys.length > 0) switchTab(tabKeys[tabKeys.length - 1]);
            }
        }

        // Tab click
        $(document).on('click', '.tab-item', function(e) {
            if ($(e.target).hasClass('tab-close')) { closeTab($(this).data('url')); return; }
            switchTab($(this).data('url'));
        });

        // Tab right-click context menu
        $(document).on('contextmenu', '.tab-item', function(e) {
            e.preventDefault();
            var url = $(this).data('url');
            if (tabs[url] && tabs[url].isHome) return;
            var menuHtml = '<div style="padding: 4px 0;">' +
                '<div class="dropdown-item" data-action="close-current" style="padding: 8px 16px;">' + t('common.close') + '</div>' +
                '<div class="dropdown-item" data-action="close-others" style="padding: 8px 16px;">' + t('common.closeOthers') + '</div>' +
                '<div class="dropdown-item" data-action="close-all" style="padding: 8px 16px;">' + t('common.closeAll') + '</div>' +
                '</div>';
            layer.open({
                type: 1, title: false, closeBtn: 0, shade: 0, area: ['140px', 'auto'],
                content: menuHtml, offset: [e.clientY + 'px', e.clientX + 'px'],
                success: function(layero, menuIndex) {
                    layero.find('[data-action="close-current"]').on('click', function() { closeTab(url); layer.close(menuIndex); });
                    layero.find('[data-action="close-others"]').on('click', function() {
                        Object.keys(tabs).forEach(function(key) { if (key !== url && !tabs[key].isHome) closeTab(key); });
                        layer.close(menuIndex);
                    });
                    layero.find('[data-action="close-all"]').on('click', function() {
                        Object.keys(tabs).forEach(function(key) { if (!tabs[key].isHome) closeTab(key); });
                        layer.close(menuIndex);
                    });
                }
            });
        });

        // ==================== Update User Info ====================
        function updateUserInfo(data) {
            var nickname = data.nickname || data.username || '';
            $('#userName').text(nickname);
            if (data.avatar) {
                $('#userAvatar').html('<img src="' + data.avatar + '" alt="avatar">');
            } else {
                var initial = nickname.charAt(0).toUpperCase();
                $('#userAvatar').html(initial || '<i class="layui-icon layui-icon-user"></i>');
            }
        }

        // ==================== Theme (Dark/Light only) ====================
        function applyThemeMode(isDark) {
            currentTheme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
            localStorage.setItem('theme', currentTheme);

            // Update theme icon
            if (isDark) {
                $('#themeIcon').removeClass('layui-icon-moon').addClass('layui-icon-light');
            } else {
                $('#themeIcon').removeClass('layui-icon-light').addClass('layui-icon-moon');
            }

            // Notify all iframes
            var themeMode = isDark ? 'dark' : 'light';
            $('iframe[id^="iframe_"]').each(function() {
                var iframe = this;
                try {
                    iframe.contentWindow.postMessage({ type: 'themeChange', themeMode: themeMode, theme: currentTheme }, '*');
                } catch(e) {}
            });
        }

        $('#sidebarToggle').attr('title', t('header.toggleSidebar') || '收起/展开');
        $('#themeToggle').attr('title', t('header.toggleTheme') || '浅色/深色');
        $('#frontendBtn').attr('title', t('header.viewSite') || '访问前台');
        $('#fullscreenBtn').attr('title', t('header.fullscreen') || '全屏');

        // Quick dark/light toggle
        $('#themeToggle').on('click', function() {
            var isDark = currentTheme === 'dark';
            applyThemeMode(!isDark);
            putApi('/admin/api/rbac/profile/theme/', {theme: !isDark ? 'dark' : 'light'}, function(res) {
                if (res.code === 200) layer.msg(t('common.success'), {icon: 1, time: 800});
            });
        });

        // ==================== Sidebar Toggle ====================
        (function initSidebarToggle() {
            var $toggle = $('#sidebarToggle');
            var $sidebar = $('#adminSidebar');

            if (!$toggle.length || !$sidebar.length) {
                console.warn('[Sidebar Toggle] Missing elements');
                return;
            }

            var $icon = $toggle.find('i');

            function toggleFn(e) {
                if (e) { 
                    e.preventDefault(); 
                    e.stopPropagation(); 
                }
                
                sidebarCollapsed = !sidebarCollapsed;
                
                if (sidebarCollapsed) {
                    $sidebar.addClass('collapsed');
                    $icon.removeClass('layui-icon-shrink-right').addClass('layui-icon-spread-left');
                } else {
                    $sidebar.removeClass('collapsed');
                    $icon.removeClass('layui-icon-spread-left').addClass('layui-icon-shrink-right');
                }
            }

            // 使用事件委托，确保事件绑定可靠
            $(document).off('click.sidebarToggle').on('click.sidebarToggle', '#sidebarToggle', function(e) {
                console.log('[Sidebar Toggle] Clicked!');
                toggleFn(e);
            });
        })();

        // ==================== Fullscreen ====================
        $('#fullscreenBtn').on('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(function(){});
                $(this).find('i').removeClass('layui-icon-screen-full').addClass('layui-icon-screen-normal');
            } else {
                document.exitFullscreen();
                $(this).find('i').removeClass('layui-icon-screen-normal').addClass('layui-icon-screen-full');
            }
        });

        // ==================== User Dropdown ====================
        $('#userArea').on('click', function(e) { e.stopPropagation(); $('#userDropdown').toggleClass('show'); });
        $(document).on('click', function() { $('#userDropdown').removeClass('show'); });

        // ==================== Profile ====================
        $('#profileBtn').on('click', function(e) {
            e.stopPropagation();
            $('#userDropdown').removeClass('show');
            if (!currentUser) return;
            layer.open({
                type: 1, title: t('header.personalCenter'), area: ['480px', 'auto'],
                content: renderTpl('profileTpl'),
                success: function(layero) {
                    layero.find('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); var v = t(key); if(v && v !== key) $(this).text(v); });
                    layero.find('#profileNickname').attr('placeholder', t('user.nickname') || '昵称');
                    layero.find('#profilePhone').attr('placeholder', t('user.phone') || '手机号');
                    $('#profileUsername').val(currentUser.username);
                    $('#profileNickname').val(currentUser.nickname || '');
                    $('#profilePhone').val(currentUser.phone || '');
                    var roleNames = (currentUser.roles || []).map(function(r) { return r.name; }).join(', ');
                    $('#profileRoles').val(roleNames || '--');
                    form.render(null, 'profileForm');
                    layero.find('#submitProfileBtn').on('click', function() {
                        var nickname = $('#profileNickname').val().trim();
                        var phone = $('#profilePhone').val().trim();
                        putApi('/admin/api/rbac/profile/', {nickname: nickname, phone: phone}, function(res) {
                            if (res.code === 200) {
                                layer.msg(t('profile.save.success'), {icon: 1});
                                currentUser.nickname = nickname;
                                currentUser.phone = phone;
                                updateUserInfo(currentUser);
                                layer.closeAll();
                            } else {
                                layer.msg(res.msg || t('common.fail'), {icon: 2});
                            }
                        });
                    });
                }
            });
        });

        // ==================== Change Password ====================
        $('#changePasswordBtn').on('click', function(e) {
            e.stopPropagation();
            $('#userDropdown').removeClass('show');
            layer.open({
                type: 1, title: t('header.changePassword'), area: ['480px', 'auto'],
                content: renderTpl('changePasswordTpl'),
                success: function(layero) {
                    layero.find('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); var v = t(key); if(v && v !== key) $(this).text(v); });
                    layero.find('input[name="old_password"]').attr('placeholder', t('profile.oldPassword') || '原密码');
                    layero.find('input[name="new_password"]').attr('placeholder', t('profile.newPassword') || '新密码');
                    layero.find('input[name="confirm_password"]').attr('placeholder', t('profile.confirmPassword') || '确认密码');
                    form.render(null, 'changePasswordForm');
                    layero.find('#submitPasswordBtn').on('click', function() {
                        var $btn = $(this);
                        var oldPwd = layero.find('input[name="old_password"]').val().trim();
                        var newPwd = layero.find('input[name="new_password"]').val().trim();
                        var confirmPwd = layero.find('input[name="confirm_password"]').val().trim();
                        if (!oldPwd || !newPwd || !confirmPwd) { layer.msg(t('common.inputRequired', [t('login.password')]), {icon: 0}); return; }
                        if (newPwd.length < 6) { layer.msg(t('profile.password.minLen'), {icon: 0}); return; }
                        if (newPwd !== confirmPwd) { layer.msg(t('profile.password.diff'), {icon: 0}); return; }
                        
                        // 按钮点击动画：禁用按钮 + 显示加载状态
                        $btn.prop('disabled', true).addClass('layui-btn-disabled').html('<i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop"></i> 提交中..');
                        
                        putApi('/admin/api/rbac/profile/password/', {
                            old_password: oldPwd, new_password: newPwd, confirm_password: confirmPwd
                        }, function(res) {
                            // 恢复按钮状态
                            $btn.prop('disabled', false).removeClass('layui-btn-disabled').html('确认修改');
                            
                            if (res.code === 200) {
                                layer.msg(t('profile.password.success'), {icon: 1, time: 1500, end: function() {
                                    // 使用 window.top 确保在顶层窗口跳转，跳出 iframe
                                    if (window.top) {
                                        window.top.location.href = '/admin/login/';
                                    } else {
                                        location.href = '/admin/login/';
                                    }
                                }});
                            } else {
                                layer.msg(res.msg || t('common.fail'), {icon: 2});
                            }
                        });
                    });
                }
            });
        });

        // ==================== Frontend Button ====================
        $(document).on('click', '#frontendBtn', function() {
            var url = $(this).data('url') || '';
            if (url) {
                window.open(url, '_blank');
            } else {
                layer.msg(t('common.noFrontendUrl'), {icon: 0, time: 2000});
            }
        });

        // ==================== Logout Button ====================
        $('#logoutBtn').on('click', function(e) {
            e.stopPropagation();
            $('#userDropdown').removeClass('show');
            layer.confirm(t('header.logout.confirm'), {
                icon: 3,
                title: t('common.confirm'),
                btn: [t('common.confirm'), t('common.cancel')]
            }, function(index) {
                layer.close(index);
                var xhr = new XMLHttpRequest();
                xhr.open('POST', '/admin/api/rbac/logout/', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.withCredentials = true;
                xhr.onload = function() {
                    window.location.href = '/admin/login/';
                };
                xhr.onerror = function() {
                    window.location.href = '/admin/login/';
                };
                xhr.send(JSON.stringify({}));
            });
        });

        // ==================== Utility Functions ====================
        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }

        // ==================== Session Check (browser back button) ====================
        function checkSession() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/admin/api/rbac/userinfo/', true);
            xhr.withCredentials = true;
            xhr.onload = function() {
                if (xhr.status === 401) {
                    window.location.replace('/admin/login/');
                }
            };
            xhr.send();
        }
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) checkSession();
        });
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) checkSession();
        });

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    });
    </script>
</body>
</html>
