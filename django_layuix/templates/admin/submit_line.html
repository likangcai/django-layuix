{% load i18n admin_urls %}
<div class="layui-form-item" style="margin-top:20px;padding-top:15px;border-top:1px solid var(--border-color)">
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
{% if show_save %}<button type="submit" class="layui-btn" name="_save"><i class="layui-icon layui-icon-ok"></i> {% translate 'Save' %}</button>{% endif %}
{% if show_save_and_continue %}<button type="submit" class="layui-btn layui-btn-warm" name="_continue"><i class="layui-icon layui-icon-edit"></i> {% translate 'Save and continue editing' %}</button>{% endif %}
{% if show_delete_link and original %}<a href="{{ delete_url }}" class="layui-btn layui-btn-danger" style="margin-left:auto"><i class="layui-icon layui-icon-delete"></i> {% translate 'Delete' %}</a>{% endif %}
{% if show_close %}<a role="button" href="{{ changelist_url }}" class="layui-btn layui-btn-primary">{% translate 'Close' %}</a>{% endif %}
</div>
</div>
