{% load i18n %}
<details data-filter-title="{{ title }}" open>
  <summary style="font-size:13px;font-weight:600;cursor:pointer;color:var(--text-primary);padding:4px 0">
    {% blocktranslate with filter_title=title %}By {{ filter_title }}{% endblocktranslate %}
  </summary>
  <ul style="list-style:none;margin:6px 0 10px;padding:0">
  {% for choice in choices %}
    <li{% if choice.selected %} class="selected"{% endif %} style="margin:2px 0">
    <a href="{{ choice.query_string|iriencode }}"
       style="display:block;padding:3px 8px;border-radius:3px;font-size:13px;text-decoration:none;
              color:{% if choice.selected %}var(--primary-color){% else %}var(--text-primary){% endif %};
              background:{% if choice.selected %}var(--primary-light){% else %}transparent{% endif %}">
       {{ choice.display }}</a>
    </li>
  {% endfor %}
  </ul>
</details>
