<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="data.position">岗位管理</title>
    <link rel="icon" type="image/x-icon" href="/static/layui/favicon.ico">
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261130d">
    <link rel="stylesheet" href="/static/layui/css/data-admin.css?v=4">
    <script>
        function syncParentTheme() {
            var themeMode = 'light';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', event.data.themeMode);
            }
        });
    </script>
    <style>
        body { margin: 0; padding: 0; background: var(--bg-primary); }
        .page-container { padding: 16px 18px; min-height: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="data-panel">
        <div class="data-head">
            <div>
                <div class="data-title" data-i18n="data.position">岗位管理</div>
                <div class="data-subtitle" data-i18n="data.positionDesc">维护岗位名称、编码和启用状态</div>
            </div>
            <button type="button" class="layui-btn layui-btn-sm" id="addPositionBtn" data-perm="position:add">
                <i class="layui-icon layui-icon-add-1"></i> <span data-i18n="data.addPosition">新增岗位</span>
            </button>
        </div>
        <div class="data-body">
            <div class="data-toolbar">
                <input type="text" id="positionKeyword" class="layui-input data-keyword" data-i18n-placeholder="data.search" placeholder="搜索名称或编码" autocomplete="off">
                <select id="positionStatus" class="data-status">
                    <option value="" data-i18n="data.allStatus">全部状态</option>
                    <option value="1" data-i18n="data.enabled">启用</option>
                    <option value="0" data-i18n="data.disabled">停用</option>
                </select>
                <button type="button" class="layui-btn layui-btn-sm" id="searchPositionBtn"><i class="layui-icon layui-icon-search"></i></button>
                <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetPositionBtn"><i class="layui-icon layui-icon-refresh"></i></button>
            </div>
            <div class="data-table-host">
                <table id="positionTable" lay-filter="positionTable"></table>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="positionRowToolTpl">
    <div class="data-row-actions">
    {{# if(DataAdmin.hasPerm('position:edit')){ }}
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>{{ t('common.edit') }}</a>
    {{# } }}
    {{# if(DataAdmin.hasPerm('position:delete')){ }}
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete"><i class="layui-icon layui-icon-delete"></i>{{ t('common.delete') }}</a>
    {{# } }}
    </div>
</script>

<script type="text/html" id="positionFormTpl">
    <form class="layui-form admin-dialog-form" lay-filter="positionForm">
        <div class="data-form-grid">
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.name">名称</label>
                <div class="layui-input-block"><input type="text" name="name" class="layui-input" autocomplete="off"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.code">编码</label>
                <div class="layui-input-block"><input type="text" name="code" class="layui-input" autocomplete="off"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.sort">排序</label>
                <div class="layui-input-block"><input type="number" name="sort" class="layui-input" value="0"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.status">状态</label>
                <div class="layui-input-block"><input type="checkbox" name="status" lay-skin="switch" lay-text="启用|停用"></div>
            </div>
            <div class="layui-form-item data-form-full">
                <label class="layui-form-label" data-i18n="data.note">备注</label>
                <div class="layui-input-block"><textarea name="note" class="layui-textarea" placeholder=""></textarea></div>
            </div>
        </div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261130d"></script>
<script src="/static/layui/js/i18n.js?v=20261130d"></script>
<script src="/static/layui/js/data-admin.js?v=3"></script>
<script>
inheritTheme();
renderI18n();

layui.use(['form', 'table', 'layer'], function () {
    var $ = layui.jquery;
    var form = layui.form;
    var table = layui.table;
    var layer = layui.layer;

    function can(code) { return DataAdmin.hasPerm(code); }

    function applyPermissions() {
        $('[data-perm]').each(function () {
            var code = $(this).data('perm');
            if (code && !can(code)) $(this).addClass('permission-hidden');
            else $(this).removeClass('permission-hidden');
        });
    }

    function loadData() {
        var url = '/admin/api/rbac/positions/';
        var keyword = $('#positionKeyword').val().trim();
        var status = $('#positionStatus').val();
        var query = [];
        if (keyword) query.push('keyword=' + encodeURIComponent(keyword));
        if (status !== '') query.push('status=' + encodeURIComponent(status));
        if (query.length) url += '?' + query.join('&');
        getApi(url, function (res) {
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            var rows = (res.data && res.data.list) || [];
            LayuiUI.table({
                elem: '#positionTable',
                id: 'positionTable',
                data: rows,
                page: false,
                height: 'full-270',
                defaultToolbar: [],
                toolbar: DataAdmin.tableToolbar('positions'),
                cols: [[
                    {type: 'checkbox', width: 44},
                    {field: 'name', title: t('data.name'), width: 180},
                    {field: 'code', title: t('data.code'), width: 150},
                    {field: 'sort', title: t('data.sort'), width: 80, align: 'center'},
                    {field: 'status', title: t('data.status'), width: 90, align: 'center', templet: function (d) {
                        return DataAdmin.statusBadge(d.status);
                    }},
                    {field: 'note', title: t('data.note'), minWidth: 220, templet: function (d) {
                        return d.note ? escapeHtml(d.note) : '<span style="color:var(--text-muted);">-</span>';
                    }},
                    {title: t('common.operation'), width: 150, align: 'center', fixed: 'right', toolbar: '#positionRowToolTpl'}
                ]]
            });
        });
    }

    function openDialog(data) {
        var isEdit = !!(data && data.id);
        LayuiUI.dialog({
            tplId: 'positionFormTpl',
            filter: 'positionForm',
            data: isEdit ? data : {status: true, sort: 0},
            title: isEdit ? t('common.edit') + t('data.position') : t('data.addPosition'),
            area: ['580px', 'auto'],
            standard: true,
            onSubmit: function (layero, index) {
                var field = form.val('positionForm');
                var payload = {
                    name: String(field.name || '').trim(),
                    code: String(field.code || '').trim(),
                    sort: parseInt(field.sort, 10) || 0,
                    status: field.status === 'on',
                    note: String(field.note || '').trim()
                };
                if (!payload.name || !payload.code) {
                    layer.msg(t('common.required'), {icon: 2});
                    return false;
                }
                var done = function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('data.saved'), {icon: 1});
                    layer.close(index);
                    loadData();
                };
                if (isEdit) putApi('/admin/api/rbac/positions/' + data.id + '/', payload, done);
                else postApi('/admin/api/rbac/positions/create/', payload, done);
                return false;
            }
        });
    }

    table.on('tool(positionTable)', function (obj) {
        if (obj.event === 'edit') {
            openDialog(obj.data);
        } else if (obj.event === 'delete') {
            DataAdmin.confirmDelete(t('common.confirmDelete'), function () {
                deleteApi('/admin/api/rbac/positions/' + obj.data.id + '/', function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('common.deleteSuccess'), {icon: 1});
                    loadData();
                });
            });
        }
    });

    DataAdmin.bindTableToolbar(table, 'positionTable', 'positions', loadData);
    $('#addPositionBtn').on('click', function () { openDialog(null); });
    $('#searchPositionBtn').on('click', loadData);
    $('#resetPositionBtn').on('click', function () {
        $('#positionKeyword').val('');
        $('#positionStatus').val('');
        loadData();
    });
    $('#positionKeyword').on('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); loadData(); }
    });

    DataAdmin.loadPerms(function () {
        applyPermissions();
        form.render('select');
        loadData();
    });
});
</script>
</body>
</html>
