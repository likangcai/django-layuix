<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dict.title">数据字典</title>
    <link rel="icon" type="image/x-icon" href="/static/layui/favicon.ico">
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126p">
    <script>
        function syncParentTheme() {
            var themeMode = 'light';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', event.data.themeMode);
            }
        });
    </script>
    <style>
        body { margin: 0; padding: 0; background: var(--bg-primary); }
        .page-container { padding: 16px 18px; min-height: 100%; box-sizing: border-box; }
        .dict-layout { display: flex; gap: 16px; height: calc(100vh - 120px); min-height: 480px; }
        .dict-panel {
            display: flex; flex-direction: column; min-width: 0; height: 100%;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-md); box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .dict-panel-left { width: 500px; min-width: 360px; flex: 0 0 500px; }
        .dict-panel-right { flex: 1; }
        .dict-panel-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 14px 18px; border-bottom: 1px solid var(--card-border);
        }
        .dict-panel-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
        .dict-panel-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .dict-panel-body { flex: 1; min-height: 0; padding: 12px 14px 0; display: flex; flex-direction: column; }
        .dict-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
        .dict-toolbar .layui-input { height: 34px; }
        .dict-toolbar .dict-keyword { width: auto; flex: 1 1 150px; min-width: 120px; }
        .dict-toolbar .dict-status { width: 110px; flex: 0 0 110px; }
        .dict-toolbar .layui-btn { height: 34px; line-height: 34px; margin-left: 0; }
        .dict-table-host { flex: 1; min-height: 0; }
        .dict-code { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
        .dict-system-tag { color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; padding: 0 5px; font-size: 11px; }
        .dict-default-tag { color: #1d4ed8; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 0 5px; font-size: 11px; }
        .dict-empty-hint { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
        .dict-current {
            display: inline-flex; align-items: center; gap: 8px; min-width: 0;
            color: var(--text-primary); font-weight: 600;
        }
        .dict-current code { font-weight: 400; color: var(--text-muted); font-size: 12px; }
        .action-chip { display: inline-flex; align-items: center; gap: 3px; height: 24px; line-height: 22px; padding: 0 8px; border-radius: 4px; }
        .dict-row-actions { display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
        .dict-row-actions .layui-btn { margin-left: 0; }
        .permission-hidden { display: none !important; }
        @media (max-width: 900px) {
            .dict-layout { flex-direction: column; height: auto; }
            .dict-panel-left { width: 100%; min-width: 0; flex: 0 0 auto; height: 360px; }
            .dict-panel-right { height: 560px; }
        }
    </style>
</head>
<body>
<div class="page-container">
    <div class="dict-layout">
        <section class="dict-panel dict-panel-left">
            <div class="dict-panel-head">
                <div>
                    <div class="dict-panel-title" data-i18n="dict.dictionaries">字典列表</div>
                    <div class="dict-panel-subtitle" data-i18n="dict.manageHint">统一维护下拉选项、状态值和业务枚举</div>
                </div>
                <button type="button" class="layui-btn layui-btn-sm" id="addDictBtn" data-perm="dict:add">
                    <i class="layui-icon layui-icon-add-1"></i> <span data-i18n="dict.addDictionary">新增字典</span>
                </button>
            </div>
            <div class="dict-panel-body">
                <form class="layui-form dict-toolbar" lay-filter="dictSearchForm">
                    <input type="text" id="dictKeyword" class="layui-input dict-keyword" autocomplete="off" placeholder="搜索字典名称或编码" data-i18n-placeholder="dict.searchPlaceholder">
                    <select id="dictStatus" class="dict-status">
                        <option value="">全部状态</option>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                    <button type="button" class="layui-btn layui-btn-sm" id="searchDictBtn"><i class="layui-icon layui-icon-search"></i></button>
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetDictBtn"><i class="layui-icon layui-icon-refresh"></i></button>
                </form>
                <div class="dict-table-host"><table id="dictTable" lay-filter="dictTable"></table></div>
            </div>
        </section>

        <section class="dict-panel dict-panel-right">
            <div class="dict-panel-head">
                <div class="dict-current" id="currentDictTitle">
                    <span data-i18n="dict.items">字典项</span>
                </div>
                <div>
                    <button type="button" class="layui-btn layui-btn-sm" id="addItemBtn" data-perm="dict:edit" disabled>
                        <i class="layui-icon layui-icon-add-1"></i> <span data-i18n="dict.addItem">新增字典项</span>
                    </button>
                </div>
            </div>
            <div class="dict-panel-body">
                <form class="layui-form dict-toolbar" lay-filter="dictItemSearchForm">
                    <input type="text" id="itemKeyword" class="layui-input dict-keyword" autocomplete="off" placeholder="搜索名称或数据值" data-i18n-placeholder="dict.itemSearchPlaceholder">
                    <select id="itemStatus" class="dict-status">
                        <option value="">全部状态</option>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                    <button type="button" class="layui-btn layui-btn-sm" id="searchItemBtn"><i class="layui-icon layui-icon-search"></i></button>
                    <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetItemBtn"><i class="layui-icon layui-icon-refresh"></i></button>
                    <span class="layui-word-aux" style="margin-left:auto;" data-i18n="dict.optionsHint">业务页面可通过 options 接口读取启用项</span>
                </form>
                <div class="dict-table-host"><table id="dictItemTable" lay-filter="dictItemTable"></table></div>
            </div>
        </section>
    </div>
</div>

    <form class="layui-form admin-dialog-form" lay-filter="dictForm" style="padding:20px 24px 0;">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444;">*</span> 字典名称</label>
            <div class="layui-input-block"><input type="text" name="name" class="layui-input" autocomplete="off" placeholder="如：订单状态"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label"><span style="color:#ef4444;">*</span> 字典编码</label>
            <div class="layui-input-block"><input type="text" name="code" class="layui-input" autocomplete="off" placeholder="如：order_status"></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">排序</label>
                <div class="layui-input-inline" style="width:110px;"><input type="number" name="sort" class="layui-input" value="0"></div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline" style="width:110px;"><input type="checkbox" name="status" lay-skin="switch" lay-text="启用|禁用"></div>

        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">描述</label>
            <div class="layui-input-block"><textarea name="description" class="layui-textarea" placeholder="说明字典用途"></textarea></div>

        <input type="hidden" name="id">
        <input type="hidden" name="dictionary_id">
        <div class="layui-form-item">

            <label class="layui-form-label"><span style="color:#ef4444;">*</span> 数据值</label>
            <div class="layui-input-block"><input type="text" name="value" class="layui-input" autocomplete="off" placeholder="如：pending"></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline">
                <label class="layui-form-label">排序</label>
                <div class="layui-input-inline" style="width:100px;"><input type="number" name="sort" class="layui-input" value="0"></div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline" style="width:100px;"><input type="checkbox" name="status" lay-skin="switch" lay-text="启用|禁用"></div>
            </div>
            <div class="layui-inline">
                <label class="layui-form-label">默认项</label>

            <div class="layui-input-block"><input type="text" name="css_class" class="layui-input" autocomplete="off" placeholder="可选，如：success"></div>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261126p"></script>
<script src="/static/layui/js/i18n.js?v=20261126p"></script>
<script>
inheritTheme();
renderI18n();

layui.use(['form', 'table', 'layer'], function () {
    var $ = layui.jquery;
    var form = layui.form;
    var table = layui.table;
    var layer = layui.layer;

    var currentUser = (window.parent && window.parent.currentUser) || {};
    var permissions = currentUser.permissions || [];
    var currentDict = null;
    var dictPage = 1;
    var dictPageSize = 20;
    var itemPage = 1;
    var itemPageSize = 20;
    var loadingDict = false;
    var loadingItem = false;

    function can(code) {
        return currentUser.is_superuser || permissions.indexOf(code) > -1;
    }

    function applyPermissions() {
        $('[data-perm]').each(function () {
            var code = $(this).data('perm');
            if (code && !can(code)) $(this).addClass('permission-hidden');
            else $(this).removeClass('permission-hidden');
        });
        if (currentDict) {
            $('#addItemBtn').prop('disabled', !can('dict:edit'));
        }
    }

    function bootstrapCurrentUser(callback) {
        if (permissions.length || currentUser.is_superuser) {
            applyPermissions();
            callback();
            return;
        }
        getApi('/admin/api/rbac/userinfo/', function (res) {
            if (res.code === 200 && res.data) {
                currentUser = res.data;
                permissions = currentUser.permissions || [];
                try { window.parent.currentUser = currentUser; } catch (e) {}
                applyPermissions();
            }
            callback();
        });
    }

    function statusBadge(d) {
        return d.status
            ? '<span class="layui-badge layui-bg-green">' + t('common.enable') + '</span>'
            : '<span class="layui-badge layui-bg-gray">' + t('common.disable') + '</span>';
    }

    function loadDictionaries(selectId) {
        if (loadingDict) return;
        loadingDict = true;
        var keyword = $('#dictKeyword').val() || '';
        var status = $('#dictStatus').val();
        var url = '/admin/api/rbac/dictionaries/?page=' + dictPage + '&page_size=' + dictPageSize
            + '&keyword=' + encodeURIComponent(keyword)
            + (status !== '' ? '&status=' + encodeURIComponent(status) : '');
        getApi(url, function (res) {
            loadingDict = false;
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            var data = res.data || {};
            renderDictTable(data.list || [], data.total || 0);
            var rows = data.list || [];
            if (selectId) {
                var selected = rows.filter(function (item) { return item.id === selectId; })[0];
                if (selected) selectDictionary(selected, false);
            } else if (!currentDict && rows.length) {
                selectDictionary(rows[0], false);
            }
        });
    }

    function renderDictTable(rows, total) {
        LayuiUI.table({
            elem: '#dictTable',
            id: 'dictTable',
            data: rows,
            height: 'full-250',
            page: {
                limit: dictPageSize,
                limits: [10, 20, 50, 100],
                curr: dictPage,
                count: total,
                layout: ['count', 'prev', 'page', 'next', 'skip'],
                jump: function (obj, first) {
                    if (!first) {
                        dictPage = obj.curr;
                        dictPageSize = obj.limit;
                        loadDictionaries();
                    }
                }
            },
            cols: [[
                {field: 'name', title: t('dict.name'), minWidth: 170, templet: function (d) {
                    var title = '<div>' + escapeHtml(d.name);
                    if (d.is_system) title += ' <span class="dict-system-tag">' + t('dict.system') + '</span>';
                    if (!d.status) title += ' <span class="layui-badge layui-bg-gray">' + t('common.disable') + '</span>';
                    title += '</div>';
                    return title + '<div class="dict-code">' + escapeHtml(d.code) + '</div>';
                }},
                {field: 'item_count', title: t('dict.itemCount'), width: 78, align: 'center'},
                {title: t('common.operation'), width: 220, align: 'center', toolbar: '#dictToolTpl'}
            ]]
        });
        form.render('checkbox');
    }

    function selectDictionary(dict, scrollTop) {
        currentDict = dict || null;
        itemPage = 1;
        if (!currentDict) {
            $('#currentDictTitle').html('<span>' + t('dict.items') + '</span>');
            $('#addItemBtn').prop('disabled', true);
            renderItemTable([], 0);
            return;
        }
        $('#currentDictTitle').html(
            '<span>' + escapeHtml(currentDict.name) + '</span>'
            + '<code>' + escapeHtml(currentDict.code) + '</code>'
            + (currentDict.is_system ? '<span class="dict-system-tag">' + t('dict.system') + '</span>' : '')
        );
        $('#addItemBtn').prop('disabled', !can('dict:edit'));
        loadItems();
    }

    function loadItems() {
        if (!currentDict) return;
        if (loadingItem) return;
        loadingItem = true;
        var keyword = $('#itemKeyword').val() || '';
        var status = $('#itemStatus').val();
        var url = '/admin/api/rbac/dictionaries/' + currentDict.id + '/items/?page=' + itemPage
            + '&page_size=' + itemPageSize
            + '&keyword=' + encodeURIComponent(keyword)
            + (status !== '' ? '&status=' + encodeURIComponent(status) : '');
        getApi(url, function (res) {
            loadingItem = false;
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            var data = res.data || {};
            renderItemTable(data.list || [], data.total || 0);
        });
    }

    function renderItemTable(rows, total) {
        LayuiUI.table({
            elem: '#dictItemTable',
            id: 'dictItemTable',
            data: rows,
            height: 'full-250',
            page: {
                limit: itemPageSize,
                limits: [10, 20, 50, 100],
                curr: itemPage,
                count: total,
                layout: ['count', 'prev', 'page', 'next', 'skip'],
                jump: function (obj, first) {
                    if (!first) {
                        itemPage = obj.curr;
                        itemPageSize = obj.limit;
                        loadItems();
                    }
                }
            },
            cols: [[
                {field: 'label', title: t('dict.itemLabel'), width: 150, templet: function (d) {
                    var label = '<span>' + escapeHtml(d.label) + '</span>';
                    return d.is_default ? label + ' <span class="dict-default-tag">' + t('dict.defaultTag') + '</span>' : label;
                }},
                {field: 'value', title: t('dict.itemValue'), width: 120, templet: function (d) {
                    return '<code>' + escapeHtml(d.value) + '</code>';
                }},
                {field: 'sort', title: t('dict.sort'), width: 65, align: 'center'},
                {field: 'status', title: t('dict.status'), width: 72, align: 'center', templet: statusBadge},
                {field: 'remark', title: t('dict.remark'), width: 110, templet: function (d) {
                    return d.remark ? escapeHtml(d.remark) : '<span style="color:var(--text-muted);">-</span>';
                }},
                {title: t('common.operation'), width: 175, align: 'center', toolbar: '#dictItemToolTpl'}
            ]]
        });
        form.render('checkbox');
    }

    function openDictDialog(data) {
        var isEdit = !!(data && data.id);
        LayuiUI.dialog({
            tplId: 'dictFormTpl',
            filter: 'dictForm',
            data: isEdit ? data : {status: true, sort: 0},
            title: isEdit ? t('dict.editDictionary') : t('dict.addDictionary'),
            area: ['560px', 'auto'],
            standard: true,
            onSubmit: function (layero, index) {
                var field = form.val('dictForm');
                var payload = {
                    name: String(field.name || '').trim(),
                    code: String(field.code || '').trim().toLowerCase(),
                    description: String(field.description || '').trim(),
                    sort: parseInt(field.sort, 10) || 0,
                    status: field.status === 'on'
                };
                if (!payload.name || !payload.code) {
                    layer.msg(t('common.required'), {icon: 2});
                    return false;
                }
                var done = function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('dict.saved'), {icon: 1});
                    layer.close(index);
                    loadDictionaries(isEdit ? data.id : (res.data && res.data.id));
                };
                if (isEdit) putApi('/admin/api/rbac/dictionaries/' + data.id + '/', payload, done);
                else postApi('/admin/api/rbac/dictionaries/create/', payload, done);
                return false;
            }
        });
    }

    function openItemDialog(data) {
        if (!currentDict) {
            layer.msg(t('dict.selectHint'), {icon: 0});
            return;
        }
        var isEdit = !!(data && data.id);
        LayuiUI.dialog({
            tplId: 'dictItemFormTpl',
            filter: 'dictItemForm',
            data: isEdit ? data : {
                dictionary_id: currentDict.id, status: true, is_default: false, sort: 0
            },
            title: (isEdit ? t('dict.editItem') : t('dict.addItem')) + ' - ' + currentDict.name,
            area: ['600px', 'auto'],
            standard: true,
            onSubmit: function (layero, index) {
                var field = form.val('dictItemForm');
                var payload = {
                    label: String(field.label || '').trim(),
                    value: String(field.value || '').trim(),
                    sort: parseInt(field.sort, 10) || 0,
                    status: field.status === 'on',
                    is_default: field.is_default === 'on',
                    css_class: String(field.css_class || '').trim(),
                    remark: String(field.remark || '').trim()
                };
                if (!payload.label || !payload.value) {
                    layer.msg(t('common.required'), {icon: 2});
                    return false;
                }
                var done = function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('dict.itemSaved'), {icon: 1});
                    layer.close(index);
                    loadItems();
                    loadDictionaries(currentDict.id);
                };
                if (isEdit) putApi('/admin/api/rbac/dictionary-items/' + data.id + '/', payload, done);
                else postApi('/admin/api/rbac/dictionaries/' + currentDict.id + '/items/create/', payload, done);
                return false;
            }
        });
    }

    table.on('row(dictTable)', function (obj) {
        obj.tr.addClass('layui-table-click').siblings().removeClass('layui-table-click');
        selectDictionary(obj.data, true);
    });

    table.on('tool(dictTable)', function (obj) {
        if (obj.event === 'edit') {
            openDictDialog(obj.data);
        } else if (obj.event === 'delete') {
            if (obj.data.is_system) {
                layer.msg(t('dict.systemProtected'), {icon: 2});
                return;
            }
            confirmDelete(t('dict.deleteDictionaryConfirm'), function () {
                deleteApi('/admin/api/rbac/dictionaries/' + obj.data.id + '/', function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    if (currentDict && currentDict.id === obj.data.id) selectDictionary(null);
                    layer.msg(t('common.deleteSuccess'), {icon: 1});
                    loadDictionaries();
                });
            });
        }
    });

    table.on('tool(dictItemTable)', function (obj) {
        if (obj.event === 'edit') {
            openItemDialog(obj.data);
        } else if (obj.event === 'delete') {
            confirmDelete(t('dict.deleteItemConfirm'), function () {
                deleteApi('/admin/api/rbac/dictionary-items/' + obj.data.id + '/', function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('common.deleteSuccess'), {icon: 1});
                    loadItems();
                    loadDictionaries(currentDict.id);
                });
            });
        }
    });

    $('#addDictBtn').on('click', function () { openDictDialog(null); });
    $('#addItemBtn').on('click', function () { openItemDialog(null); });
    $('#searchDictBtn').on('click', function () { dictPage = 1; loadDictionaries(currentDict ? currentDict.id : null); });
    $('#resetDictBtn').on('click', function () {
        $('#dictKeyword').val('');
        $('#dictStatus').val('');
        dictPage = 1;
        loadDictionaries();
    });
    $('#searchItemBtn').on('click', function () { itemPage = 1; loadItems(); });
    $('#resetItemBtn').on('click', function () {
        $('#itemKeyword').val('');
        $('#itemStatus').val('');
        itemPage = 1;
        loadItems();
    });
    $('#dictKeyword, #itemKeyword').on('keydown', function (event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            $(this).is('#dictKeyword') ? $('#searchDictBtn').click() : $('#searchItemBtn').click();
        }
    });

    bootstrapCurrentUser(function () {
        applyPermissions();
        loadDictionaries();
    });
});
</script>
</body>
</html>
