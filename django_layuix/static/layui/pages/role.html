<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126x">
    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .layui-form-label { width: 120px; padding: 9px 12px 9px 0; }
        .layui-input-block { margin-left: 130px; }
        .menu-tree-box {
            border: 1px solid var(--card-border);
            border-radius: 6px;
            max-height: 300px; overflow-y: auto; padding: 10px;
            background: var(--bg-primary);
        }
        .permission-assign-dialog { padding: 16px 20px 0; }
        .permission-assign-toolbar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
        }
        .permission-assign-toolbar .layui-input { width: 240px; }
        .scope-assign-panel {
            display: grid; grid-template-columns: 90px 1fr 90px 1fr; gap: 8px; align-items: center;
            padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--card-border);
            border-radius: var(--radius-md); background: var(--bg-secondary);
        }
        .scope-assign-panel label { font-size: 13px; color: var(--text-secondary); }
        .scope-assign-panel .layui-input { height: 32px; }
        .permission-tree-wrap {
            height: 360px; overflow: auto; padding: 12px 14px;
            border: 1px solid var(--card-border); border-radius: var(--radius-md);
            background: var(--bg-primary);
        }
        .permission-tree-wrap .layui-tree-set { margin-bottom: 2px; }
        .permission-tree-wrap .permission-code { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
        .permission-assign-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0 4px; color: var(--text-secondary); font-size: 13px;
        }
        .permission-tree-set-hidden { display: none !important; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; }
        .role-row-actions { display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
        .role-row-actions .layui-btn { margin-left: 0; }
        .role-form-actions { position: sticky; bottom: 0; z-index: 2; display: flex; justify-content: flex-end; gap: 8px; margin: 0 -30px -1px; padding: 12px 30px 14px; background: var(--bg-primary); border-top: 1px solid var(--card-border); }
        .role-form-actions .layui-btn { margin-left: 0; }
        .role-more-btn .layui-icon { margin-left: 2px; font-size: 12px; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
        /* 半选状态样式 */
        .layui-form-checkbox.layui-form-halfchecked {
            background-color: #1E9FFF !important;
            border-color: #1E9FFF !important;
        }
        .layui-form-checkbox.layui-form-halfchecked i {
            background: none !important;
            width: 10px !important;
            height: 2px !important;
            top: 50% !important;
            margin-top: -1px !important;
            margin-left: -5px !important;
            background-color: #fff !important;
            transform: rotate(0deg) !important;
            border-radius: 0 !important;
            border: none !important;
            display: block !important;
            line-height: 0 !important;
            font-size: 0 !important;
        }
    </style>
</head>

<script src="/static/layui/lib/layui.js"></script>
    <script src="/static/layui/js/common.js?v=20261126x"></script>
    <script src="/static/layui/js/i18n.js?v=20261126x"></script>
    <script>
inheritTheme();

// 初始化语言
if (window.parent && window.parent.I18N) {
    window.I18N = window.parent.I18N;
    window.t = window.parent.t;
} else {
    I18N.getLang();
}

layui.use(['table', 'tree', 'form', 'layer', 'element', 'dropdown'], function(){
    var table = layui.table;
    var tree = layui.tree;
    var form = layui.form;
    var layer = layui.layer;
    var element = layui.element;
    var dropdown = layui.dropdown;
    var $ = layui.$;

    // 初始化 data-i18n 和 {{ t() }} 占位符
    $('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); $(this).text(t(key)); });
    renderI18n();
    document.title = t('role.title');

    var currentUser = window.parent.currentUser || {};
    var permissionTreeReady = false;
    var permissions = currentUser.permissions || [];
    var allRoles = [];
    var tableRoles = [];
    var currentRoleFormData = null;

    function loadAllRoles(callback) {
        if (allRoles.length) {
            if (callback) callback();
            return;
        }
        getApi('/admin/api/rbac/roles/', function(res) {
            if (res.code === 200) allRoles = res.data || [];
            if (callback) callback();
        });
    }

    function isDescendantRole(candidateId, currentId) {
        if (!currentId || !candidateId) return false;
        var byId = {};
        allRoles.forEach(function(role) { byId[role.id] = role; });
        var visited = {};
        var queue = [candidateId];
        while (queue.length) {
            var id = queue.shift();
            if (visited[id]) continue;
            visited[id] = true;
            var role = byId[id];
            if (!role) continue;
            var parents = role.parent_ids || (role.parent_id ? [role.parent_id] : []);
            if (parents.indexOf(currentId) > -1) return true;
            queue = queue.concat(parents);
        }
        return false;
    }

    function collectInheritedPermissionCount(roleId) {
        var byId = {};
        allRoles.forEach(function(role) { byId[role.id] = role; });
        var visited = {};
        var codes = {};
        var queue = [roleId];
        while (queue.length) {
            var current = queue.shift();
            if (visited[current]) continue;
            visited[current] = true;
            var role = byId[current];
            if (!role) continue;
            (role.parent_ids || (role.parent_id ? [role.parent_id] : [])).forEach(function(parentId) {
                (byId[parentId] && byId[parentId].menu_ids || []).forEach(function(menuId) { codes[menuId] = true; });
                queue.push(parentId);
            });
        }
        return Object.keys(codes).length;
    }

    function updateInheritPreview(layero) {
        var selected = [];
        layero.find('#parentRoleBox input[name="parent_role"]:checked').each(function() {
            selected.push(parseInt($(this).val(), 10));
        });
        var count = 0;
        selected.forEach(function(id) { count += collectInheritedPermissionCount(id); });
        layero.find('#parentInheritPreview').text(
            selected.length ? t('role.parentPreview', [count]) : t('role.parentPreviewNone')
        );
    }

    function renderParentRoles(layero, excludeId, parentIds) {
        var checked = {};
        (parentIds || []).forEach(function(id) { checked[String(id)] = true; });
        var html = '';
        allRoles.forEach(function(role) {
            if (excludeId && role.id === excludeId) return;
            html += '<label style="display:inline-block;margin:0 14px 6px 0;">'
                + '<input type="checkbox" name="parent_role" value="' + role.id + '"' + (checked[String(role.id)] ? ' checked' : '') + '> '
                + escapeHtml(role.name) + '</label>';
        });
        layero.find('#parentRoleBox').html(html || '<span style="color:var(--text-muted);">' + t('role.noParentRoles') + '</span>');
        layero.find('#parentRoleBox').off('change.parentRole').on('change.parentRole', 'input[name="parent_role"]', function() {
            if ($(this).prop('checked') && isDescendantRole(parseInt($(this).val(), 10), excludeId)) {
                $(this).prop('checked', false);
                layer.msg(t('role.cycleWarning'), {icon: 2});
            }
            form.render('checkbox', 'roleForm');
            updateInheritPreview(layero);
        });
        form.render('checkbox', 'roleForm');
        updateInheritPreview(layero);
    }

    function buildRoleIndex(roles) {
        var byId = {};
        (roles || []).forEach(function(role) { byId[role.id] = role; });
        return byId;
    }

    function roleDepth(role, byId) {
        var depth = 0;
        var parents = role.parent_ids || (role.parent_id ? [role.parent_id] : []);
        var current = parents.length ? byId[parents[0]] : null;
        while (current && depth < 10) {
            depth++;
            var next = current.parent_ids || (current.parent_id ? [current.parent_id] : []);
            current = next.length ? byId[next[0]] : null;
        }
        return depth;
    }

    function inheritedPermissionCount(role, byId) {
        var codes = {};
        var visited = {};
        var queue = role.parent_ids || (role.parent_id ? [role.parent_id] : []);
        while (queue.length) {
            var id = queue.shift();
            if (visited[id]) continue;
            visited[id] = true;
            var parent = byId[id];
            if (!parent) continue;
            (parent.menu_ids || []).forEach(function(menuId) { codes[menuId] = true; });
            queue = queue.concat(parent.parent_ids || (parent.parent_id ? [parent.parent_id] : []));
        }
        return Object.keys(codes).length;
    }

    // 加载角色列表
    function loadTable() {
        getApi('/admin/api/rbac/roles/', function(res) {
            if (res.code !== 200) return;
            var roles = res.data || [];
            tableRoles = roles;
            var byId = buildRoleIndex(roles);
            var hasAdvanced = roles.some(function(role) {
                return role.parent_id || (role.parent_ids || []).length || role.scope_node;
            });
            var cols = [[
                {type: 'checkbox', fixed: 'left', width: 44},
                {field: 'id', title: t('common.id'), width: 70, align: 'center'},
                {field: 'name', title: t('role.name'), width: 190, templet: function(d) {
                    var depth = roleDepth(d, byId);
                    var prefix = depth ? '<span style="color:var(--text-muted);">└ </span>' : '';
                    var badge = d.scope_node
                        ? ' <span class="layui-badge layui-bg-blue">' + escapeHtml(d.scope_node) + '</span>'
                        : '';
                    return '<span style="padding-left:' + (depth * 16) + 'px;">' + prefix + escapeHtml(d.name) + '</span>' + badge;
                }},
                {field: 'code', title: t('role.code'), width: 150},
                {field: 'description', title: t('role.description'), minWidth: 200},
                {field: 'is_system', title: t('role.isSystem'), width: 100, align: 'center', templet: function(d) {
                    return d.is_system
                        ? '<span class="layui-badge">' + t('role.system') + '</span>'
                        : '<span class="layui-badge layui-bg-gray">' + t('role.normal') + '</span>';
                }},
                {field: 'status', title: t('common.status'), width: 100, align: 'center', templet: function(d) {
                    return '<input type="checkbox" name="roleStatus" value="' + d.id + '" lay-skin="switch" lay-filter="roleStatus" lay-text="' +
                        t('common.enable') + '|' + t('common.disable') + '"' +
                        (d.status ? ' checked' : '') + (d.is_system ? ' disabled' : '') + '>';
                }},
                {field: 'create_time', title: t('user.createTime'), width: 170, align: 'center'},
                {title: t('common.operation'), width: 260, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
            ]];
            if (hasAdvanced) {
                cols[0].splice(4, 0, {title: t('role.permissionCount'), width: 150, align: 'center', templet: function(d) {
                    var own = (d.menu_ids || []).length;
                    var inherited = inheritedPermissionCount(d, byId);
                    return t('role.permissionSummary', [own + inherited, own, inherited]);
                }});
            }
            LayuiUI.table({
                elem: '#roleTable',
                toolbar: '#toolbarTpl',
                defaultToolbar: [],
                data: roles,
                height: 'full-220',
                page: {
                    limit: 10,
                    limits: [10, 30, 50, 100],
                    groups: 5,
                    layout: ['count', 'prev', 'page', 'next', 'skip', 'limit']
                },
                even: true,
                done: function() {
                    form.render('checkbox');
                },
                cols: cols
            });
        });
    }

    // 构建权限树数据（layui tree格式）
    function buildPermTreeData(menuTree, checkedIdSet) {
        function convert(items) {
            var result = [];
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var isChecked = checkedIdSet && checkedIdSet[String(item.id)];
                result.push({
                    id: item.id,
                    title: item.name + (item.permission ? ' (' + item.permission + ')' : ''),
                    checked: !!isChecked,
                    children: item.children ? convert(item.children) : []
                });
            }
            return result;
        }
        return convert(menuTree || []);
    }

    function applyExactTreeChecks($container, checkedSet) {
        $container.find('.layui-tree-set').each(function() {
            var $input = $(this).find('input[type="checkbox"]').first();
            var $checkbox = $input.next('.layui-form-checkbox');
            $input.prop('checked', false);
            $checkbox.removeClass('layui-form-checked').removeClass('layui-form-halfchecked');
        });
        $container.find('.layui-tree-set').each(function() {
            var nodeId = String($(this).data('id') || '');
            if (checkedSet[nodeId]) {
                var $input = $(this).find('input[type="checkbox"]').first();
                var $checkbox = $input.next('.layui-form-checkbox');
                $input.prop('checked', true);
                $checkbox.addClass('layui-form-checked');
            }
        });
        syncTreeParentStates($container, Object.keys(checkedSet));
    }

    function syncTreeParentStates($container, pinnedIds) {
        var pinned = {};
        (pinnedIds || []).forEach(function(id) { pinned[String(id)] = true; });

        function visit($set) {
            var nodeId = String($set.data('id') || '');
            var $children = $set.children('.layui-tree-child').children('.layui-tree-set');
            var $input = $set.find('input[type="checkbox"]').first();
            var $checkbox = $input.next('.layui-form-checkbox');
            var state;
            if (!$children.length) {
                state = {checked: !!$input.prop('checked'), half: false};
            } else {
                var checkedCount = 0;
                var childHalf = false;
                $children.each(function() {
                    var childState = visit($(this));
                    if (childState.checked || childState.half) checkedCount++;
                    if (childState.half) childHalf = true;
                });
                var all = checkedCount === $children.length;
                state = {checked: all, half: (checkedCount > 0 && !all) || childHalf};
            }
            if (pinned[nodeId]) state = {checked: true, half: false};
            $input.prop('checked', state.checked);
            $checkbox.toggleClass('layui-form-checked', state.checked)
                .toggleClass('layui-form-halfchecked', state.half);
            return state;
        }

        $container.children('.layui-tree-set').each(function() { visit($(this)); });
    }

    function menuTreeUrl(roleData) {
        var keepIds = roleData && roleData.menu_ids ? roleData.menu_ids.join(',') : '';
        return '/admin/api/rbac/menus/tree/?exclude_catalog=1'
            + (keepIds ? '&keep_ids=' + encodeURIComponent(keepIds) : '');
    }

    // 参考项目式角色授权：独立弹窗 + 勾选树 + 展开/折叠 + 幂等保存
    function openPermissionDialog(roleData) {
        getApi(menuTreeUrl(roleData), function(res) {
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            var checkedSet = {};
            (roleData.menu_ids || []).forEach(function(id) { checkedSet[String(id)] = true; });
            var treeData = buildPermTreeData(res.data || [], checkedSet);
            var selectedIds = [];

            function updateSelectedCount() {
                var count = layeroCache.find('#permissionTree input[type="checkbox"]:checked').length;
                layeroCache.find('#permissionSelectedCount').text(t('role.selectedCount', [count]));
            }

            function setNodeState($set, checked) {
                var $input = $set.find('input[type="checkbox"]').first();
                var $checkbox = $input.next('.layui-form-checkbox');
                $input.prop('checked', checked);
                $checkbox.toggleClass('layui-form-checked', checked).removeClass('layui-form-halfchecked');
                $set.children('.layui-tree-child').children('.layui-tree-set').each(function() {
                    setNodeState($(this), checked);
                });
            }

            function syncParentState($set) {
                var $children = $set.children('.layui-tree-child').children('.layui-tree-set');
                if (!$children.length) return;
                var checkedCount = 0;
                $children.each(function() {
                    if ($(this).find('input[type="checkbox"]').first().prop('checked')) checkedCount++;
                });
                var all = checkedCount === $children.length;
                var some = checkedCount > 0 && !all;
                var $input = $set.find('input[type="checkbox"]').first();
                var $checkbox = $input.next('.layui-form-checkbox');
                $input.prop('checked', all);
                $checkbox.toggleClass('layui-form-checked', all).toggleClass('layui-form-halfchecked', some);
                syncParentState($set.parent().closest('.layui-tree-set'));
            }

            function filterTree(keyword) {
                keyword = String(keyword || '').trim().toLowerCase();
                function walk($set) {
                    var ownMatch = !keyword || $set.text().toLowerCase().indexOf(keyword) > -1;
                    var childMatch = false;
                    $set.children('.layui-tree-child').children('.layui-tree-set').each(function() {
                        if (walk($(this))) childMatch = true;
                    });
                    var visible = ownMatch || childMatch;
                    $set.toggleClass('permission-tree-set-hidden', !visible);
                    return visible;
                }
                layeroCache.find('#permissionTree > .layui-tree-set').each(function() { walk($(this)); });
            }

            var layeroCache = $();
            var dialogIndex = LayuiUI.dialog({
                type: 1,
                title: t('role.grantPermissions') + ' - ' + escapeHtml(roleData.name || ''),
                area: ['720px', '620px'],
                btn: [t('common.save'), t('common.cancel')],
                content: renderTpl('permissionDialogTpl'),
                yes: function(index, layero) {
                    layeroCache = $(layero);
                    selectedIds = [];
                    layeroCache.find('#permissionTree .layui-tree-set').each(function() {
                        var $set = $(this);
                        var $input = $set.find('input[type="checkbox"]').first();
                        if ($input.prop('checked') && !$input.next('.layui-form-checkbox').hasClass('layui-form-halfchecked')) {
                            selectedIds.push($set.data('id'));
                        }
                    });
                    var $btn = layeroCache.find('.layui-layer-btn0');
                    $btn.prop('disabled', true).addClass('layui-btn-disabled');
                    putApi('/admin/api/rbac/roles/' + roleData.id + '/update/', {
                        scope_node: layeroCache.find('#authScopeNode').val() || '',
                        scope_depth: parseInt(layeroCache.find('#authScopeDepth').val(), 10) || 0,
                        menu_ids: selectedIds
                    }, function(saveRes) {
                        $btn.prop('disabled', false).removeClass('layui-btn-disabled');
                        if (saveRes.code !== 200) {
                            layer.msg(saveRes.msg || t('common.fail'), {icon: 2});
                            return;
                        }
                        layer.msg(t('role.grantSuccess'), {icon: 1});
                        layer.close(index);
                        loadTable();
                    });
                },
                success: function(layero, index) {
                    layeroCache = $(layero);
                    getApi('/admin/api/rbac/scope-nodes/', function(scopeRes) {
                        var options = ['<option value="">' + escapeHtml(t('role.scopeUnrestricted')) + '</option>'];
                        function walkScope(nodes) {
                            (nodes || []).forEach(function(node) {
                                options.push('<option value="' + escapeHtml(node.code) + '">' +
                                    escapeHtml(node.name + ' (' + node.code + ')') + '</option>');
                                walkScope(node.children);
                            });
                        }
                        walkScope(scopeRes.code === 200 ? (scopeRes.data || []) : []);
                        layeroCache.find('#authScopeNode').html(options.join('')).val(roleData.scope_node || '');
                        layeroCache.find('#authScopeDepth').val(roleData.scope_depth || 0);
                    });
                    tree.render({
                        elem: layeroCache.find('#permissionTree')[0],
                        data: treeData,
                        showCheckbox: true,
                        showLine: true,
                        id: 'rolePermissionGrantTree'
                    });
                    applyExactTreeChecks(layeroCache.find('#permissionTree'), checkedSet);
                    layeroCache.find('#permissionSearch').on('input', function() { filterTree($(this).val()); });
                    layeroCache.find('#permissionExpandAll').on('click', function() {
                        layeroCache.find('#permissionTree .layui-tree-child').show();
                    });
                    layeroCache.find('#permissionCollapseAll').on('click', function() {
                        layeroCache.find('#permissionTree .layui-tree-child').hide();
                    });
                    layeroCache.find('#permissionTree').off('click.permissionGrant').on('click.permissionGrant', '.layui-form-checkbox', function(e) {
                        var $checkbox = $(this);
                        var $set = $checkbox.closest('.layui-tree-set');
                        var checked = !$set.find('input[type="checkbox"]').first().prop('checked');
                        setNodeState($set, checked);
                        syncTreeParentStates(layeroCache.find('#permissionTree'));
                        updateSelectedCount();
                    });
                    updateSelectedCount();
                    renderI18n();
                }
            });
        });
    }

    // 打开角色表单弹窗
    function openRoleForm(roleData) {
        currentRoleFormData = roleData || null;
        var isEdit = !!roleData;
        var title = isEdit ? t('common.edit') + t('role.title') : t('common.add') + t('role.title');

        getApi(menuTreeUrl(roleData), function(res) {
            if (res.code !== 200) return;
            var menuTree = res.data || [];
            
            // 准备选中的ID集合
            var checkedIds = isEdit ? (roleData.menu_ids || []) : [];
            var checkedIdSet = {};
            for (var i = 0; i < checkedIds.length; i++) {
                checkedIdSet[String(checkedIds[i])] = true;
            }
            
            // 构建树数据时直接标记选中状态
            var permTreeData = buildPermTreeData(menuTree, checkedIdSet);

            var layerIndex = LayuiUI.dialog({
                type: 1,
                title: title,
                area: ['600px', 'auto'],
                content: renderTpl('roleFormTpl'),
                success: function(layero, index) {
                    // 渲染权限树
                    tree.render({
                        elem: layero.find('#menuPermTree')[0],
                        data: permTreeData,
                        showLine: true,
                        showCheckbox: true,
                        id: 'menuPermTreeInst'
                    });

                    if (isEdit) {
                        form.val('roleForm', {
                            id: roleData.id,
                            name: roleData.name,
                            code: roleData.code,
                            description: roleData.description || '',
                            status: roleData.status,
                            max_users: roleData.max_users || ''
                        });
                    }

                    form.render(null, 'roleForm');
                    loadAllRoles(function() {
                        renderParentRoles(layero, isEdit ? roleData.id : null, isEdit ? (roleData.parent_ids || []) : []);
                    });
                    
                    // 在 tree 渲染后，按精确 ID 回显，避免父节点级联污染
                    permissionTreeReady = false;
                    layero.find('[lay-filter="roleSubmit"]').prop('disabled', true).addClass('layui-btn-disabled');
                    (function applyWhenReady(attempts) {
                        var $tree = layero.find('#menuPermTree');
                        if ($tree.find('.layui-tree-set').length || attempts <= 0) {
                            if (!$tree.find('.layui-tree-set').length) {
                                layer.msg(t('common.loadFailed'), {icon: 2});
                                return;
                            }
                            var idSet = {};
                            for (var i = 0; i < checkedIds.length; i++) {
                                idSet[String(checkedIds[i])] = true;
                            }
                            applyExactTreeChecks($tree, idSet);
                            permissionTreeReady = true;
                            layero.find('[lay-filter="roleSubmit"]').prop('disabled', false).removeClass('layui-btn-disabled');
                            return;
                        }
                        setTimeout(function() { applyWhenReady(attempts - 1); }, 50);
                    })(60);



                    
                    // 添加 checkbox 点击事件，实现父节点勾选联动子节点
                    layero.off('click.menuPermTree').on('click.menuPermTree', '#menuPermTree .layui-form-checkbox', function(e) {
                        var $checkbox = $(this);
                        var $input = $checkbox.prev('input[type="checkbox"]');
                        var $treeSet = $checkbox.closest('.layui-tree-set');
                        var isChecked = !$input.prop('checked');
                        
                        // 先切换当前 checkbox 状态
                        $input.prop('checked', isChecked);
                        if (isChecked) {
                            $checkbox.addClass('layui-form-checked');
                        } else {
                            $checkbox.removeClass('layui-form-checked');
                        }
                        
                        // 递归设置所有子节点状态
                        function setChildrenChecked($parent, checked) {
                            $parent.children('.layui-tree-child').children('.layui-tree-set').each(function() {
                                var $childSet = $(this);
                                var $childInput = $childSet.find('input[type="checkbox"]').first();
                                var $childCheckbox = $childInput.next('.layui-form-checkbox');
                                
                                $childInput.prop('checked', checked);
                                if (checked) {
                                    $childCheckbox.addClass('layui-form-checked');
                                } else {
                                    $childCheckbox.removeClass('layui-form-checked');
                                }
                                
                                // 递归处理子节点的子节点
                                setChildrenChecked($childSet, checked);
                            });
                        }
                        
                        // 联动子节点
                        setChildrenChecked($treeSet, isChecked);
                        syncTreeParentStates(layero.find('#menuPermTree'));
                    });
                }
            });
        });

        // 角色表单提交（绑定一次，避免重复绑定）
        bindFormOnce('submit(roleSubmit)', function(data) {

                    $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                    
                    if (res.code === 200) {

                        layer.msg(res.msg || t('common.fail'), {icon: 2});

                    $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                    
                    if (res.code === 200) {

                        layer.closeAll();
                        loadTable();
                    } else {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                    }
                });

        });
    }

    // 打开更多下拉菜单
    function openRoleMoreMenu(elem, data) {
        var $elem = $(elem);
        var cu = window.currentUser || window.parent.currentUser || {};
        var perms = cu.permissions || [];
        var isSuper = cu.is_superuser || false;
        var menu = [{id: 'permissions', title: t('role.permissions')}];
        if (isSuper || layui.$.inArray('role:copy', perms) > -1) {
            menu.push({id: 'copy', title: t('role.copy.title')});
        }
        if (!data.is_system && (isSuper || layui.$.inArray('role:delete', perms) > -1)) {
            menu.push({id: 'del', title: t('common.delete')});
        }
        var dropdownId = $elem.data('dropdownId');
        if (!dropdownId) {
            dropdownId = 'role-more-' + data.id + '-' + Date.now();
            $elem.data('dropdownId', dropdownId);
        }
        var options = {
            id: dropdownId,
            elem: elem,
            data: menu,
            click: function(item) {
                handleRoleMoreAction(item.id, data);
            }
        };
        if ($elem.attr('lay-dropdown-id')) {
            dropdown.reload(dropdownId, options);
        } else {
            dropdown.render(options);
        }
        dropdown.open(dropdownId);
    }

        }
    });

    table.on('switch(roleStatus)', function(obj) {
        var data = obj.data || {};
        var desired = !!obj.elem.checked;
        if (data.is_system) {
            obj.elem.checked = !desired;
            form.render('checkbox');
            layer.msg(t('role.systemCannotDelete'), {icon: 2});
            return;
        }
        postApi('/admin/api/rbac/roles/' + data.id + '/status/', {status: desired}, function(res) {
            if (res.code !== 200) {
                obj.elem.checked = !desired;
                form.render('checkbox');
                layer.msg(res.msg || t('common.fail'), {icon: 2});
                return;
            }
            loadTable();
        });
    });

    // 初始化：等待用户信息就绪后再渲染依赖权限的工具栏
    LayuiUI.ensureCurrentUser(function() {
        loadAllRoles();
        loadTable();
    });
});
</script>
</body>
</html>
