<!DOCTYPE html>

    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'dark';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .search-bar { margin-bottom: 16px; }
        .search-bar .layui-form-item { margin-bottom: 16px; }
        .search-bar .layui-inline { margin-right: 16px; }
        .search-bar .layui-form-label { width: 120px; padding: 9px 12px 9px 0; }
        .search-bar .search-btns { text-align: right; padding-bottom: 0; }
        .search-bar .search-btns .layui-btn { margin-left: 8px; }
        .role-tags { display: inline-block; margin: 0 2px; }
        .btn-disabled { opacity: 0.4; cursor: not-allowed !important; pointer-events: none; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
    </style>
</head>

<script src="/static/layui/lib/layui.js"></script>
    <script src="/static/layui/js/common.js?v=1.4.2b"></script>
    <script src="/static/layui/js/i18n.js?v=1.4.2"></script>
    <script>
inheritTheme();

// 初始化语言
if (window.parent && window.parent.I18N) {
    window.I18N = window.parent.I18N;
    window.t = window.parent.t;
} else {
    I18N.getLang();
}

layui.use(['table', 'form', 'layer', 'laypage'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var laypage = layui.laypage;
    var $ = layui.$;

    // 初始化 data-i18n 和 {{ t() }} 占位符
    $('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); $(this).text(t(key)); });
    renderI18n();
    document.title = t('user.title');
    form.render('select');

    var currentUser = window.parent.currentUser || {};
    var permissions = currentUser.permissions || [];

    // 分页参数
    var currentPage = 1;
    var pageSize = 10;
    var total = 0;

    // 角色列表缓存
    var roleList = [];

    function checkSodConflict(containerId, roleIds, userId) {
        var $warning = $('#' + containerId).find('.sod-warning');
        if (!roleIds.length) {
            $warning.attr('data-blocked', '0').text('');
            return;
        }
        postApi('/admin/api/rbac/sod-constraints/check/', {user_id: userId || null, role_ids: roleIds}, function(res) {
            if (res.code !== 200) return;
            var data = res.data || {};
            if (data.exempt) {
                $warning.attr('data-blocked', '0').text(data.message || t('user.sodExempt'));
                return;
            }
            if (!data.allowed) {
                var names = [];
                (data.conflicts || []).forEach(function(item) {
                    names.push(item.constraint_name);
                });
                $warning.attr('data-blocked', '1').text(t('user.sodWarning', [names.join('、')]));
            } else {
                $warning.attr('data-blocked', '0').text('');
            }
        });
    }

    // 当前操作的用户数据缓存
    var currentEditUserData = null;
    var currentResetPwdUserData = null;

    // 加载角色列表
    function loadRoles(callback) {
        getApi('/admin/api/rbac/roles/', function(res) {
            if (res.code === 200) {
                roleList = res.data || [];
            }
            if (typeof callback === 'function') callback();
        });
    }

    // 构建角色多选下拉HTML - 使用自定义多选下拉框，支持点击勾选多个选项，显示为标签
    function buildRoleSelectHtml(containerId, selectedIds) {
        selectedIds = selectedIds || [];
        
        // 根据是否已选择角色决定初始背景色
        var wrapperBg = selectedIds.length > 0 ? '#fff' : 'transparent';
        
        var html = '<div class="layui-form-select role-multi-select" style="position:relative;">';
        // 隐藏的输入框（仅用于占位和表单提交）
        html += '<input type="text" readonly style="position:absolute;top:0;left:0;width:100%;height:38px;z-index:0;opacity:0;" />'; 
        // 自定义placeholder - z-index为1，显示在wrapper下方
        html += '<div class="role-placeholder" style="position:absolute;top:50%;left:10px;transform:translateY(-50%);color:#999;font-size:14px;z-index:1;pointer-events:none;' + (selectedIds.length > 0 ? 'display:none;' : '') + '">' + t('user.selectRole') + '</div>';
        // 标签显示层（覆盖在placeholder上方）
        html += '<div class="role-tags-wrapper" style="position:relative;z-index:2;min-height:38px;padding:3px 30px 3px 10px;cursor:pointer;background:' + wrapperBg + ';border:1px solid #e6e6e6;border-radius:2px;">';
        html += '<div class="role-tags-container" style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:32px;">';
        html += '</div>';
        html += '</div>';
        html += '<i class="layui-edge" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none;"></i>';
        // 下拉列表
        html += '<dl class="layui-anim layui-anim-upbit" style="max-height:300px;overflow-y:auto;z-index:9999;border:1px solid #e6e6e6;border-top:none;background:#fff;">';
        for (var i = 0; i < roleList.length; i++) {
            var role = roleList[i];
            var selectedClass = selectedIds.indexOf(role.id) > -1 ? 'layui-this' : '';
            html += '<dd data-value="' + escapeHtml(role.id) + '" data-name="' + escapeHtml(role.name) + '" class="' + selectedClass + '">' + escapeHtml(role.name) + ' (' + escapeHtml(role.code) + ')</dd>';
        }
        html += '</dl>';
        // 隐藏字段存储选中的ID
        html += '<input type="hidden" name="role_ids" value="' + selectedIds.join(',') + '" />';
        html += '<div class="sod-warning" data-blocked="0" style="color:var(--danger-color,#ff5722);font-size:12px;padding:4px 10px;"></div>';
        html += '</div>';
        
        $('#' + containerId).html(html);
        
        // 初始化多选下拉框事件
        initRoleMultiSelect(containerId, selectedIds);
    }
    
    // 初始化角色多选下拉框
    function initRoleMultiSelect(containerId, initialSelectedIds) {
        var $container = $('#' + containerId);
        var $select = $container.find('.layui-form-select');
        var $wrapper = $select.find('.role-tags-wrapper');
        var $tagsContainer = $select.find('.role-tags-container');
        var $dl = $select.find('dl');
        var $input = $select.find('input[type="text"]');
        var $hiddenInput = $select.find('input[type="hidden"]');
        var selectedIds = initialSelectedIds || [];
        
        // 渲染标签
        function renderTags() {
            $tagsContainer.empty();
            selectedIds.forEach(function(id) {
                var $dd = $dl.find('dd[data-value="' + id + '"]');
                if ($dd.length) {
                    var name = $dd.data('name');
                    var $tag = $('<span class="role-tag" style="display:inline-flex;align-items:center;background:#5FB878;color:#fff;padding:2px 8px;border-radius:3px;font-size:12px;cursor:default;">');
                    $tag.html('<span>' + name + '</span><i class="layui-icon layui-icon-close" style="margin-left:4px;cursor:pointer;font-size:14px;line-height:1;"></i>');
                    $tagsContainer.append($tag);
                    
                    // 点击×删除标签
                    $tag.find('.layui-icon-close').on('click', function(e) {
                        e.stopPropagation();
                        var idx = selectedIds.indexOf(id);
                        if (idx > -1) {
                            selectedIds.splice(idx, 1);
                            $hiddenInput.val(selectedIds.join(','));
                            $dl.find('dd[data-value="' + id + '"]').removeClass('layui-this');
                            renderTags();
                        }
                    });
                }
            });
            
            // 控制placeholder显示/隐藏和wrapper背景
            var $placeholder = $select.find('.role-placeholder');
            if (selectedIds.length === 0) {
                $placeholder.show();
                // 没有选中时，wrapper背景透明，让placeholder可见
                $wrapper.css('background', 'transparent');
            } else {
                $placeholder.hide();
                // 有选中时，wrapper背景白色，遮挡placeholder
                $wrapper.css('background', '#fff');
            }
        }
        
        // 点击wrapper展开/收起
        $wrapper.on('click', function(e) {
            e.stopPropagation();
            var isShow = $dl.is(':visible');
            if (isShow) {
                $dl.hide();
                $select.removeClass('layui-form-selected');
            } else {
                // 关闭其他下拉框
                $('.role-multi-select').not($select).find('dl').hide();
                $('.role-multi-select').not($select).removeClass('layui-form-selected');
                $dl.show();
                $select.addClass('layui-form-selected');
            }
        });
        
        // 点击选项切换选中状态
        $dl.find('dd').on('click', function(e) {
            e.stopPropagation();
            var $dd = $(this);
            var value = $dd.data('value');
            
            // 切换选中状态
            if ($dd.hasClass('layui-this')) {
                $dd.removeClass('layui-this');
                // 从已选列表中移除
                var idx = selectedIds.indexOf(value);
                if (idx > -1) {
                    selectedIds.splice(idx, 1);
                }
            } else {
                $dd.addClass('layui-this');
                // 添加到已选列表
                if (selectedIds.indexOf(value) === -1) {
                    selectedIds.push(value);
                }
            }
            
            // 更新隐藏字段和标签
            $hiddenInput.val(selectedIds.join(','));
            renderTags();
            checkSodConflict(containerId, selectedIds, currentEditUserData && currentEditUserData.id);
        });
        
        // 点击外部收起
        $(document).off('click.roleSelect_' + containerId).on('click.roleSelect_' + containerId, function(e) {
            if (!$(e.target).closest($select).length) {
                $dl.hide();
                $select.removeClass('layui-form-selected');
            }
        });
        
        // 初始化标签
        renderTags();
    }

    // 加载用户列表
    function loadTable() {
        var keyword = $('#searchKeyword').val().trim();
        var isActive = $('#searchStatus').val();

        var url = '/admin/api/rbac/users/?page=' + currentPage + '&page_size=' + pageSize;
        if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
        if (isActive !== '') url += '&is_active=' + isActive;

        getApi(url, function(res) {
            if (res.code === 200) {
                var rawData = res.data;
                var list = Array.isArray(rawData) ? rawData : (rawData.list || []);
                total = Array.isArray(rawData) ? list.length : (rawData.total || 0);

                var tableIns = table.render({
                    elem: '#userTable',
                    toolbar: '#toolbarTpl',
                    defaultToolbar: [],
                    data: list,
                    height: 'full-220',
                    page: {
                        limit: pageSize,
                        limits: [10, 30, 50, 100],
                        curr: currentPage,
                        count: total,
                        layout: ['count', 'prev', 'page', 'next', 'skip', 'limit'],
                        jump: function(obj, first) {
                            if (!first) {
                                currentPage = obj.curr;
                                pageSize = obj.limit;
                                loadTable();
                            }
                        }
                    },
                    even: true,
                    cols: [[
                        {field: 'id', title: t('common.id'), width: 70, align: 'center'},
                        {field: 'username', title: t('user.username'), width: 120},
                        {field: 'nickname', title: t('user.nickname'), width: 120},
                        {field: 'phone', title: t('user.phone'), width: 130},
                        {field: 'email', title: t('user.email'), width: 180},
                        {field: 'roles', title: t('user.role'), minWidth: 150, templet: function(d) {
                            if (!d.roles || d.roles.length === 0) return '<span style="color:var(--text-muted);">' + t('user.noRole') + '</span>';
                            var html = '';
                            for (var i = 0; i < d.roles.length; i++) {
                                html += '<span class="layui-badge layui-bg-blue role-tags">' + escapeHtml(d.roles[i].name) + '</span>';
                            }
                            return html;
                        }},
                        {field: 'is_active', title: t('user.status'), width: 90, align: 'center', templet: function(d) {
                            return d.is_active
                                ? '<span class="layui-badge layui-bg-green">' + t('user.enabled') + '</span>'
                                : '<span class="layui-badge layui-bg-gray">' + t('user.disabled') + '</span>';
                        }},
                        {field: 'is_tester', title: t('user.tester'), width: 100, align: 'center', templet: function(d) {
                            return d.is_tester
                                ? '<span class="layui-badge layui-bg-orange">' + t('common.yes') + '</span>'
                                : '<span class="layui-badge layui-bg-gray">' + t('common.no') + '</span>';
                        }},
                        {field: 'date_joined', title: t('user.createTime'), width: 170, align: 'center'},
                        {title: t('common.operation'), width: 400, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
                    ]],
                    done: function(res, curr, count) {
                        window._userTableIns = this;
                    }
                });
            } else {
                layer.msg(res.msg || t('common.loadFailed') || '加载失败', {icon: 2});
            }
        });
    }

    // 密码校验
    form.verify({
        password: function(value) {
            if (value && value.length < 6) {
                return t('profile.password.minLen');
            }
        },
        confirmPwd: function(value) {
            var pwd = $('[lay-filter="resetPwdForm"] input[name="password"]').val();
            if (value !== pwd) {
                return t('profile.password.diff');
            }
        }
    });

    // 打开新增用户弹窗
    function openAddUserForm() {
        loadRoles(function() {
            layer.open({
                type: 1,
                title: t('user.addForm.title'),
                area: ['550px', 'auto'],
                content: renderTpl('addUserFormTpl'),
                success: function(layero, index) {
                    buildRoleSelectHtml('addRoleSelect', []);
                    form.render(null, 'addUserForm');
                }
            });
        });
    }

    // 新增用户表单提交（绑定一次，避免重复绑定）
    form.on('submit(addUserSubmit)', function(data) {
        var field = data.field;
        
        // 收集所有选中的角色（从隐藏字段获取，值是逗号分隔的字符串）
        var roleIds = [];
        if (field.role_ids && field.role_ids !== '') {
            roleIds = field.role_ids.split(',').map(function(id) { return parseInt(id); });
        }
        if ($('#addRoleSelect').find('.sod-warning').attr('data-blocked') === '1') {
            layer.msg(t('user.sodConflict'), {icon: 2});
            return false;
        }

        var submitData = {
            username: field.username,
            password: field.password,
            nickname: field.nickname || '',
            phone: field.phone || '',
            email: field.email || '',
            role_ids: roleIds,
            is_tester: field.is_tester === 'on'
        };

        postApi('/admin/api/rbac/users/create/', submitData, function(res) {
            if (res.code === 200) {
                layer.msg(t('common.addSuccess'), {icon: 1});
                layer.closeAll();
                loadTable();
            } else {
                layer.msg(res.msg || t('common.fail'), {icon: 2});
            }
        });
        return false;
    });

    // 打开编辑用户弹窗
    function openEditUserForm(userData) {
        currentEditUserData = userData;
        loadRoles(function() {
            layer.open({
                type: 1,
                title: t('user.editForm.title'),
                area: ['550px', 'auto'],
                content: renderTpl('editUserFormTpl'),
                success: function(layero, index) {
                    form.val('editUserForm', {
                        id: userData.id,
                        username: userData.username,
                        nickname: userData.nickname || '',
                        phone: userData.phone || '',
                        email: userData.email || '',
                        is_tester: userData.is_tester
                    });

                    var selectedIds = [];
                    if (userData.roles && userData.roles.length > 0) {
                        for (var i = 0; i < userData.roles.length; i++) {
                            selectedIds.push(userData.roles[i].id);
                        }
                    }
                    buildRoleSelectHtml('editRoleSelect', selectedIds);

                    form.render(null, 'editUserForm');
                }
            });
        });
    }

    // 编辑用户表单提交（绑定一次，避免重复绑定）
    form.on('submit(editUserSubmit)', function(data) {
        var field = data.field;
        
        // 收集所有选中的角色（从隐藏字段获取，值是逗号分隔的字符串）
        var roleIds = [];
        if (field.role_ids && field.role_ids !== '') {
            roleIds = field.role_ids.split(',').map(function(id) { return parseInt(id); });
        }
        if ($('#editRoleSelect').find('.sod-warning').attr('data-blocked') === '1') {
            layer.msg(t('user.sodConflict'), {icon: 2});
            return false;
        }

        var submitData = {
            nickname: field.nickname || '',
            phone: field.phone || '',
            email: field.email || '',
            role_ids: roleIds,
            is_tester: field.is_tester === 'on'
        };

        if (!currentEditUserData) {
            layer.msg(t('user.missingInfo'), {icon: 2});
            return false;
        }
        
        putApi('/admin/api/rbac/users/' + currentEditUserData.id + '/update/', submitData, function(res) {
            if (res.code === 200) {
                layer.msg(t('common.updateSuccess'), {icon: 1});
                layer.closeAll();
                loadTable();
            } else {
                layer.msg(res.msg || t('common.fail'), {icon: 2});
            }
        });
        return false;
    });

    // 打开重置密码弹窗
    function openResetPwdForm(userData) {
        currentResetPwdUserData = userData;
        layer.open({
            type: 1,
            title: t('user.resetPassword.title') + ' - ' + userData.username,
            area: ['450px', 'auto'],
            content: renderTpl('resetPwdFormTpl'),
            success: function(layero, index) {
                form.val('resetPwdForm', {
                    username: userData.username
                });
                form.render(null, 'resetPwdForm');

                layero.find('#cancelResetPwd').off('click.resetPwd').on('click.resetPwd', function() {
                    layer.close(index);
                });
            }
        });
    }

    // 重置密码表单提交（绑定一次，避免重复绑定）
    form.on('submit(resetPwdSubmit)', function(data) {
        var field = data.field;
        if (field.password !== field.confirm_password) {
            layer.msg(t('profile.password.diff'), {icon: 2});
            return false;
        }
        if (field.password.length < 6) {
            layer.msg(t('profile.password.minLen'), {icon: 2});
            return false;
        }

        if (!currentResetPwdUserData) {
            layer.msg(t('user.missingInfo'), {icon: 2});
            return false;
        }
        putApi('/admin/api/rbac/users/' + currentResetPwdUserData.id + '/reset-password/', {new_password: field.password}, function(res) {
            if (res.code === 200) {
                layer.msg(t('user.passwordResetSuccess'), {icon: 1});
                layer.closeAll();
            } else {
                layer.msg(res.msg || t('common.fail'), {icon: 2});
            }
        });
        return false;
    });

    // 搜索 - 使用事件委托确保绑定成功
    $(document).off('click.userSearch').on('click.userSearch', '#searchBtn', function(e) {
        e.preventDefault();
        currentPage = 1;
        loadTable();
    });

    // 重置搜索
    $(document).off('click.userReset').on('click.userReset', '#resetBtn', function(e) {
        e.preventDefault();
        currentPage = 1;
        $('#searchKeyword').val('');
        $('#searchStatus').val('');
        form.render('select');
        loadTable();
    });

    // 回车搜索
    $(document).off('keydown.userSearch').on('keydown.userSearch', '#searchKeyword', function(e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            currentPage = 1;
            loadTable();
        }
    });

    // 工具栏事件
    table.on('toolbar(userTable)', function(obj) {
        if (obj.event === 'add') {
            openAddUserForm();
        } else if (obj.event === 'refresh') {
            loadTable();
        }
    });

    // 操作列事件
    table.on('tool(userTable)', function(obj) {
        var data = obj.data;
        if (obj.event === 'view') {
            var roleNames = '';
            if (data.roles && data.roles.length > 0) {
                for (var i = 0; i < data.roles.length; i++) {
                    roleNames += (i > 0 ? ', ' : '') + escapeHtml(data.roles[i].name);
                }
            }
            var content = '<div style="padding: 20px 30px;">' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.username') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.username || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.nickname') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.nickname || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.phone') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.phone || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.email') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.email || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.role') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(roleNames || t('user.noRole')) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.status') + '</label><div class="layui-input-block"><input type="text" value="' + (data.is_active ? t('user.enabled') : t('user.disabled')) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.tester') + '</label><div class="layui-input-block"><input type="text" value="' + (data.is_tester ? t('common.yes') : t('common.no')) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.createTime') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.date_joined || '') + '" class="layui-input" readonly></div></div>' +
                '</div>';
            layer.open({
                type: 1,
                title: t('common.view') + ' ' + t('user.title') + ' - ' + data.username,
                area: ['550px', '480px'],
                content: content,
                btn: [t('common.cancel')]
            });
        } else if (obj.event === 'edit') {
            openEditUserForm(data);
        } else if (obj.event === 'resetPwd') {
            openResetPwdForm(data);
        } else if (obj.event === 'toggleStatus') {
            if (data.username === 'admin') {
                layer.msg(t('user.adminCannotDisable'), {icon: 2});
                return;
            }
            var action = data.is_active ? t('common.disable') : t('common.enable');
            layer.confirm(t('common.confirm') + action + t('user.username') + ' <b>' + escapeHtml(data.username) + '</b> ?', {
                icon: 3,
                title: action + t('common.confirm'),
                btn: [t('common.confirm'), t('common.cancel')]
            }, function(index) {
                putApi('/admin/api/rbac/users/' + data.id + '/status/', {is_active: !data.is_active}, function(res) {
                    if (res.code === 200) {
                        layer.msg(t('user.statusChanged', [action]), {icon: 1});
                        layer.close(index);
                        loadTable();
                    } else {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                    }
                });
            });
        } else if (obj.event === 'del') {
            if (data.username === 'admin') {
                layer.msg(t('user.adminCannotDelete'), {icon: 2});
                return;
            }
            layer.confirm(t('common.confirmDelete') + '<br><b>' + escapeHtml(data.username) + '</b>', {
                icon: 3,
                title: t('common.deleteConfirm.title'),
                btn: [t('common.confirm'), t('common.cancel')]
            }, function(index) {
                deleteApi('/admin/api/rbac/users/' + data.id + '/delete/', function(res) {
                    if (res.code === 200) {
                        layer.msg(t('common.deleteSuccess'), {icon: 1});
                        layer.close(index);
                        loadTable();
                    } else {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                    }
                });
            });
        }
    });

    // 初始化
    loadTable();
});
</script>
</body>
</html>
