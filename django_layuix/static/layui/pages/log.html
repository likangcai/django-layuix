<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>操作日志 - 软件测试管理后台</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css"?v=20261124j>
    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'dark';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .log-container { padding: 20px 24px; min-height: 100%; }
        .search-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            padding: 16px 20px 0;
            margin-bottom: 16px;
        }
        .search-card .layui-form-item { margin-bottom: 16px; }
        .search-card .layui-inline { margin-right: 16px; }
        .search-card .layui-form-label { width: 120px; padding: 9px 12px 9px 0; }
        .search-card .search-btns { text-align: right; padding-bottom: 16px; }
        .search-card .search-btns .layui-btn { margin-left: 8px; }
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            padding: 16px;
        }
        .method-tag {
            display: inline-block; padding: 1px 6px; border-radius: 3px;
            font-size: 12px; font-weight: 600; font-family: monospace;
        }
        .method-GET { background: rgba(59,130,246,0.1); color: var(--info-color); }
        .method-POST { background: rgba(16,185,129,0.1); color: var(--success-color); }
        .method-PUT { background: rgba(245,158,11,0.1); color: var(--warning-color); }
        .method-DELETE { background: rgba(239,68,68,0.1); color: var(--danger-color); }
    </style>
</head>
<body>
    <div class="log-container">
        <!-- 搜索栏 -->
        <div class="search-card">
            <form class="layui-form" lay-filter="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="log.search.user">操作用户</label>
                        <div class="layui-input-inline" style="width: 180px;">
                            <input type="text" name="username" placeholder="{{ t('log.search.username') }}" class="layui-input" autocomplete="off">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="log.search.module">操作模块</label>
                        <div class="layui-input-inline" style="width: 180px;">
                            <select name="module" lay-filter="module" id="moduleSelect">
                                <option value="">{{ t('log.allModules') || '全部模块' }}</option>
                                <option value="菜单">{{ t('menu.title') || '菜单管理' }}</option>
                                <option value="角色">{{ t('role.title') || '角色管理' }}</option>
                                <option value="用户">{{ t('user.title') || '用户管理' }}</option>
                                <option value="系统配置">{{ t('config.title') || '系统配置' }}</option>
                                <option value="个人中心">{{ t('profile.title') || '个人中心' }}</option>
                                <option value="服务器">{{ t('server.title') || '服务器管理' }}</option>
                                <option value="AI配置">{{ t('ai.title') || 'AI配置' }}</option>
                                <option value="语言切换" id="langSwitchOption">语言切换</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="log.search.status">操作状态</label>
                        <div class="layui-input-inline" style="width: 180px;">
                            <select name="status" lay-filter="status">
                                <option value="">{{ t('log.allStatus') }}</option>
                                <option value="1">{{ t('log.status.success') }}</option>
                                <option value="0">{{ t('log.status.fail') }}</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline">
                        <label class="layui-form-label" data-i18n="log.search.timeRange">时间范围</label>
                        <div class="layui-input-inline" style="width: 220px;">
                            <input type="text" name="dateRange" id="dateRange" placeholder="{{ t('log.selectTime') }}" class="layui-input" readonly autocomplete="off">
                        </div>
                    </div>
                    <div class="layui-inline search-btns" style="margin-right:0;">
                        <button type="button" class="layui-btn layui-btn-sm" id="btnSearch" lay-submit lay-filter="searchLog">
                            <i class="layui-icon layui-icon-search"></i> {{ t('common.search') }}
                        </button>
                        <button type="reset" class="layui-btn layui-btn-sm layui-btn-primary" id="btnReset">
                            <i class="layui-icon layui-icon-refresh"></i> {{ t('common.reset') }}
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- 日志列表表格 -->
        <div class="table-card">
            <table id="logTable" lay-filter="logTable"></table>
        </div>
    </div>

    <!-- 日志操作列模板 -->
    <script type="text/html" id="logOperateTpl">
        <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="view">{{ t('common.view') }}</a>
    </script>

    <script src="/static/layui/lib/layui.js"></script>
    <script src="/static/layui/js/common.js?v=20261124i"></script>
    <script src="/static/layui/js/i18n.js"></script>
    <script>
    inheritTheme();

    // 初始化语言
    if (window.parent && window.parent.I18N) {
        window.I18N = window.parent.I18N;
        window.t = window.parent.t;
    } else {
        I18N.getLang();
    }

    layui.use(['table', 'form', 'laydate', 'layer'], function(){
        var table = layui.table;
        var form = layui.form;
        var laydate = layui.laydate;
        var layer = layui.layer;
        var $ = layui.$;

        // 初始化 data-i18n 和 {{ t() }} 占位符
        $('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); $(this).text(t(key)); });
        renderI18n();

        // 动态翻译下拉框选项（因为 {{ t() }} 在服务端渲染时无法执行）
        if (typeof t === 'function') {
            $('#moduleSelect option').each(function(){
                var $opt = $(this);
                var text = $opt.text();
                if (text && text.indexOf('{{') === -1 && $opt.val()) {
                    var mapKey = {
                        '菜单': 'menu.title',
                        '角色': 'role.title',
                        '用户': 'user.title',
                        '系统配置': 'config.title',
                        '个人中心': 'profile.title',
                        '服务器': 'server.title',
                        'AI配置': 'ai.title',
                        '语言切换': 'log.module.languageSwitch'
                    };
                    var key = mapKey[text];
                    if (key) {
                        var translated = t(key);
                        if (translated && translated !== key) {
                            $opt.text(translated);
                        }
                    }
                }
            });
            // 翻译状态下拉框
            $('#moduleSelect').siblings('.layui-form-select').find('dl dd').each(function(){
                var $dd = $(this);
                var text = $dd.text();
                var mapKey = {
                    '菜单': 'menu.title',
                    '角色': 'role.title',
                    '用户': 'user.title',
                    '系统配置': 'config.title',
                    '个人中心': 'profile.title',
                    '服务器': 'server.title',
                    'AI配置': 'ai.title',
                    '语言切换': 'log.module.languageSwitch'
                };
                var key = mapKey[text];
                if (key) {
                    var translated = t(key);
                    if (translated && translated !== key) {
                        $dd.find('span').text(translated);
                    }
                }
            });
        }

        form.render('select');

        // 初始化日期范围选择器
        laydate.render({
            elem: '#dateRange',
            type: 'datetime',
            range: '~',
            format: 'yyyy-MM-dd HH:mm:ss',
            max: 0
        });

        // 获取搜索参数（不含分页参数，分页由 layui table 自动管理）
        function getSearchParams() {
            var formData = form.val('searchForm');
            var params = {};

            if (formData.username && formData.username.trim()) {
                params.username = formData.username.trim();
            }
            if (formData.module && formData.module !== '') {
                params.module = formData.module;
            }
            // 修复：正确处理status的空值判断
            if (formData.status !== undefined && formData.status !== null && formData.status !== '') {
                params.status = formData.status;
            }
            if (formData.dateRange) {
                var parts = formData.dateRange.split(' ~ ');
                if (parts.length === 2) {
                    params.start_time = parts[0];
                    params.end_time = parts[1];
                }
            }

            return params;
        }

        // 渲染请求方法标签
        function renderMethod(d) {
            var method = d.method || '';
            var cls = 'method-' + method;
            return '<span class="method-tag ' + cls + '">' + method + '</span>';
        }

        // 渲染操作状态
        function renderStatus(d) {
            if (d.status === 1) {
                return '<span class="layui-badge layui-bg-green">' + t('log.status.success') + '</span>';
            } else {
                return '<span class="layui-badge" style="background:var(--danger-color);">' + t('log.status.fail') + '</span>';
            }
        }

        // 模块名中文映射（数据库已存储为中文名，此处保留用于向后兼容）
        var moduleMap = {
            'menus': t('menu.title') || '菜单',
            'roles': t('role.title') || '角色',
            'users': t('user.title') || '用户',
            'configs': t('config.title') || '系统配置',
            'config': t('config.title') || '系统配置',
            'profile': t('profile.title') || '个人中心',
            'servers': t('server.title') || '服务器',
            'ai': t('ai.title') || 'AI配置',
            'ai-configs': t('ai.title') || 'AI配置',
            'ai_config': t('ai.title') || 'AI配置',
            'set-language': '语言切换',
            'set-default': '默认设置',
        };

        // 渲染表格
        function renderTable(params) {
            LayuiUI.table({
                elem: '#logTable',
                url: '/admin/api/rbac/logs/',
                method: 'get',
                where: params,
                height: 'full-220',
                page: {
                    limit: 10,
                    limits: [10, 30, 50, 100],
                    groups: 5,
                    layout: ['count', 'prev', 'page', 'next', 'skip', 'limit']
                },
                even: true,
                    cols: [[
                    {field: 'id', title: t('common.id'), width: 70, align: 'center', sort: true},
                    {field: 'user', title: t('log.user'), width: 110, align: 'center'},
                    {field: 'module', title: t('log.module'), width: 110, align: 'center', templet: function(d){
                        // 数据库已存储中文名，直接使用；兼容旧数据英文模块名
                        return moduleMap[d.module] || d.module || '';
                    }},
                    {field: 'action', title: t('log.action'), minWidth: 200, templet: function(d){
                        // 操作内容中的模块名也进行替换
                        var text = d.action || '';
                        for (var key in moduleMap) { text = text.replace(new RegExp(key, 'g'), moduleMap[key]); }
                        return text;
                    }},
                    {field: 'ip', title: t('log.ip'), width: 140, align: 'center'},
                    {field: 'method', title: t('log.method'), width: 100, align: 'center', templet: renderMethod},
                    {field: 'url', title: t('log.url'), width: 200},
                    {field: 'status', title: t('log.status'), width: 90, align: 'center', templet: renderStatus},
                    {field: 'create_time', title: t('log.time'), width: 180, align: 'center', sort: true},
                    {title: t('common.operation'), width: 80, align: 'center', fixed: 'right', toolbar: '#logOperateTpl'}
                ]],
                parseData: function(res) {
                    if (res.code === 200) {
                        var list = Array.isArray(res.data) ? res.data : (res.data.list || []);
                        return {
                            'code': 0,
                            'msg': res.msg || '',
                            'count': Array.isArray(res.data) ? list.length : (res.data.total || 0),
                            'data': list
                        };
                    }
                    return {
                        'code': 1,
                        'msg': res.msg || t('common.requestFail'),
                        'count': 0,
                        'data': []
                    };
                },
                request: {
                    pageName: 'page',
                    limitName: 'page_size'
                },
                response: {
                    statusCode: 0
                },
                text: {none: t('log.noData')},
                autoSort: false
            });
        }

        // 初始加载
        renderTable({});

        // 搜索按钮
        form.on('submit(searchLog)', function(data) {
            var params = getSearchParams();
            renderTable(params);
            return false;
        });

        // 重置按钮
        $('#btnReset').on('click', function() {
            form.val('searchForm', {
                username: '',
                module: '',
                status: '',
                dateRange: ''
            });
            form.render('select');
            renderTable({});
        });

        // 排序事件
        table.on('sort(logTable)', function(obj) {
            var params = getSearchParams();
            if (obj.type) {
                params.ordering = (obj.type === 'asc' ? '' : '-') + obj.field;
            } else {
                delete params.ordering;
            }
            renderTable(params);
        });

        // 查看日志详情
        table.on('tool(logTable)', function(obj) {
            var data = obj.data;
            if (obj.event === 'view') {
                // 使用自定义 key-value 布局，避免 Layui form-label 固定宽度导致文案被截断
                var statusHtml = data.status === 1
                    ? '<span class="layui-badge layui-bg-green">' + t('log.status.success') + '</span>'
                    : '<span class="layui-badge" style="background:var(--danger-color);">' + t('log.status.fail') + '</span>';
                var methodHtml = '<span class="method-tag method-' + escapeHtml(data.method || '') + '">' + escapeHtml(data.method || '') + '</span>';

                var rows = [
                    ['ID',                    escapeHtml(String(data.id || ''))],
                    [t('log.user'),            escapeHtml(data.user || '')],
                    [t('log.module'),          escapeHtml(moduleMap[data.module] || data.module || '')],
                    [t('log.action'),          escapeHtml(data.action || '')],
                    [t('log.ip'),              escapeHtml(data.ip || '')],
                    [t('log.method'),          methodHtml],
                    [t('log.url'),             escapeHtml(data.url || '')],
                    [t('log.status'),          statusHtml],
                    [t('log.time'),            escapeHtml(data.create_time || '')]
                ];

                var rowsHtml = rows.map(function(r) {
                    return '<div class="log-detail-row">' +
                        '<span class="log-detail-label">' + r[0] + '</span>' +
                        '<span class="log-detail-value">' + r[1] + '</span>' +
                        '</div>';
                }).join('');

                var content = '<style>' +
                    '.log-detail-wrap { padding: 16px 24px; }' +
                    '.log-detail-row { display: flex; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border-color,#f0f0f0); }' +
                    '.log-detail-row:last-child { border-bottom: none; }' +
                    '.log-detail-label { flex: 0 0 80px; min-width: 80px; color: var(--text-secondary,#888); font-size: 13px; padding-top: 1px; white-space: nowrap; }' +
                    '.log-detail-value { flex: 1; color: var(--text-primary,#333); font-size: 13px; word-break: break-all; }' +
                    '</style>' +
                    '<div class="log-detail-wrap">' + rowsHtml + '</div>';

                layer.open({
                    type: 1,
                    title: t('common.view') + ' ' + t('log.title'),
                    area: ['520px', 'auto'],
                    maxHeight: 600,
                    content: content,
                    btn: [t('common.cancel')]
                });
            }
        });
    });
    </script>
</body>
</html>
