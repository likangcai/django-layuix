<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器管理</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126e">
    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
        .auth-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .auth-tag.password { background: rgba(30, 159, 255, 0.1); color: var(--primary-color); }
        .auth-tag.key { background: rgba(24, 144, 255, 0.1); color: var(--primary-color); }

        /* 日志查看器样式 */
        .log-viewer {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        .log-viewer-header {
            background: var(--bg-tertiary, var(--bg-secondary));
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .log-viewer-body {
            padding: 14px;
            color: var(--success-color, #27c93f);
            font-size: 13px;
            line-height: 1.6;
            max-height: 480px;
            overflow-y: auto;
            min-height: 200px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-viewer-body::-webkit-scrollbar { width: 6px; }
        .log-viewer-body::-webkit-scrollbar-track { background: var(--bg-secondary); }
        .log-viewer-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .log-viewer-body .log-empty { color: var(--text-muted); text-align: center; padding: 40px 0; }

        /* AI 分析结果样式 */
        .ai-analysis-panel {
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
            border: 1px solid var(--card-border);
        }
        .ai-analysis-header {
            background: var(--bg-tertiary, var(--bg-secondary));
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .ai-analysis-body {
            padding: 16px;
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.8;
            max-height: 400px;
            overflow-y: auto;
        }
        .ai-analysis-body::-webkit-scrollbar { width: 6px; }
        .ai-analysis-body::-webkit-scrollbar-track { background: var(--bg-secondary); }
        .ai-analysis-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        .ai-analysis-body h2 { color: var(--primary-color); margin: 12px 0 8px; font-size: 15px; }
        .ai-analysis-body h3 { color: var(--primary-light, var(--primary-color)); margin: 10px 0 6px; font-size: 14px; }
        .ai-analysis-body p { margin: 6px 0; }
        .ai-analysis-body code {
            background: var(--code-bg, rgba(0,0,0,0.2));
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: var(--success-color, #27c93f);
        }
        .ai-analysis-body pre {
            background: var(--code-bg, rgba(0,0,0,0.3));
            padding: 10px 14px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .ai-analysis-body pre code {
            background: none;
            padding: 0;
        }
        .ai-analysis-body ul, .ai-analysis-body ol {
            padding-left: 20px;
            margin: 6px 0;
        }
        .ai-analysis-body li { margin: 4px 0; }
        .ai-analysis-body strong { color: var(--warning-color, #ffd700); }
    </style>
</head>

<!-- 新增/编辑服务器弹窗模板 -->
<script type="text/html" id="serverFormTpl">
    <form class="layui-form" lay-filter="serverForm" style="padding: 20px 30px 0;">
        <input type="hidden" name="id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('server.name') }}</label>
            <div class="layui-input-block">
                <input type="text" name="name" lay-verify="required" lay-reqtext="{{ t('common.inputRequired', [t('server.name')]) }}" placeholder="{{ t('common.inputRequired', [t('server.name')]) }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('server.host') }}</label>
            <div class="layui-input-block">
                <input type="text" name="host" lay-verify="required" lay-reqtext="{{ t('common.inputRequired', [t('server.host')]) }}" placeholder="{{ t('common.inputRequired', [t('server.host')]) }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('server.port') }}</label>
            <div class="layui-input-block">
                <input type="number" name="port" value="22" lay-verify="required" placeholder="{{ t('server.port') }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('server.username') }}</label>
            <div class="layui-input-block">
                <input type="text" name="username" lay-verify="required" lay-reqtext="{{ t('common.inputRequired', [t('server.username')]) }}" placeholder="{{ t('common.inputRequired', [t('server.username')]) }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('server.authType') }}</label>
            <div class="layui-input-block">
                <input type="radio" name="auth_type" value="password" title="{{ t('server.auth.password') }}" checked lay-filter="authType">
                <input type="radio" name="auth_type" value="key" title="{{ t('server.auth.key') }}" lay-filter="authType">
            </div>
        </div>
        <div class="layui-form-item" id="passwordField">
            <label class="layui-form-label">{{ t('server.auth.password') }}</label>
            <div class="layui-input-block">
                <input type="password" name="password" placeholder="{{ t('server.password') }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item" id="privateKeyField" style="display:none;">
            <label class="layui-form-label">{{ t('server.privateKey') }}</label>
            <div class="layui-input-block">
                <textarea name="private_key" placeholder="{{ t('server.privateKey') }}" class="layui-textarea" style="min-height:100px;font-family:monospace;font-size:12px;"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('server.description') }}</label>
            <div class="layui-input-block">
                <input type="text" name="description" placeholder="{{ t('server.description') }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('common.status') }}</label>
            <div class="layui-input-block">
                <input type="checkbox" name="is_active" lay-skin="switch" lay-text="{{ t('common.enable') }}|{{ t('common.disable') }}" checked>
            </div>
        </div>
        <div class="layui-form-item" style="text-align:right;padding-top:10px;border-top:1px solid var(--layui-color-gray-2);margin-top:10px;">
            <button type="button" class="layui-btn layui-btn-warm" id="testConnectBtn" style="margin-right:8px;">
                <i class="layui-icon layui-icon-engine"></i> {{ t('server.testConnect') }}
            </button>
            <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="serverSubmit">{{ t('common.confirm') }}</button>
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="cancelServerForm">{{ t('common.cancel') }}</button>
        </div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261126e"></script>
<script src="/static/layui/js/i18n.js"></script>
<script>
inheritTheme();

// 初始化语言
if (window.parent && window.parent.I18N) {
    window.I18N = window.parent.I18N;
    window.t = window.parent.t;
} else {
    I18N.getLang();
}

// WebSSH 服务地址，从全局配置读取（settings.py → LAYUI_CONFIG.webssh_url）
var WEBSSH_URL = (window.LAYUI_CONFIG && window.LAYUI_CONFIG.webssh_url) || '/webssh/';

layui.use(['table', 'form', 'layer'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    // 初始化 data-i18n 和 {{ t() }} 占位符
    $('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); $(this).text(t(key)); });
    renderI18n();

    var logRefreshTimer = null;

    // ==================== 服务器列表 ====================
    function loadTable() {
        LayuiUI.table({
            elem: '#serverTable',
            url: '/admin/api/ops/servers/',
            method: 'get',
            toolbar: '#toolbarTpl',
            defaultToolbar: [],
            height: 'full-220',
            page: {
                limit: 10,
                limits: [10, 30, 50, 100],
                groups: 5,
                layout: ['count', 'prev', 'page', 'next', 'skip', 'limit']
            },
            even: true,
            cols: [[
                {field: 'id', title: 'ID', width: 70, align: 'center'},
                {field: 'name', title: t('server.name'), minWidth: 120},
                {field: 'host', title: t('server.host'), minWidth: 140},
                {field: 'port', title: t('server.port'), width: 100, align: 'center'},
                {field: 'username', title: t('server.username'), minWidth: 130},
                {field: 'auth_type', title: t('server.authType'), width: 110, align: 'center', templet: function(d) {
                    var type = d.auth_type || 'password';
                    if (type === 'password') {
                        return '<span class="auth-tag password">' + t('server.auth.password') + '</span>';
                    } else if (type === 'key') {
                        return '<span class="auth-tag key">' + t('server.auth.key') + '</span>';
                    }
                    return '<span class="auth-tag password">' + escapeHtml(type) + '</span>';
                }},
                {field: 'is_active', title: t('common.status'), width: 90, align: 'center', templet: function(d) {
                    return d.is_active
                        ? '<span class="layui-badge layui-bg-green">' + t('common.enable') + '</span>'
                        : '<span class="layui-badge layui-bg-gray">' + t('common.disable') + '</span>';
                }},
                {field: 'description', title: t('server.description'), minWidth: 150, templet: function(d) {
                    return d.description ? '<span style="color:var(--text-secondary);">' + escapeHtml(d.description) + '</span>' : '<span style="color:var(--text-muted);">-</span>';
                }},
                {title: t('common.operation'), minWidth: 420, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
            ]],
            parseData: function(res) {
                if (res.code === 200) {
                    var list = Array.isArray(res.data) ? res.data : (res.data.list || []);
                    return {
                        'code': 0,
                        'msg': res.msg || '',
                        'count': Array.isArray(res.data) ? list.length : (res.data.total || 0),
                        'data': list
                    };
                }
                return {
                    'code': 1,
                    'msg': res.msg || t('common.requestFail'),
                    'count': 0,
                    'data': []
                };
            },
            request: {
                pageName: 'page',
                limitName: 'page_size'
            },
            response: {
                statusCode: 0
            }
        });
    }

    // ==================== 新增/编辑服务器 ====================
    function openServerForm(editData) {
        var isEdit = !!editData;
        var title = isEdit ? t('server.editForm.title') : t('server.addForm.title');
        
        // 如果是编辑模式，先获取服务器详情
        if (isEdit) {
            getApi('/admin/api/ops/servers/' + editData.id + '/detail/', function(res) {
                if (res.code === 200 && res.data) {
                    openServerFormDialog(res.data, true);
                } else {
                    layer.msg(res.msg || t('common.fail'), {icon: 2});
                }
            });
        } else {
            openServerFormDialog(null, false);
        }
    }
    
    // 打开服务器表单弹窗
    function openServerFormDialog(editData, isEdit) {
        var title = isEdit ? t('server.editForm.title') : t('server.addForm.title');
        var layerIndex = LayuiUI.dialog({
            type: 1,
            title: title,
            area: ['560px', 'auto'],
            content: renderTpl('serverFormTpl'),
            success: function(layero, index) {
                var formFilter = 'serverForm';
                // 保存编辑时的原始数据
                var originalData = isEdit ? {
                    id: editData.id,
                    host: editData.host || '',
                    port: editData.port || 22,
                    username: editData.username || '',
                    auth_type: editData.auth_type || 'password'
                } : null;
                
                if (isEdit) {
                    form.val(formFilter, {
                        id: editData.id,
                        name: editData.name || '',
                        host: editData.host || '',
                        port: editData.port || 22,
                        username: editData.username || '',
                        auth_type: editData.auth_type || 'password',
                        password: editData.password || '',
                        private_key: editData.private_key || '',
                        description: editData.description || '',
                        is_active: editData.is_active !== false
                    });
                    if (editData.auth_type === 'key') {
                        layero.find('#passwordField').hide();
                        layero.find('#privateKeyField').show();
                        layero.find('[name="private_key"]').val(editData.private_key || '');
                    }
                }
                form.render(null, formFilter);

                bindFormOnce('radio(authType)', function(data) {
                    if (data.value === 'password') {
                        layero.find('#passwordField').show();
                        layero.find('#privateKeyField').hide();
                    } else {
                        layero.find('#passwordField').hide();
                        layero.find('#privateKeyField').show();
                    }
                });

                // 测试连接按钮
                layero.find('#testConnectBtn').on('click', function() {
                    var formData = form.val(formFilter);
                    var serverData = {
                        id: formData.id,
                        host: formData.host,
                        port: parseInt(formData.port) || 22,
                        username: formData.username,
                        auth_type: formData.auth_type || 'password'
                    };
                    
                    // 如果是新增，先验证必填字段
                    if (!serverData.host || !serverData.username) {
                        layer.msg(t('server.testConnect.fillFirst'), {icon: 0});
                        return;
                    }
                    
                    // 如果是新增，需要先保存才能测试
                    if (!serverData.id) {
                        layer.confirm(t('server.testConnect.needSave'), {
                            icon: 0,
                            title: t('common.tips'),
                            btn: [t('common.confirm'), t('common.cancel')],
                            area: ['400px']
                        }, function(confirmIndex) {
                            layer.close(confirmIndex);
                            // 触发表单提交保存
                            layero.find('[lay-filter="serverSubmit"]').click();
                        });
                        return;
                    }
                    
                    // 编辑模式，使用数据库中已保存的服务器信息进行测试
                    testConnection(originalData);
                });

                layero.find('#cancelServerForm').off('click.serverForm').on('click.serverForm', function() {
                    layer.close(index);
                });

                bindFormOnce('submit(serverSubmit)', function(data) {
                    var field = data.field;
                    var submitData = {
                        name: field.name,
                        host: field.host,
                        port: parseInt(field.port) || 22,
                        username: field.username,
                        auth_type: field.auth_type || 'password',
                        description: field.description || '',
                        is_active: field.is_active === 'on'
                    };
                    if (submitData.auth_type === 'password') {
                        // 编辑模式下，如果密码框为空，不发送 password 字段（保留原密码）
                        if (isEdit && !field.password) {
                            // 不更新密码，只更新其他字段
                            submitData.password = undefined;
                        } else {
                            submitData.password = field.password || '';
                        }
                        submitData.private_key = '';
                    } else {
                        submitData.private_key = field.private_key || '';
                        submitData.password = '';
                    }

                    // 获取提交按钮并添加动画
                    var $btn = $('button[lay-filter="serverSubmit"]');
                    $btn.prop('disabled', true).addClass('layui-btn-disabled').html('<i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop"></i> ' + (t('common.submitting') || '提交中...'));

                    if (isEdit) {
                        putApi('/admin/api/ops/servers/' + editData.id + '/update/', submitData, function(res) {
                            // 恢复按钮状态
                            $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                            
                            if (res.code === 200) {
                                layer.msg(t('common.updateSuccess'), {icon: 1});
                                layer.close(index);
                                loadTable();
                            } else {
                                layer.msg(res.msg || t('common.fail'), {icon: 2});
                            }
                        });
                    } else {
                        postApi('/admin/api/ops/servers/create/', submitData, function(res) {
                            // 恢复按钮状态
                            $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                            
                            if (res.code === 200) {
                                layer.msg(t('common.addSuccess'), {icon: 1});
                                layer.close(index);
                                loadTable();
                            } else {
                                layer.msg(res.msg || t('common.fail'), {icon: 2});
                            }
                        });
                    }
                    return false;
                });
            }
        });
    }

    // ==================== 测试连接 ====================
    function testConnection(serverData) {
        var loadIndex = layer.load(1, {shade: [0.3, '#000']});
        postApi('/admin/api/ops/servers/' + serverData.id + '/test/', {}, function(res) {
            layer.close(loadIndex);
            if (res.code === 200) {
                layer.msg(t('server.connectSuccess'), {icon: 1, time: 2000});
            } else {
                var errorMsg = res.msg || t('server.connectFail');
                if (errorMsg.length > 100 || errorMsg.indexOf('\n') !== -1) {
                    layer.alert(t('server.connectFail') + '\n\n' + errorMsg, {
                        icon: 2,
                        title: t('server.testConnect'),
                        area: ['550px', 'auto'],
                        shadeClose: true,
                        maxHeight: 500
                    });
                } else {
                    layer.msg(errorMsg, {icon: 2, time: 3000});
                }
            }
        });
    }

    // ==================== 查看日志 + AI 分析 ====================
    function openLogViewer(serverData) {
        var logLayerIndex = LayuiUI.dialog({
            type: 1,
            title: t('server.viewLog') + ' - ' + serverData.name,
            area: ['900px', '650px'],
            content: renderTpl('logViewerTpl'),
            success: function(layero, index) {
                form.render(null, 'logForm');
                var logContent = layero.find('#logContent');
                var logTitle = layero.find('#logTitle');
                var aiPanel = layero.find('#aiAnalysisPanel');
                var aiContent = layero.find('#aiAnalysisContent');
                var aiStatus = layero.find('#aiStatus');
                logTitle.text(serverData.username + '@' + serverData.host + ' - ' + t('server.logViewer'));

                // 缓存当前日志内容，用于 AI 分析
                var currentLogContent = '';
                var currentLogPath = '';

                function queryLog() {
                    currentLogPath = layero.find('[name="log_path"]').val().trim() || '/var/log/syslog';
                    var lines = parseInt(layero.find('[name="lines"]').val()) || 100;
                    logContent.html('<div class="log-empty" style="color:#ffd700;">' + t('server.log.loading') + '</div>');
                    postApi('/admin/api/ops/servers/' + serverData.id + '/log/', {
                        log_path: currentLogPath,
                        lines: lines
                    }, function(res) {
                        if (res.code === 200) {
                            var data = res.data || {};
                            var content = data.content || data.output || '';
                            if (content) {
                                currentLogContent = content;
                                logContent.text(content);
                            } else {
                                currentLogContent = '';
                                logContent.html('<div class="log-empty">' + t('server.log.noContent') + '</div>');
                            }
                        } else {
                            currentLogContent = '';
                            logContent.html('<div class="log-empty" style="color:#ff5555;">' + escapeHtml(res.msg || t('common.fail')) + '</div>');
                        }
                    });
                }

                // AI 分析功能
                function analyzeWithAI() {
                    if (!currentLogContent) {
                        layer.msg(t('server.log.queryFirst'), {icon: 0});
                        return;
                    }
                    aiPanel.show();
                    aiStatus.text(t('server.aiAnalyzing')).css('color', '#ffd700');
                    aiContent.html('<div style="text-align:center;padding:30px;color:#a0a0a0;"><i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop" style="font-size:24px;"></i><br><br>' + t('server.aiAnalyzing') + '</div>');

                    postApi('/admin/api/ops/ai/analyze-log/', {
                        content: currentLogContent,
                        server_name: serverData.name + ' (' + serverData.host + ')',
                        log_path: currentLogPath
                    }, function(res) {
                        // 检查是否需要配置
                        if (res.code === 401 && res.data && res.data.need_config) {
                            aiContent.html('');
                            aiPanel.hide();
                            layer.confirm(
                                '<div style="padding:10px 0;">' +
                                '<i class="layui-icon layui-icon-tips" style="font-size:40px;color:#ffd700;display:block;text-align:center;margin-bottom:12px;"></i>' +
                                '<p style="text-align:center;font-size:15px;margin-bottom:8px;">' + t('server.ai.notConfigured') + '</p>' +
                                '<p style="text-align:center;color:#a0a0a0;font-size:13px;">' + t('server.ai.goConfig') + '</p>' +
                                '</div>',
                                {
                                    icon: 0,
                                    title: t('server.ai.configTitle'),
                                    btn: [t('server.ai.goConfigBtn'), t('common.cancel')],
                                    area: ['400px']
                                },
                                function(idx) {
                                    layer.close(idx);
                                    // 在父窗口打开 AI 配置页面
                                    if (window.openParentTab) {
                                        openParentTab(t('ai.title'), '/static/layui/pages/ai-config.html');
                                    } else {
                                        window.open('/static/layui/pages/ai-config.html', '_blank');
                                    }
                                }
                            );
                            return;
                        }
                        if (res.code === 200) {
                            var analysis = (res.data || {}).analysis || '';
                            if (analysis) {
                                var html = renderMarkdown(analysis);
                                aiContent.html(html);
                                aiStatus.text(t('server.ai.analysisDone')).css('color', '#27c93f');
                            } else {
                                aiContent.html('<div style="text-align:center;padding:30px;color:#a0a0a0;">' + t('server.ai.noResult') + '</div>');
                                aiStatus.text(t('server.ai.noReturn')).css('color', '#a0a0a0');
                            }
                        } else {
                            aiContent.html('<div style="text-align:center;padding:30px;color:#ff5555;">' + escapeHtml(res.msg || t('server.ai.fail')) + '</div>');
                            aiStatus.text(t('server.ai.fail')).css('color', '#ff5555');
                        }
                    });
                }

                // 简单 Markdown 渲染（不依赖外部库）
                function renderMarkdown(text) {
                    var html = escapeHtml(text);
                    // 代码块
                    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
                    // 行内代码
                    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                    // 标题
                    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                    html = html.replace(/^# (.+)$/gm, '<h2>$1</h2>');
                    // 粗体
                    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                    // 斜体
                    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
                    // 无序列表
                    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
                    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
                    // 有序列表
                    html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
                    // 分隔线
                    html = html.replace(/^---$/gm, '<hr style="border-color:#333;margin:12px 0;">');
                    // 段落（双换行）
                    html = html.replace(/\n\n/g, '</p><p>');
                    html = '<p>' + html + '</p>';
                    // 清理空段落
                    html = html.replace(/<p>\s*<\/p>/g, '');
                    return html;
                }

                layero.find('#queryLogBtn').on('click', function() { queryLog(); });
                layero.find('#aiAnalyzeBtn').on('click', function() { analyzeWithAI(); });

                form.on('switch(autoRefresh)', function(data) {
                    if (data.elem.checked) {
                        queryLog();
                        logRefreshTimer = setInterval(queryLog, 5000);
                        layer.msg(t('server.autoRefreshOn'), {icon: 1, time: 1000});
                    } else {
                        if (logRefreshTimer) { clearInterval(logRefreshTimer); logRefreshTimer = null; }
                        layer.msg(t('server.autoRefreshOff'), {icon: 0, time: 1000});
                    }
                });
            },
            cancel: function() { if (logRefreshTimer) { clearInterval(logRefreshTimer); logRefreshTimer = null; } },
            end: function() { if (logRefreshTimer) { clearInterval(logRefreshTimer); logRefreshTimer = null; } }
        });
    }

    // ==================== Web SSH 终端（跳转 webssh 服务） ====================
    function openTerminal(serverData) {
        // 先获取服务器详情（包含密码）
        getApi('/admin/api/ops/servers/' + serverData.id + '/detail/', function(res) {
            if (res.code === 200 && res.data) {
                var detail = res.data;

                // 动态获取最新的 webssh_url 配置（确保使用最新值）
                var currentWebsshUrl = WEBSSH_URL;
                if (window.parent && window.parent.LAYUI_CONFIG && window.parent.LAYUI_CONFIG.webssh_url) {
                    currentWebsshUrl = window.parent.LAYUI_CONFIG.webssh_url;
                }
                
                // 构建 webssh URL，支持自动填入连接信息
                var websshUrl = currentWebsshUrl;
                if (websshUrl.indexOf('?') === -1) {
                    websshUrl += '?';
                } else {
                    websshUrl += '&';
                }
                websshUrl += 'hostname=' + encodeURIComponent(detail.host);
                websshUrl += '&port=' + encodeURIComponent(detail.port);
                websshUrl += '&username=' + encodeURIComponent(detail.username);
                
                // 如果有密码，需要 base64 编码后传递（webssh 官方要求）
                if (detail.auth_type === 'password' && detail.password) {
                    var encodedPassword = btoa(encodeURIComponent(detail.password));
                    websshUrl += '&password=' + encodedPassword;
                }
                
                // 如果是密钥认证，传递私钥（也需要 base64 编码）
                if (detail.auth_type === 'key' && detail.private_key) {
                    var encodedKey = btoa(encodeURIComponent(detail.private_key));
                    websshUrl += '&privatekey=' + encodedKey;
                }

                // 在新窗口打开 webssh
                layer.confirm(
                    t('server.ssh.hint') + ' <b>' + escapeHtml(detail.name) + '</b> (' + escapeHtml(detail.host) + ')<br><br>' +
                    '<span style="color:#a0a0a0;font-size:12px;">' +
                    t('server.ssh.ensure') + '<br>' +
                    t('server.ssh.openTerminal') + '</span>',
                    {
                        icon: 0,
                        title: t('server.terminal'),
                        btn: [t('server.ssh.openTerminal'), t('common.cancel')],
                        area: ['480px']
                    },
                    function(index) {
                        window.open(websshUrl, '_blank');
                        layer.close(index);
                    }
                );
            } else {
                layer.msg(res.msg || t('common.fail'), {icon: 2});
            }
        });
    }

    // ==================== 工具栏事件 ====================
    table.on('toolbar(serverTable)', function(obj) {
        if (obj.event === 'add') {
            openServerForm(null);
        } else if (obj.event === 'refresh') {
            loadTable();
        }
    });

    // ==================== 操作列事件 ====================
    table.on('tool(serverTable)', function(obj) {
        var data = obj.data;
        if (obj.event === 'view') {
            var content = '<div style="padding: 20px 30px;">' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('server.name') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.name || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('server.host') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.host || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('server.port') + '</label><div class="layui-input-block"><input type="text" value="' + (data.port || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('server.username') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.username || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('server.authType') + '</label><div class="layui-input-block"><input type="text" value="' + (data.auth_type === 'key' ? t('server.auth.key') : t('server.auth.password')) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('common.status') + '</label><div class="layui-input-block"><input type="text" value="' + (data.is_active ? t('common.enable') : t('common.disable')) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('server.description') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.description || '') + '" class="layui-input" readonly></div></div>' +
                '</div>';
            LayuiUI.dialog({
                type: 1,
                title: t('common.view') + ' ' + t('server.title') + ' - ' + data.name,
                area: ['550px', '450px'],
                content: content,
                btn: [t('common.cancel')]
            });
        } else if (obj.event === 'edit') {
            openServerForm(data);
        } else if (obj.event === 'log') {
            openLogViewer(data);
        } else if (obj.event === 'terminal') {
            openTerminal(data);
        } else if (obj.event === 'del') {
            layer.confirm(t('common.confirmDelete') + '<br><b>' + escapeHtml(data.name) + '</b>', {
                icon: 3,
                title: t('common.deleteConfirm.title'),
                btn: [t('common.confirm'), t('common.cancel')]
            }, function(index) {
                deleteApi('/admin/api/ops/servers/' + data.id + '/delete/', function(res) {
                    if (res.code === 200) {
                        layer.msg(t('common.deleteSuccess'), {icon: 1});
                        layer.close(index);
                        loadTable();
                    } else {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                    }
                });
            });
        }
    });

    // 初始化
    loadTable();
});
</script>
