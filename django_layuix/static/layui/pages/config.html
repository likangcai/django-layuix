<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置 - 软件测试管理后台</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126j">
    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
        .config-value-image { display: flex; align-items: center; gap: 10px; }
        .config-value-image img { max-width: 60px; max-height: 60px; border-radius: 4px; border: 1px solid var(--border-color); }
        .config-value-color { display: flex; align-items: center; gap: 8px; }
        .config-value-color .color-preview {
            width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border-color);
            display: inline-block; vertical-align: middle;
        }
        .config-value-boolean { display: flex; align-items: center; }
        .config-value-boolean .layui-form-switch { margin-top: 0; }
        .form-value-image { display: flex; align-items: center; gap: 10px; }
        .form-value-image img { max-width: 80px; max-height: 80px; border-radius: 4px; border: 1px solid var(--border-color); }
        .type-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .type-tag.string { background: rgba(30, 159, 255, 0.1); color: #1e9fff; }
        .type-tag.integer { background: rgba(24, 144, 255, 0.1); color: #1890ff; }
        .type-tag.boolean { background: rgba(95, 184, 120, 0.1); color: #5FB878; }
        .type-tag.json { background: rgba(255, 184, 0, 0.1); color: #FFB800; }
        .type-tag.image { background: rgba(255, 87, 34, 0.1); color: #FF5722; }
        .type-tag.color { background: rgba(1, 170, 237, 0.1); color: #01AAED; }
        .type-tag.text { background: rgba(150, 150, 150, 0.1); color: #999; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size: 15px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
                <i class="layui-icon layui-icon-set" style="color: var(--primary-color);"></i> <span data-i18n="config.title">系统配置管理</span>
            </span>
        </div>
        <div class="layui-card-body">
            <table id="configTable" lay-filter="configTable"></table>
        </div>
    </div>
</div>

<!-- 工具栏模板 -->

        {{# } }}

<!-- 新增/编辑弹窗模板 -->
<script type="text/html" id="configFormTpl">
    <form class="layui-form" lay-filter="configForm" style="padding: 20px 30px 0;">
        <input type="hidden" name="id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('config.key') }}</label>
            <div class="layui-input-block">
                <input type="text" name="key" lay-verify="required" lay-reqtext="{{ t('common.inputRequired', [t('config.key')]) }}" placeholder="{{ t('common.inputRequired', [t('config.key')]) }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('config.value') }}</label>
            <div class="layui-input-block">
                <!-- 默认文本输入 -->
                <div id="valueInputDefault">
                    <input type="text" name="value" placeholder="{{ t('common.inputRequired', [t('config.value')]) }}" autocomplete="off" class="layui-input">
                </div>
                <!-- image类型 -->
                <div id="valueInputImage" style="display:none;">
                    <div style="display:flex;gap:8px;margin-bottom:8px;">
                        <input type="text" name="value_image" placeholder="{{ t('config.type.url') }}" autocomplete="off" class="layui-input" style="flex:1;">
                        <button type="button" class="layui-btn layui-btn-sm" id="uploadImageBtn">
                            <i class="layui-icon layui-icon-upload"></i> {{ t('common.upload') || '上传' }}
                        </button>
                    </div>
                    <div class="form-value-image">
                        <img id="imagePreview" src="" alt="{{ t('config.preview') }}" style="display:none;">
                        <span style="color:var(--text-muted);font-size:12px;" id="imagePreviewHint">{{ t('config.previewHint') }}</span>
                    </div>
                    <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
                </div>
                <!-- color类型 -->
                <div id="valueInputColor" style="display:none;">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <input type="color" id="colorPicker" value="#1e9fff" style="height:36px;border:1px solid var(--border-color);border-radius:4px;cursor:pointer;padding:2px" class="w-50">
                        <input type="text" name="value_color" placeholder="{{ t('common.inputRequired', [t('config.value')]) }}" autocomplete="off" class="layui-input" style="flex:1;">
                    </div>
                </div>
                <!-- json类型 -->
                <div id="valueInputJson" style="display:none;">
                    <textarea name="value_json" placeholder="{{ t('config.type.json') }}" class="layui-textarea" style="min-height:120px;font-family:monospace;"></textarea>
                </div>
                <!-- boolean类型 -->
                <div id="valueInputBoolean" style="display:none;">
                    <input type="checkbox" name="value_boolean" lay-skin="switch" lay-text="{{ t('common.yes') }}|{{ t('common.no') }}">
                </div>
                <!-- text类型 -->
                <div id="valueInputText" style="display:none;">
                    <textarea name="value_text" placeholder="{{ t('common.inputRequired', [t('config.value')]) }}" class="layui-textarea" style="min-height:80px;"></textarea>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('config.description') }}</label>
            <div class="layui-input-block">
                <input type="text" name="description" placeholder="{{ t('common.inputRequired', [t('config.description')]) }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('config.type') }}</label>
            <div class="layui-input-block">
                <select name="config_type" lay-filter="configType">
                    <option value="string">{{ t('config.type.string') }}</option>
                    <option value="integer">{{ t('config.type.int') }}</option>
                    <option value="boolean">{{ t('config.type.boolean') }}</option>
                    <option value="json">{{ t('config.type.json') }}</option>
                    <option value="image">{{ t('config.type.image') }}</option>
                    <option value="color">{{ t('config.type.color') }}</option>
                    <option value="text">{{ t('config.type.text') }}</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('config.sort') }}</label>
            <div class="layui-input-block">
                <input type="number" name="sort" value="0" placeholder="{{ t('config.sort') }}" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item" style="display:flex;justify-content:flex-end;gap:8px;">
            <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="configSubmit">{{ t('common.confirm') }}</button>
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="cancelConfigForm">{{ t('common.cancel') }}</button>
        </div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
    <script src="/static/layui/js/common.js?v=20261126j"></script>
    <script src="/static/layui/js/i18n.js"></script>
    <script>
inheritTheme();

// 初始化语言
if (window.parent && window.parent.I18N) {
    window.I18N = window.parent.I18N;
    window.t = window.parent.t;
} else {
    I18N.getLang();
}

layui.use(['table', 'form', 'layer'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    // 初始化 data-i18n 和 {{ t() }} 占位符
    $('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); $(this).text(t(key)); });
    renderI18n();
    form.render('select');

    var currentUser = window.parent && window.parent.currentUser ? window.parent.currentUser : {};
    var permissions = currentUser.permissions || [];

    function getCookie(name) {
        var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? decodeURIComponent(match[2]) : '';
    }

    // 分页参数
    var currentPage = 1;
    var pageSize = 10;
    var total = 0;

    // 类型标签样式映射
    var typeTagMap = {
        'string': 'string',
        'integer': 'integer',
        'boolean': 'boolean',
        'json': 'json',
        'image': 'image',
        'color': 'color',
        'text': 'text'
    };

    // 类型中文名映射
    var typeNameMap = {
        'string': t('config.type.string'),
        'integer': t('config.type.int'),
        'boolean': t('config.type.boolean'),
        'json': t('config.type.json'),
        'image': t('config.type.image'),
        'color': t('config.type.color'),
        'text': t('config.type.text')
    };

    // 加载配置列表
    function loadTable() {
        var url = '/admin/api/rbac/configs/?page=' + currentPage + '&page_size=' + pageSize;

        getApi(url, function(res) {
            if (res.code === 200) {
                var rawData = res.data;
                // 兼容数组格式和分页格式
                var list = Array.isArray(rawData) ? rawData : (rawData.list || []);
                total = Array.isArray(rawData) ? list.length : (rawData.total || 0);

                LayuiUI.table({
                    elem: '#configTable',
                    toolbar: '#toolbarTpl',
                    defaultToolbar: [],
                    data: list,
                    height: 'full-220',
                    page: {
                        limit: pageSize,
                        limits: [10, 30, 50, 100],
                        curr: currentPage,
                        count: total,
                        layout: ['count', 'prev', 'page', 'next', 'skip', 'limit'],
                        jump: function(obj, first) {
                            if (!first) {
                                currentPage = obj.curr;
                                pageSize = obj.limit;
                                loadTable();
                            }
                        }
                    },
                    even: true,
                    cols: [[
                        {field: 'id', title: t('common.id'), width: 70, align: 'center'},
                        {field: 'key', title: t('config.key'), width: 200},
                        {field: 'value', title: t('config.value'), minWidth: 200, templet: function(d) {
                            var type = d.config_type || 'string';
                            var val = d.value || '';
                            if (type === 'image' && val) {
                                return '<div class="config-value-image"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block" class="max-w-200">' + escapeHtml(val) + '</span><img src="' + escapeHtml(val) + '" class="table-image-preview" onerror="this.style.display=\'none\'" style="cursor:pointer;"></div>';
                            } else if (type === 'color' && val) {
                                return '<div class="config-value-color"><span class="color-preview" style="background:' + escapeHtml(val) + ';"></span>' + escapeHtml(val) + '</div>';
                            } else if (type === 'boolean') {
                                return val === 'true' || val === true
                                    ? '<span class="layui-badge layui-bg-green">' + t('common.yes') + '</span>'
                                    : '<span class="layui-badge layui-bg-gray">' + t('common.no') + '</span>';
                            } else if (type === 'json') {
                                try {
                                    var obj = JSON.parse(val);
                                    return '<span style="color:var(--text-secondary);font-size:12px;">' + escapeHtml(JSON.stringify(obj).substring(0, 60)) + (JSON.stringify(obj).length > 60 ? '...' : '') + '</span>';
                                } catch(e) {
                                    return '<span style="color:var(--text-secondary);font-size:12px;">' + escapeHtml(val.substring(0, 60)) + (val.length > 60 ? '...' : '') + '</span>';
                                }
                            } else {
                                return '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block" class="max-w-300">' + escapeHtml(val) + '</span>';
                            }
                        }},
                        {field: 'description', title: t('config.description'), width: 180, templet: function(d) {
                            return d.description ? '<span style="color:var(--text-secondary);">' + escapeHtml(d.description) + '</span>' : '<span style="color:var(--text-muted);">-</span>';
                        }},
                        {field: 'config_type', title: t('config.type'), width: 100, align: 'center', templet: function(d) {
                            var type = d.config_type || 'string';
                            var cls = typeTagMap[type] || 'string';
                            var name = typeNameMap[type] || type;
                            return '<span class="type-tag ' + cls + '">' + name + '</span>';
                        }},
                        {field: 'sort', title: t('config.sort'), width: 80, align: 'center'},
                        {field: 'update_time', title: t('user.createTime'), width: 170, align: 'center'},
                        {title: t('common.operation'), width: 280, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
                    ]]
                });
            }
        });
    }

    // 切换配置值输入区域
    function switchValueInput(type) {
        $('#valueInputDefault, #valueInputImage, #valueInputColor, #valueInputJson, #valueInputBoolean, #valueInputText').hide();
        if (type === 'image') {
            $('#valueInputImage').show();
        } else if (type === 'color') {
            $('#valueInputColor').show();
        } else if (type === 'json') {
            $('#valueInputJson').show();
        } else if (type === 'boolean') {
            $('#valueInputBoolean').show();
        } else if (type === 'text') {
            $('#valueInputText').show();
        } else {
            $('#valueInputDefault').show();
        }
    }

    // 获取当前配置值
    function getCurrentValue(type) {
        if (type === 'image') {
            return $('[name="value_image"]').val() || '';
        } else if (type === 'color') {
            return $('[name="value_color"]').val() || '';
        } else if (type === 'json') {
            return $('[name="value_json"]').val() || '';
        } else if (type === 'boolean') {
            return $('[name="value_boolean"]').is(':checked') ? 'true' : 'false';
        } else if (type === 'text') {
            return $('[name="value_text"]').val() || '';
        } else {
            return $('[name="value"]').val() || '';
        }
    }

    // 设置配置值到对应输入框
    function setCurrentValue(type, value) {
        if (type === 'image') {
            $('[name="value_image"]').val(value || '');
            if (value) {
                $('#imagePreview').attr('src', value).show().css('cursor', 'pointer');
                $('#imagePreviewHint').html('<span style="color:var(--primary-color);cursor:pointer;" class="preview-link">' + t('config.preview') + '</span>');
            } else {
                $('#imagePreview').hide();
                $('#imagePreviewHint').text(t('config.previewHint'));
            }
        } else if (type === 'color') {
            $('[name="value_color"]').val(value || '');
            $('#colorPicker').val(value || '#1e9fff');
        } else if (type === 'json') {
            $('[name="value_json"]').val(value || '');
        } else if (type === 'boolean') {
            if (value === 'true' || value === true) {
                $('[name="value_boolean"]').prop('checked', true);
            } else {
                $('[name="value_boolean"]').prop('checked', false);
            }
        } else if (type === 'text') {
            $('[name="value_text"]').val(value || '');
        } else {
            $('[name="value"]').val(value || '');
        }
    }

    // 打开新增/编辑弹窗
    function openConfigForm(editData) {
        var isEdit = !!editData;
        var title = isEdit ? t('config.editForm.title') : t('config.addForm.title');

        var layerIndex = LayuiUI.dialog({
            type: 1,
            title: title,
            area: ['580px', 'auto'],
            content: renderTpl('configFormTpl'),
            success: function(layero, index) {
                var formFilter = 'configForm';

                if (isEdit) {
                    form.val(formFilter, {
                        id: editData.id,
                        key: editData.key || '',
                        description: editData.description || '',
                        config_type: editData.config_type || 'string',
                        sort: editData.sort || 0
                    });

                    // 编辑时配置键只读
                    layero.find('[name="key"]').attr('readonly', true).addClass('layui-disabled').css('background', 'var(--bg-tertiary)');

                    // 设置配置值
                    var type = editData.config_type || 'string';
                    switchValueInput(type);
                    setCurrentValue(type, editData.value);
                } else {
                    switchValueInput('string');
                }

                form.render(null, formFilter);

                // 类型切换事件
                bindFormOnce('select(configType)', function(data) {
                    switchValueInput(data.value);
                    form.render(null, formFilter);
                });

                // 颜色选择器联动
                layero.find('#colorPicker').on('input', function() {
                    layero.find('[name="value_color"]').val(this.value);
                });
                layero.find('[name="value_color"]').on('input', function() {
                    var val = $(this).val();
                    if (/^#[0-9a-fA-F]{6}$/.test(val)) {
                        layero.find('#colorPicker').val(val);
                    }
                });

                // 图片URL预览
                layero.find('[name="value_image"]').on('input', function() {
                    var val = $(this).val();
                    if (val) {
                        layero.find('#imagePreview').attr('src', val).show().css('cursor', 'pointer');
                        layero.find('#imagePreviewHint').html('<span style="color:var(--primary-color);cursor:pointer;" class="preview-link">' + t('config.preview') + '</span>');
                    } else {
                        layero.find('#imagePreview').hide();
                        layero.find('#imagePreviewHint').text(t('config.previewHint'));
                    }
                });

                // 图片点击放大预览（编辑弹窗）
                layero.on('click', '#imagePreview, .preview-link', function() {
                    var src = layero.find('#imagePreview').attr('src');
                    if (src) {
                        layer.photos({
                            photos: { data: [{ alt: t('config.preview'), src: src }] },
                            anim: 5,
                            shade: 0.5,
                            closeBtn: 1
                        });
                    }
                });

                // 图片上传按钮
                layero.find('#uploadImageBtn').on('click', function() {
                    layero.find('#imageFileInput').click();
                });
                layero.find('#imageFileInput').on('change', function() {
                    var file = this.files[0];
                    if (!file) return;
                    if (file.size > 2 * 1024 * 1024) {
                        layer.msg(t('profile.avatar.sizeError'), {icon: 2});
                        return;
                    }
                    var formData = new FormData();
                    formData.append('image', file);
                    var loadIndex = layer.load(1);
                    $.ajax({
                        url: '/admin/api/rbac/upload/image/',
                        type: 'POST',
                        data: formData,
                        processData: false,
                        contentType: false,
                        headers: {'X-CSRFToken': getCookie('csrftoken')},
                        success: function(res) {
                            layer.close(loadIndex);
                            if (res.code === 200) {
                                layero.find('[name="value_image"]').val(res.data.url).trigger('input');
                                layer.msg(t('common.uploadSuccess') || '上传成功', {icon: 1});
                            } else {
                                layer.msg(res.msg || t('common.uploadFail'), {icon: 2});
                            }
                        },
                        error: function() {
                            layer.close(loadIndex);
                            layer.msg(t('common.networkError'), {icon: 2});
                        }
                    });
                    this.value = '';
                });

                // 取消按钮
                layero.find('#cancelConfigForm').off('click.configForm').on('click.configForm', function() {
                    layer.close(index);
                });
            }
        });
    }

    // 表单提交（绑定一次，避免重复绑定）
    form.on('submit(configSubmit)', function(data) {
        var field = data.field;
        var type = field.config_type || 'string';
        var value = getCurrentValue(type);

        var submitData = {
            key: field.key,
            value: value,
            description: field.description || '',
            config_type: type,
            sort: parseInt(field.sort) || 0
        };

        // 获取提交按钮并添加动画
        var $btn = $('button[lay-filter="configSubmit"]');
        $btn.prop('disabled', true).addClass('layui-btn-disabled').html('<i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop"></i> ' + (t('common.submitting') || '提交中...'));

        var isEdit = !!field.id;
        if (isEdit) {
            putApi('/admin/api/rbac/configs/' + field.id + '/update/', submitData, function(res) {
                // 恢复按钮状态
                $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                
                if (res.code === 200) {
                    layer.msg(t('common.updateSuccess'), {icon: 1});
                    layer.closeAll();
                    // 更新父窗口的全局配置和UI
                    if (window.parent && window.parent.LAYUI_CONFIG) {
                        var key = field.key;
                        if (key === 'webssh_url') {
                            window.parent.LAYUI_CONFIG.webssh_url = submitData.value;
                        }
                        // 更新实时生效的UI配置
                        if (window.parent.jQuery || window.parent.$) {
                            var $ = window.parent.jQuery || window.parent.$;
                            switch(key) {
                                case 'system_name':
                                    $('.logo-text').text(submitData.value);
                                    document.title = submitData.value;
                                    break;
                                case 'logo_icon':
                                    $('.logo-icon i').attr('class', 'layui-icon ' + submitData.value);
                                    break;
                                case 'logo_url':
                                    if (submitData.value) {
                                        $('.logo-icon').html('<img src="' + submitData.value + '" style="height:32px;border-radius:6px" class="w-32">');
                                    } else {
                                        $('.logo-icon').html('<i class="layui-icon layui-icon-code-circle"></i>');
                                    }
                                    break;
                                case 'frontend_url':
                                    if (submitData.value) {
                                        $('#frontendBtn').show().attr('data-url', submitData.value);
                                    } else {
                                        $('#frontendBtn').hide();
                                    }
                                    break;
                                case 'favicon_url':
                                    if (submitData.value) {
                                        $('link[rel="icon"]').attr('href', submitData.value);
                                    }
                                    break;
                            }
                        }
                    }
                    loadTable();
                } else {
                    layer.msg(res.msg || t('common.fail'), {icon: 2});
                }
            });
        } else {
            postApi('/admin/api/rbac/configs/create/', submitData, function(res) {
                // 恢复按钮状态
                $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                
                if (res.code === 200) {
                    layer.msg(t('common.addSuccess'), {icon: 1});
                    layer.closeAll();
                    loadTable();
                } else {
                    layer.msg(res.msg || t('common.fail'), {icon: 2});
                }
            });
        }
        return false;
    });

    // 工具栏事件
    table.on('toolbar(configTable)', function(obj) {
        if (obj.event === 'add') {
            openConfigForm(null);
        } else if (obj.event === 'refresh') {
            loadTable();
        }
    });

    // 操作列事件
    table.on('tool(configTable)', function(obj) {
        var data = obj.data;
        if (obj.event === 'view') {
            var typeName = typeNameMap[data.config_type] || (data.config_type || 'string');
            var content = '<div style="padding: 20px 30px;">' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('config.key') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.key || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('config.value') + '</label><div class="layui-input-block"><textarea class="layui-textarea" readonly style="min-height:80px;">' + escapeHtml(data.value || '') + '</textarea></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('config.description') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.description || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('config.type') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(typeName) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('config.sort') + '</label><div class="layui-input-block"><input type="text" value="' + (data.sort || 0) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">' + t('user.createTime') + '</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.update_time || '') + '" class="layui-input" readonly></div></div>' +
                '</div>';
            LayuiUI.dialog({
                type: 1,
                title: t('common.view') + ' ' + t('config.title') + ' - ' + data.key,
                area: ['550px', 'auto'],
                content: content,
                btn: [t('common.cancel')]
            });
        } else if (obj.event === 'edit') {
            openConfigForm(data);
        } else if (obj.event === 'del') {
            layer.confirm(t('common.confirmDelete') + '<br><b>' + escapeHtml(data.key) + '</b>', {
                icon: 3,
                title: t('common.deleteConfirm.title'),
                btn: [t('common.confirm'), t('common.cancel')]
            }, function(index) {
                deleteApi('/admin/api/rbac/configs/' + data.id + '/delete/', function(res) {
                    if (res.code === 200) {
                        layer.msg(t('common.deleteSuccess'), {icon: 1});
                        layer.close(index);
                        loadTable();
                    } else {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                    }
                });
            });
        }
    });

    // 初始化
    loadTable();

    // 表格图片点击放大预览（事件委托）
    $(document).on('click', '.table-image-preview', function() {
        var src = $(this).attr('src');
        if (src) {
            layer.photos({
                photos: { data: [{ alt: t('config.preview'), src: src }] },
                anim: 5,
                shade: 0.5,
                closeBtn: 1
            });
        }
    });
});
</script>
</body>
</html>
