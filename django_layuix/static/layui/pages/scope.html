<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <title data-i18n="scope.title">组织节点管理</title>
    <link rel="icon" type="image/x-icon" href="/static/layui/favicon.ico">
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126p">
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size:15px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px;">
                <i class="layui-icon layui-icon-tree" style="color:var(--primary-color);"></i> {{ t('scope.title') }}
            </span>
        </div>
        <div class="layui-card-body">
            <div class="layui-row layui-col-space12">
                <div class="layui-col-md6">
                    <div class="table-card">
                        <div class="card-title scope-tree-title">
                            <span>{{ t('scope.tree') }}</span>
                            <span class="scope-tree-actions">
                                <button type="button" class="layui-btn layui-btn-xs layui-btn-normal" id="addRootNode">{{ t('scope.addRoot') }}</button>
                                <button type="button" class="layui-btn layui-btn-xs layui-btn-primary" id="addChildNode">{{ t('scope.addChild') }}</button>
                                <button type="button" class="layui-btn layui-btn-xs layui-btn-danger" id="deleteNode">{{ t('common.delete') }}</button>
                            </span>
                        </div>
                        <div id="scopeTree" style="min-height:320px;"></div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="table-card">
                        <div class="card-title">{{ t('scope.config') }}</div>
                        <form class="layui-form" lay-filter="scopeForm" style="padding:16px;">
                            <input type="hidden" name="id">
                            <div class="layui-form-item">
                                <label class="layui-form-label">{{ t('scope.code') }}</label>
                                <div class="layui-input-block"><input name="code" required class="layui-input" placeholder="{{ t('scope.codePlaceholder') }}"></div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">{{ t('scope.name') }}</label>
                                <div class="layui-input-block"><input name="name" required class="layui-input" placeholder="{{ t('scope.namePlaceholder') }}"></div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">{{ t('scope.parent') }}</label>
                                <div class="layui-input-block"><select name="parent_id"><option value="">{{ t('scope.root') }}</option></select></div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">{{ t('scope.sort') }}</label>
                                <div class="layui-input-block"><input name="sort" type="number" value="0" class="layui-input"></div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">{{ t('scope.status') }}</label>
                                <div class="layui-input-block"><input name="is_active" type="checkbox" checked lay-skin="switch" lay-text="{{ t('common.enable') }}|{{ t('common.disable') }}" value="1"></div>
                            </div>
                            <div class="form-actions">
                                <button class="layui-btn layui-btn-sm" lay-submit lay-filter="scopeSubmit">{{ t('common.save') }}</button>
                                <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetScope">{{ t('common.reset') }}</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261126p"></script>
<script src="/static/layui/js/i18n.js?v=20261126p"></script>
<script>
I18N.getLang();
renderI18n();
document.title = t('scope.title');
layui.use(['tree', 'form', 'layer'], function() {
    var tree = layui.tree;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;
    var flatNodes = [];
    var selectedNodeId = null;

    function resetForm(parentId) {
        form.val('scopeForm', {
            id: '', code: '', name: '', parent_id: parentId || '',
            sort: 0, is_active: true
        });
        renderParentSelect(null, parentId);
    }

    function flatten(nodes, result) {
        (nodes || []).forEach(function(node) {
            result.push({id: node.id, code: node.code, name: node.name, parent_id: node.parent_id, sort: node.sort, is_active: node.is_active});
            flatten(node.children, result);
        });
        return result;
    }

    function toTreeData(nodes) {
        return (nodes || []).map(function(node) {
            var title = (node.name || t('scope.unnamed')) + ' (' + (node.code || '') + ')';
            if (!node.is_active) title += ' · ' + t('scope.disabled');
            return {id: node.id, title: title, children: toTreeData(node.children)};
        });
    }

    function descendantIds(id) {
        var result = [];
        flatNodes.forEach(function(node) {
            if (node.parent_id === id) {
                result.push(node.id);
                result = result.concat(descendantIds(node.id));
            }
        });
        return result;
    }

    function renderParentSelect(excludeId, selectedParentId) {
        var excluded = {};
        if (excludeId) {
            excluded[excludeId] = true;
            descendantIds(excludeId).forEach(function(id) { excluded[id] = true; });
        }
        var html = '<option value=""' + (selectedParentId ? '' : ' selected') + '>' + t('scope.root') + '</option>';
        flatNodes.forEach(function(node) {
            if (excluded[node.id]) return;
            var selected = String(node.id) === String(selectedParentId || '') ? ' selected' : '';
            html += '<option value="' + node.id + '"' + selected + '>' + escapeHtml(node.name) + ' (' + escapeHtml(node.code) + ')</option>';
        });
        $('[name="parent_id"]').html(html);
        form.render('select');
    }

    function loadTree() {
        getApi('/admin/api/rbac/scope-nodes/', function(res) {
            if (res.code !== 200) return;
            flatNodes = flatten(res.data || [], []);
            tree.render({
                elem: '#scopeTree',
                data: toTreeData(res.data || []),
                click: function(obj) { selectedNodeId = obj.data.id; fillForm(obj.data.id); }
            });
            renderParentSelect(null);
        });
    }

    function fillForm(id) {
        var node = flatNodes.find(function(item) { return item.id === id; });
        if (!node) return;
        form.val('scopeForm', {
            id: node.id, code: node.code, name: node.name,
            parent_id: node.parent_id || '', sort: node.sort || 0,
            is_active: !!node.is_active
        });
        renderParentSelect(node.id, node.parent_id);
    }

    form.on('submit(scopeSubmit)', function(data) {
        var field = data.field;
        var payload = {
            code: field.code, name: field.name,
            parent_id: field.parent_id || null,
            sort: parseInt(field.sort) || 0,
            is_active: !!field.is_active
        };
        var url = '/admin/api/rbac/scope-nodes/';
        var method = 'POST';
        if (field.id) {
            url = '/admin/api/rbac/scope-nodes/' + field.id + '/';
            method = 'PUT';
        }
        if (method === 'POST') postApi(url, payload, done); else putApi(url, payload, done);
        function done(res) {
            layer.msg(res.msg || (res.code === 200 ? t('scope.saved') : t('scope.failed')), {icon: res.code === 200 ? 1 : 2});
            if (res.code === 200) { selectedNodeId = null; resetForm(); loadTree(); }
        }
        return false;
    });

    $('#resetScope').on('click', function() {
        selectedNodeId = null;
        resetForm();
    });

    $('#addRootNode').on('click', function() {
        selectedNodeId = null;
        resetForm();
        $('[name="code"]').focus();
    });

    $('#addChildNode').on('click', function() {
        if (!selectedNodeId) {
            layer.msg(t('scope.selectParentFirst'), {icon: 2});
            return;
        }
        resetForm(selectedNodeId);
        $('[name="code"]').focus();
    });

    $('#deleteNode').on('click', function() {
        if (!selectedNodeId) {
            layer.msg(t('scope.selectParentFirst'), {icon: 2});
            return;
        }
        layer.confirm(t('scope.deleteConfirm'), {icon: 3, btn: [t('common.confirm'), t('common.cancel')]}, function(index) {
            layer.close(index);
            deleteApi('/admin/api/rbac/scope-nodes/' + selectedNodeId + '/', function(res) {
                var message = res.code === 409 ? t('scope.usedByRole')
                    : (res.msg || (res.code === 200 ? t('common.deleted') : t('scope.failed')));
                layer.msg(message, {icon: res.code === 200 ? 1 : 2});
                if (res.code === 200) { selectedNodeId = null; resetForm(); loadTree(); }
            });
        });
    });

    loadTree();
});
</script>
</body>
</html>
