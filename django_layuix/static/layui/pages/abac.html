<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <title data-i18n="abac.title">ABAC 策略管理</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css">
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size:15px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px;">
                <i class="layui-icon layui-icon-auz" style="color:var(--primary-color);"></i> {{ t('abac.title') }}
            </span>
        </div>
        <div class="layui-card-body">
            <div class="layui-row layui-col-space12">
                <div class="layui-col-md7">
                    <div class="table-card">
                        <div class="card-title">{{ t('abac.policyList') }}</div>
                        <div id="policyList" style="padding:12px 16px;"></div>
                    </div>
                </div>
                <div class="layui-col-md5">
                    <div class="table-card">
                        <div class="card-title">{{ t('abac.policyConfig') }}</div>
                        <form class="layui-form" lay-filter="abacForm" style="padding:16px;">
                            <input type="hidden" name="id">
                            <div class="layui-form-item"><label class="layui-form-label">{{ t('abac.name') }}</label><div class="layui-input-block"><input name="name" required class="layui-input"></div></div>
                            <div class="layui-form-item"><label class="layui-form-label">{{ t('abac.resource') }}</label><div class="layui-input-block"><input name="resource" required class="layui-input" placeholder="store.Order / order:view"></div></div>
                            <div class="layui-form-item"><label class="layui-form-label">{{ t('abac.action') }}</label><div class="layui-input-block"><input name="action" value="view" class="layui-input"></div></div>
                            <div class="layui-form-item"><label class="layui-form-label">{{ t('abac.field') }}</label><div class="layui-input-block"><input name="field" class="layui-input" placeholder="{{ t('abac.fieldPlaceholder') }}"></div></div>
                            <div class="layui-form-item"><label class="layui-form-label">{{ t('abac.effect') }}</label><div class="layui-input-block"><select name="effect"><option value="allow">{{ t('abac.allow') }}</option><option value="deny">{{ t('abac.deny') }}</option></select></div></div>
                            <div class="layui-form-item"><label class="layui-form-label">{{ t('abac.priority') }}</label><div class="layui-input-block"><input name="priority" type="number" value="100" class="layui-input"></div></div>
                            <div class="layui-form-item layui-form-text"><label class="layui-form-label">{{ t('abac.expression') }}</label><div class="layui-input-block"><textarea name="expression" required class="layui-textarea" style="height:120px;" placeholder="{{ t('abac.expressionPlaceholder') }}"></textarea></div></div>
                            <button class="layui-btn layui-btn-sm" lay-submit lay-filter="abacSubmit">{{ t('common.save') }}</button>
                            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetAbac">{{ t('common.reset') }}</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261124b"></script>
<script src="/static/layui/js/i18n.js?v=20261124c"></script>
<script>
I18N.getLang();
renderI18n();
document.title = t('abac.title');
layui.use(['form', 'layer'], function() {
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    function loadPolicies() {
        getApi('/admin/api/rbac/abac-policies/', function(res) {
            if (res.code !== 200) return;
            var html = (res.data || []).map(function(p) {
                return '<div class="constraint-row"><span>' + escapeHtml(p.name) + ' · ' + escapeHtml(p.resource) + ' · ' + escapeHtml(p.action) + (p.field ? ' · ' + escapeHtml(p.field) : '')
                    + '</span><button class="layui-btn layui-btn-xs layui-btn-normal" data-edit="' + p.id + '">' + t('common.edit') + '</button></div>';
            }).join('') || '<div class="muted">' + t('abac.noPolicies') + '</div>';
            $('#policyList').html(html);
        });
    }

    $(document).off('click.abacEdit').on('click.abacEdit', '[data-edit]', function() {
        var id = $(this).data('edit');
        getApi('/admin/api/rbac/abac-policies/' + id + '/', function(res) {
            if (res.code !== 200) return;
            var p = res.data;
            form.val('abacForm', {id: p.id, name: p.name, resource: p.resource, action: p.action, field: p.field, effect: p.effect, priority: p.priority, expression: p.expression});
        });
    });

    form.on('submit(abacSubmit)', function(data) {
        var field = data.field;
        var payload = {name: field.name, resource: field.resource, action: field.action, field: field.field, effect: field.effect, priority: parseInt(field.priority) || 100, expression: field.expression};
        var url = '/admin/api/rbac/abac-policies/';
        var method = 'POST';
        if (field.id) { url = '/admin/api/rbac/abac-policies/' + field.id + '/'; method = 'PUT'; }
        function done(res) {
            layer.msg(res.msg || (res.code === 200 ? t('abac.saved') : t('abac.failed')), {icon: res.code === 200 ? 1 : 2});
            if (res.code === 200) { $('#resetAbac').click(); loadPolicies(); }
        }
        if (method === 'POST') postApi(url, payload, done); else putApi(url, payload, done);
        return false;
    });

    $('#resetAbac').on('click', function() {
        form.val('abacForm', {id: '', name: '', resource: '', action: 'view', field: '', effect: 'allow', priority: 100, expression: ''});
    });

    loadPolicies();
});
</script>
</body>
</html>
