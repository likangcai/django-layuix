<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 - 软件测试管理后台</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css">
    <script>
        (function() {
            var themeMode = localStorage.getItem('theme') || 'dark';
            if (themeMode !== 'dark' && themeMode !== 'light') themeMode = 'dark';
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        })();
    </script>
    <style>
        body {
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-container {
            text-align: center;
            padding: 40px;
        }
        .error-code {
            font-size: 150px;
            font-weight: 700;
            color: var(--border-color);
            line-height: 1;
            letter-spacing: -8px;
            margin-bottom: 10px;
            user-select: none;
        }
        .error-title {
            font-size: 22px;
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 36px;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            padding: 10px 32px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .btn-home:hover {
            opacity: 0.85;
            color: #fff;
        }
        .btn-home i {
            margin-right: 6px;
            font-size: 16px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-title" data-i18n="error.404.heading">页面未找到</div>
        <div class="error-desc" data-i18n="error.404.desc">抱歉，您访问的页面不存在或已被移除</div>
        <a href="/index/" class="btn-home">
            <i class="layui-icon layui-icon-home"></i><span data-i18n="error.backHome">返回首页</span>
        </a>
    </div>
    <script src="/static/layui/lib/layui.js"></script>
    <script src="/static/layui/js/common.js?v=20261124b"></script>
    <script src="/static/layui/js/i18n.js"></script>
    <script>
    inheritTheme();
    if (window.parent && window.parent.I18N) {
        window.I18N = window.parent.I18N;
        window.t = window.parent.t;
    } else {
        I18N.getLang();
    }
    renderI18n();
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        el.textContent = (typeof t === 'function') ? t(key) : el.textContent;
    });
    </script>
</body>
</html>
