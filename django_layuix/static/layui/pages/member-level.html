<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="data.memberLevel">会员等级</title>
    <link rel="icon" type="image/x-icon" href="/static/layui/favicon.ico">
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126p">
    <link rel="stylesheet" href="/static/layui/css/data-admin.css?v=3">
    <script>
        function syncParentTheme() {
            var themeMode = 'light';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', event.data.themeMode);
            }
        });
    </script>
    <style>
        body { margin: 0; padding: 0; background: var(--bg-primary); }
        .page-container { padding: 16px 18px; min-height: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="data-panel">
        <div class="data-head">
            <div>
                <div class="data-title" data-i18n="data.memberLevel">会员等级</div>
                <div class="data-subtitle" data-i18n="data.memberLevelDesc">维护会员等级、积分门槛和折扣比例</div>
            </div>
            <button type="button" class="layui-btn layui-btn-sm" id="addLevelBtn" data-perm="member_level:add">
                <i class="layui-icon layui-icon-add-1"></i> <span data-i18n="data.addMemberLevel">新增等级</span>
            </button>
        </div>
        <div class="data-body">
            <div class="data-toolbar">
                <input type="text" id="levelKeyword" class="layui-input data-keyword" data-i18n-placeholder="data.search" placeholder="搜索名称或编码" autocomplete="off">
                <select id="levelStatus" class="data-status">
                    <option value="" data-i18n="data.allStatus">全部状态</option>
                    <option value="1" data-i18n="data.enabled">启用</option>
                    <option value="0" data-i18n="data.disabled">停用</option>
                </select>
                <button type="button" class="layui-btn layui-btn-sm" id="searchLevelBtn"><i class="layui-icon layui-icon-search"></i></button>
                <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetLevelBtn"><i class="layui-icon layui-icon-refresh"></i></button>
            </div>
            <div class="data-table-host">
                <table id="levelTable" lay-filter="levelTable"></table>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="levelRowToolTpl">
    <div class="data-row-actions">
    {{# if(DataAdmin.hasPerm('member_level:edit')){ }}
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>{{ t('common.edit') }}</a>
    {{# } }}
    {{# if(DataAdmin.hasPerm('member_level:delete')){ }}
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete"><i class="layui-icon layui-icon-delete"></i>{{ t('common.delete') }}</a>
    {{# } }}
    </div>
</script>

<script type="text/html" id="levelFormTpl">
    <form class="layui-form admin-dialog-form" lay-filter="levelForm">
        <div class="data-form-grid">
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.name">名称</label>
                <div class="layui-input-block"><input type="text" name="name" class="layui-input" autocomplete="off"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.code">编码</label>
                <div class="layui-input-block"><input type="text" name="code" class="layui-input" autocomplete="off"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.minPoints">最低积分</label>
                <div class="layui-input-block"><input type="number" name="min_points" class="layui-input" value="0" min="0"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.discount">折扣比例</label>
                <div class="layui-input-block"><input type="number" name="discount" class="layui-input" value="100" min="0" max="100" step="0.01"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.icon">图标</label>
                <div class="layui-input-block"><input type="text" name="icon" class="layui-input" placeholder="layui-icon-diamond" autocomplete="off"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.sort">排序</label>
                <div class="layui-input-block"><input type="number" name="sort" class="layui-input" value="0"></div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-i18n="data.status">状态</label>
                <div class="layui-input-block"><input type="checkbox" name="status" lay-skin="switch" lay-text="启用|停用"></div>
            </div>
            <div class="layui-form-item data-form-full">
                <label class="layui-form-label" data-i18n="data.description">说明</label>
                <div class="layui-input-block"><textarea name="description" class="layui-textarea" placeholder=""></textarea></div>
            </div>
        </div>
        <div class="layui-form-mid layui-word-aux" style="margin-left:100px;" data-i18n="data.discountHint">100 表示不打折，95 表示 95 折</div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261126p"></script>
<script src="/static/layui/js/i18n.js?v=20261126p"></script>
<script src="/static/layui/js/data-admin.js?v=3"></script>
<script>
inheritTheme();
renderI18n();

layui.use(['form', 'table', 'layer'], function () {
    var $ = layui.jquery;
    var form = layui.form;
    var table = layui.table;
    var layer = layui.layer;

    function can(code) { return DataAdmin.hasPerm(code); }

    function applyPermissions() {
        $('[data-perm]').each(function () {
            var code = $(this).data('perm');
            if (code && !can(code)) $(this).addClass('permission-hidden');
            else $(this).removeClass('permission-hidden');
        });
    }

    function loadData() {
        var url = '/admin/api/rbac/member-levels/';
        var keyword = $('#levelKeyword').val().trim();
        var status = $('#levelStatus').val();
        var query = [];
        if (keyword) query.push('keyword=' + encodeURIComponent(keyword));
        if (status !== '') query.push('status=' + encodeURIComponent(status));
        if (query.length) url += '?' + query.join('&');
        getApi(url, function (res) {
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            var rows = (res.data && res.data.list) || [];
            LayuiUI.table({
                elem: '#levelTable',
                id: 'levelTable',
                data: rows,
                page: false,
                height: 'full-270',
                defaultToolbar: [],
                toolbar: DataAdmin.tableToolbar('member_levels'),
                cols: [[
                    {type: 'checkbox', width: 44},
                    {field: 'name', title: t('data.name'), width: 170, templet: function (d) {
                        var icon = d.icon ? '<i class="layui-icon ' + escapeHtml(d.icon) + '"></i> ' : '';
                        return icon + escapeHtml(d.name);
                    }},
                    {field: 'code', title: t('data.code'), width: 140},
                    {field: 'min_points', title: t('data.minPoints'), width: 110, align: 'center'},
                    {field: 'discount', title: t('data.discount'), width: 110, align: 'center', templet: function (d) {
                        return escapeHtml(d.discount) + '%';
                    }},
                    {field: 'sort', title: t('data.sort'), width: 80, align: 'center'},
                    {field: 'status', title: t('data.status'), width: 90, align: 'center', templet: function (d) {
                        return DataAdmin.statusBadge(d.status);
                    }},
                    {field: 'description', title: t('data.description'), minWidth: 180, templet: function (d) {
                        return d.description ? escapeHtml(d.description) : '<span style="color:var(--text-muted);">-</span>';
                    }},
                    {title: t('common.operation'), width: 175, align: 'center', toolbar: '#levelRowToolTpl'}
                ]]
            });
        });
    }

    function openDialog(data) {
        var isEdit = !!(data && data.id);
        LayuiUI.dialog({
            tplId: 'levelFormTpl',
            filter: 'levelForm',
            data: isEdit ? data : {status: true, sort: 0, discount: 100, min_points: 0},
            title: isEdit ? t('common.edit') + t('data.memberLevel') : t('data.addMemberLevel'),
            area: ['620px', 'auto'],
            standard: true,
            onSubmit: function (layero, index) {
                var field = form.val('levelForm');
                var payload = {
                    name: String(field.name || '').trim(),
                    code: String(field.code || '').trim(),
                    min_points: parseInt(field.min_points, 10) || 0,
                    discount: parseFloat(field.discount) || 0,
                    icon: String(field.icon || '').trim(),
                    sort: parseInt(field.sort, 10) || 0,
                    status: field.status === 'on',
                    description: String(field.description || '').trim()
                };
                if (!payload.name || !payload.code) {
                    layer.msg(t('common.required'), {icon: 2});
                    return false;
                }
                var done = function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('data.saved'), {icon: 1});
                    layer.close(index);
                    loadData();
                };
                if (isEdit) putApi('/admin/api/rbac/member-levels/' + data.id + '/', payload, done);
                else postApi('/admin/api/rbac/member-levels/create/', payload, done);
                return false;
            }
        });
    }

    table.on('tool(levelTable)', function (obj) {
        if (obj.event === 'edit') {
            openDialog(obj.data);
        } else if (obj.event === 'delete') {
            DataAdmin.confirmDelete(t('common.confirmDelete'), function () {
                deleteApi('/admin/api/rbac/member-levels/' + obj.data.id + '/', function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('common.deleteSuccess'), {icon: 1});
                    loadData();
                });
            });
        }
    });

    DataAdmin.bindTableToolbar(table, 'levelTable', 'member_levels', loadData);
    $('#addLevelBtn').on('click', function () { openDialog(null); });
    $('#searchLevelBtn').on('click', loadData);
    $('#resetLevelBtn').on('click', function () {
        $('#levelKeyword').val('');
        $('#levelStatus').val('');
        loadData();
    });
    $('#levelKeyword').on('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); loadData(); }
    });

    DataAdmin.loadPerms(function () {
        applyPermissions();
        form.render('select');
        loadData();
    });
});
</script>
</body>
</html>
