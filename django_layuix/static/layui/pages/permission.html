<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="permission.title">权限目录</title>
    <link rel="icon" type="image/x-icon" href="/static/layui/favicon.ico">
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261127a">
    <link rel="stylesheet" href="/static/layui/css/data-admin.css?v=3">
    <script>
        function syncParentTheme() {
            var themeMode = 'light';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch (e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function (event) {
            if (event.data && event.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', event.data.themeMode);
            }
        });
    </script>
    <style>
        body { margin: 0; padding: 0; background: var(--bg-primary); }
        .page-container { padding: 16px 18px; min-height: 100%; box-sizing: border-box; }
        .permission-stats { display: flex; gap: 12px; margin-bottom: 12px; }
        .permission-stat { flex: 1; padding: 12px 14px; border: 1px solid var(--card-border); border-radius: var(--radius-md); background: var(--card-bg); }
        .permission-stat b { display: block; font-size: 22px; color: var(--text-primary); }
        .permission-stat span { color: var(--text-muted); font-size: 12px; }
        .button-action-checks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; padding: 8px 0; }
        .button-action-checks .layui-form-checkbox { margin-right: 0 !important; }
    </style>
</head>
<body>
<div class="page-container">
    <div class="data-panel">
        <div class="data-head">
            <div>
                <div class="data-title" data-i18n="permission.title">权限目录</div>
                <div class="data-subtitle" data-i18n="permission.desc">查看内置页面与按钮权限定义，并控制启用状态</div>
            </div>
        </div>
        <div class="data-body">
            <div class="permission-stats">
                <div class="permission-stat"><b id="permissionTotal">0</b><span data-i18n="permission.total">权限总数</span></div>
                <div class="permission-stat"><b id="permissionPageCount">0</b><span data-i18n="permission.pageCount">页面权限</span></div>
                <div class="permission-stat"><b id="permissionButtonCount">0</b><span data-i18n="permission.buttonCount">按钮权限</span></div>
            </div>
            <div class="data-toolbar">
                <input type="text" id="permissionKeyword" class="layui-input data-keyword" data-i18n-placeholder="permission.searchPlaceholder" placeholder="搜索权限码、名称或路径" autocomplete="off">
                <select id="permissionKind" class="data-status">
                    <option value="" data-i18n="permission.allKinds">全部类型</option>
                    <option value="page" data-i18n="permission.pageKind">页面</option>
                    <option value="button" data-i18n="permission.buttonKind">按钮</option>
                </select>
                <select id="permissionStatus" class="data-status">
                    <option value="" data-i18n="data.allStatus">全部状态</option>
                    <option value="1" data-i18n="data.enabled">启用</option>
                    <option value="0" data-i18n="data.disabled">停用</option>
                </select>
                <button type="button" class="layui-btn layui-btn-sm" id="searchPermissionBtn"><i class="layui-icon layui-icon-search"></i></button>
                <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="resetPermissionBtn"><i class="layui-icon layui-icon-refresh"></i></button>
                <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="createButtonPermissionBtn" data-perm="permission:edit"><i class="layui-icon layui-icon-add-1"></i> {{ t('permission.addButton') }}</button>
            </div>
            <div class="data-table-host">
                <table id="permissionTable" lay-filter="permissionTable"></table>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="permissionRowToolTpl">
    <div class="data-row-actions">
    {{# if(DataAdmin.hasPerm('permission:edit')){ }}
    {{# if(d.protected){ }}
    <span class="layui-btn layui-btn-xs layui-btn-disabled"><i class="layui-icon layui-icon-auz"></i>{{ t('permission.protected') }}</span>
    {{# } else { }}
    <a class="layui-btn layui-btn-xs {{ d.status ? 'layui-btn-danger' : 'layui-btn-normal' }}" lay-event="toggle">
        <i class="layui-icon {{ d.status ? 'layui-icon-pause' : 'layui-icon-play' }}"></i>{{ d.status ? t('permission.disable') : t('permission.enable') }}
    </a>
    {{# if(d.deletable){ }}
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="deleteButton">{{ t('common.delete') }}</a>
    {{# } }}
    {{# } }}
    {{# } }}
    </div>
</script>

<script type="text/html" id="buttonPermissionFormTpl">
    <form class="layui-form" lay-filter="buttonPermissionForm" style="padding: 20px 30px 0;">
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('permission.parentMenu') }}</label>
            <div class="layui-input-block">
                <select name="parent_id" id="buttonParentSelect"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">{{ t('permission.actions') }}</label>
            <div class="layui-input-block">
                <div class="button-action-checks" id="buttonActionChecks"></div>
            </div>
        </div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261127a"></script>
<script src="/static/layui/js/i18n.js?v=20261127a"></script>
<script src="/static/layui/js/data-admin.js?v=3"></script>
<script>
inheritTheme();
renderI18n();

layui.use(['table', 'layer', 'form'], function () {
    var $ = layui.jquery;
    var table = layui.table;
    var layer = layui.layer;
    var form = layui.form;

    function applyPermissions() {
        $('[data-perm]').each(function () {
            var code = $(this).data('perm');
            if (code && !DataAdmin.hasPerm(code)) $(this).addClass('permission-hidden');
            else $(this).removeClass('permission-hidden');
        });
    }

    function loadData() {
        var query = [];
        var keyword = $('#permissionKeyword').val().trim();
        var kind = $('#permissionKind').val();
        var status = $('#permissionStatus').val();
        if (keyword) query.push('keyword=' + encodeURIComponent(keyword));
        if (kind) query.push('kind=' + encodeURIComponent(kind));
        if (status !== '') query.push('status=' + encodeURIComponent(status));
        getApi('/admin/api/rbac/permission-catalog/' + (query.length ? '?' + query.join('&') : ''), function (res) {
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            var data = res.data || {};
            $('#permissionTotal').text(data.total || 0);
            $('#permissionPageCount').text(data.page_count || 0);
            $('#permissionButtonCount').text(data.button_count || 0);
            var rows = (data.list || []).map(function (row) {
                row.protected = !!row.protected;
                return row;
            });
            LayuiUI.table({
                elem: '#permissionTable',
                id: 'permissionTable',
                data: rows,
                page: {limit: 20, limits: [20, 50, 100], layout: ['count', 'prev', 'page', 'next', 'skip']},
                height: 'full-360',
                defaultToolbar: [],
                cols: [[
                    {field: 'code', title: t('permission.code'), width: 190},
                    {field: 'name', title: t('data.name'), width: 190},
                    {field: 'kind', title: t('permission.kind'), width: 80, align: 'center', templet: function (d) {
                        return '<span class="data-tag ' + (d.kind === 'page' ? 'data-tag-info' : 'data-tag-muted') + '">' +
                            escapeHtml(d.kind_label) + '</span>';
                    }},
                    {field: 'source_label', title: t('permission.source'), width: 80, align: 'center', templet: function (d) {
                        return '<span class="data-tag ' + (d.source === 'builtin' ? 'data-tag-muted' : 'data-tag-info') + '">' +
                            escapeHtml(d.source_label) + '</span>';
                    }},
                    {field: 'path', title: t('permission.path'), minWidth: 220, templet: function (d) {
                        return d.path ? '<code>' + escapeHtml(d.path) + '</code>' : '<span style="color:var(--text-muted);">-</span>';
                    }},
                    {field: 'role_count', title: t('permission.roleCount'), width: 90, align: 'center'},
                    {field: 'status', title: t('data.status'), width: 80, align: 'center', templet: function (d) {
                        return DataAdmin.statusBadge(d.status);
                    }},
                    {title: t('common.operation'), width: 175, align: 'center', toolbar: '#permissionRowToolTpl'}
                ]]
            });
        });
    }

    function openButtonPermissionDialog() {
        getApi('/admin/api/rbac/menus/tree/?exclude_catalog=1', function (menuRes) {
            if (menuRes.code !== 200) {
                layer.msg(menuRes.msg || t('common.loadFailed'), {icon: 2});
                return;
            }
            getApi('/admin/api/rbac/userinfo/', function (userRes) {
                var actions = userRes.code === 200 ? (userRes.data.button_actions || []) : [];
                var menus = [];
                function walk(nodes, prefix) {
                    (nodes || []).forEach(function (node) {
                        if (node.menu_type === 1 || node.menu_type === 2) {
                            menus.push({id: node.id, name: prefix + node.name});
                        }
                        walk(node.children, prefix + '　');
                    });
                }
                walk(menuRes.data || [], '');
                if (!menus.length) {
                    layer.msg(t('permission.noActions'), {icon: 2});
                    return;
                }
                var parentHtml = menus.map(function (menu) {
                    return '<option value="' + menu.id + '">' + escapeHtml(menu.name) + '</option>';
                }).join('');
                var lang = userRes.code === 200 ? userRes.data.language : 'zh-hans';
                var actionHtml = actions.map(function (action) {
                    var label = lang === 'en' ? (action.en || action.value) : (action.zh_hans || action.value);
                    return '<input type="checkbox" name="button_actions" value="' + escapeHtml(action.value) +
                        '" title="' + escapeHtml(label) + '">';
                }).join('') || '<div class="layui-word-aux">' + escapeHtml(t('permission.noActions')) + '</div>';

                LayuiUI.dialog({
                    type: 1,
                    title: t('permission.addButton'),
                    area: ['560px', 'auto'],
                    content: renderTpl('buttonPermissionFormTpl'),
                    btn: [t('common.save'), t('common.cancel')],
                    success: function (layero) {
                        layero.find('#buttonParentSelect').html(parentHtml);
                        layero.find('#buttonActionChecks').html(actionHtml);
                        form.render(null, 'buttonPermissionForm');
                    },
                    yes: function (index, layero) {
                        var parentId = layero.find('#buttonParentSelect').val();
                        var selected = [];
                        layero.find('input[name="button_actions"]:checked').each(function () {
                            selected.push($(this).val());
                        });
                        if (!parentId || !selected.length) {
                            layer.msg(t('permission.noActions'), {icon: 2});
                            return;
                        }
                        var $btn = layero.find('.layui-layer-btn0');
                        $btn.prop('disabled', true);
                        postApi('/admin/api/rbac/permission-catalog/buttons/create/', {
                            parent_id: parseInt(parentId, 10),
                            actions: selected,
                            replace: false
                        }, function (res) {
                            $btn.prop('disabled', false);
                            if (res.code !== 200) {
                                layer.msg(res.msg || t('common.fail'), {icon: 2});
                                return;
                            }
                            layer.close(index);
                            layer.msg(t('permission.saved'), {icon: 1});
                            loadData();
                        });
                    }
                });
            });
        });
    }

    table.on('tool(permissionTable)', function (obj) {
        if (obj.event === 'deleteButton') {
            layer.confirm(t('permission.deleteConfirm'), {
                title: t('permission.title'), skin: 'layui-layer-admin',
                btn: [t('common.confirm'), t('common.cancel')]
            }, function (index) {
                layer.close(index);
                postApi('/admin/api/rbac/permission-catalog/buttons/' + obj.data.id + '/delete/', {}, function (res) {
                    if (res.code !== 200) {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    layer.msg(t('permission.deleted'), {icon: 1});
                    loadData();
                });
            });
            return;
        }
        if (obj.event !== 'toggle' || obj.data.protected) return;
        var nextStatus = !obj.data.status;
        var message = nextStatus ? t('permission.enableConfirm') : t('permission.disableConfirm');
        layer.confirm(message, {
            title: t('permission.title'), skin: 'layui-layer-admin',
            btn: [t('common.confirm'), t('common.cancel')]
        }, function (index) {
            layer.close(index);
            postApi('/admin/api/rbac/permission-catalog/' + obj.data.id + '/status/', {status: nextStatus}, function (res) {
                if (res.code !== 200) {
                    layer.msg(res.msg || t('common.fail'), {icon: 2});
                    return;
                }
                layer.msg(t('permission.saved'), {icon: 1});
                loadData();
            });
        });
    });

    $('#searchPermissionBtn').on('click', loadData);
    $('#createButtonPermissionBtn').on('click', openButtonPermissionDialog);
    $('#resetPermissionBtn').on('click', function () {
        $('#permissionKeyword').val('');
        $('#permissionKind').val('');
        $('#permissionStatus').val('');
        loadData();
    });
    $('#permissionKeyword').on('keydown', function (event) {
        if (event.key === 'Enter') { event.preventDefault(); loadData(); }
    });

    DataAdmin.loadPerms(function () {
        applyPermissions();
        loadData();
    });
});
</script>
</body>
</html>
