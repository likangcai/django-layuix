<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜单管理 - 软件测试管理后台</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261126f">
    <script>
        // 同步父页面主题
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        // 页面加载时同步主题
        syncParentTheme();
        // 监听主题变化
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .menu-layout { display: flex; gap: 16px; height: calc(100vh - 140px); min-height: 360px; }
        .menu-tree-panel {
            width: 280px; min-width: 280px; height: 100%;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden; padding: 12px;
            box-shadow: var(--shadow-sm);
        }
        .menu-tree-panel #menuTree { flex: 1; overflow: auto; }
        .menu-tree-panel .panel-title {
            font-size: 14px; font-weight: 600; padding: 8px 4px 12px;
            border-bottom: 1px solid var(--card-border); margin-bottom: 10px;
            color: var(--text-primary);
            display: flex; align-items: center; gap: 6px;
        }
        .menu-tree-panel .panel-title i { color: var(--primary-color); }
        .menu-table-panel { flex: 1; min-width: 0; height: 100%; overflow: hidden; }
        .permission-shuttle { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 8px; align-items: center; }
        .permission-shuttle select { height: 180px; }
        .permission-shuttle-actions { display: flex; flex-direction: column; gap: 8px; }
        .layui-form-label { width: 120px; padding: 9px 12px 9px 0; }
        .layui-input-block { margin-left: 130px; }
        .icon-preview { display: inline-block; width: 20px; text-align: center; margin-right: 5px; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
    </style>
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size: 15px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
                <i class="layui-icon layui-icon-template" style="color: var(--primary-color);"></i> <span data-i18n="menu.title">菜单管理</span>
            </span>
        </div>
        <div class="layui-card-body">

                <div class="menu-tree-panel">

                        <i class="layui-icon layui-icon-template"></i> <span data-i18n="menu.tree">菜单树</span>
                    </div>
                    <div id="menuTree"></div>
                </div>
                <!-- 右侧表格 -->
                <div class="menu-table-panel">
                    <table id="menuTable" lay-filter="menuTable"></table>

        </div>
    </div>
</div>

<script src="/static/layui/lib/layui.js"></script>
    <script src="/static/layui/js/common.js?v=20261126f"></script>
    <script src="/static/layui/js/i18n.js"></script>
    <script>
inheritTheme();

// 初始化语言
if (window.parent && window.parent.I18N) {
    window.I18N = window.parent.I18N;
    window.t = window.parent.t;
} else {
    I18N.getLang();
}

layui.use(['table', 'tree', 'form', 'layer'], function(){
    var table = layui.table;
    var tree = layui.tree;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    // 初始化 data-i18n 和 {{ t() }} 占位符
    $('[data-i18n]').each(function(){ var key = $(this).attr('data-i18n'); $(this).text(t(key)); });
    renderI18n();
    form.render('select');

    var currentUser = window.parent.currentUser || {};
    var permissions = currentUser.permissions || [];

    // 菜单类型映射
    var menuTypeMap = {1: t('menu.type.directory'), 2: t('menu.type.menu'), 3: t('menu.type.button')};
    var menuTypeColor = {1: '#FF9800', 2: '#1E9FFF', 3: '#5FB878'};

    // 将树形数据扁平化
    function flattenTree(data, level) {
        level = level || 0;
        var result = [];
        for (var i = 0; i < data.length; i++) {
            var item = data[i];
            result.push({
                id: item.id,
                name: item.name,
                name_en: item.name_en || '',
                name_zh_hans: item.name_zh_hans || '',
                icon: item.icon,
                menu_type: item.menu_type,
                permission: item.permission,
                sort: item.sort,
                visible: item.visible,
                status: item.status,
                backend_visible: item.backend_visible !== undefined ? item.backend_visible : true,
                frontend_visible: item.frontend_visible !== undefined ? item.frontend_visible : true,
                path: item.path,
                component: item.component,
                parent_id: item.parent_id || 0,
                level: level
            });
            if (item.children && item.children.length > 0) {
                result = result.concat(flattenTree(item.children, level + 1));
            }
        }
        return result;
    }

    // 为树形数据添加 parent_id
    function enrichTree(data, parentId) {
        for (var i = 0; i < data.length; i++) {
            data[i].parent_id = parentId || 0;
            if (data[i].children && data[i].children.length > 0) {
                enrichTree(data[i].children, data[i].id);
            }
        }
        return data;
    }

    // 构建下拉树选项
    function buildParentOptions(treeData, prefix, excludeId) {
        prefix = prefix || '';
        var html = '';
        for (var i = 0; i < treeData.length; i++) {
            var item = treeData[i];
            if (item.id === excludeId) continue;
            html += '<option value="' + escapeHtml(item.id) + '">' + prefix + escapeHtml(item.name) + '</option>';
            if (item.children && item.children.length > 0) {
                html += buildParentOptions(item.children, prefix + '-- ', excludeId);
            }
        }
        return html;
    }

    // 加载菜单树
    function loadMenuTree() {
        getApi('/admin/api/rbac/menus/tree/', function(res) {
            if (res.code === 200) {
                var treeData = enrichTree(res.data || [], 0);
                // layui tree 需要 title 字段
                function formatTreeData(nodes) {
                    var result = [];
                    for (var i = 0; i < nodes.length; i++) {
                        var node = nodes[i];
                        result.push({
                            id: node.id,
                            title: node.name,
                            icon: node.icon || '',
                            menu_type: node.menu_type,
                            permission: node.permission,
                            sort: node.sort,
                            visible: node.visible,
                            status: node.status,
                            path: node.path,
                            component: node.component,
                            parent_id: node.parent_id || 0,
                            spread: true,
                            children: node.children ? formatTreeData(node.children) : []
                        });
                    }
                    return result;
                }
                tree.render({
                    elem: '#menuTree',
                    data: formatTreeData(treeData),
                    showLine: true,
                    accordion: false,
                    click: function(obj) {
                        openMenuForm(obj.data);
                    }
                });
            }
        });
    }

    // 加载表格
    function loadTable() {
        getApi('/admin/api/rbac/menus/tree/', function(res) {
            if (res.code === 200) {
                var treeData = enrichTree(res.data || [], 0);
                var flatData = flattenTree(treeData);

                LayuiUI.table({
                    elem: '#menuTable',
                    toolbar: '#toolbarTpl',
                    defaultToolbar: [],
                    data: flatData,
                    page: false,
                    height: 'full-140',
                    even: true,
                    cols: [[
                        {field: 'name', title: t('menu.name'), minWidth: 200, templet: function(d) {
                            var indent = '';
                            for (var i = 0; i < d.level; i++) {
                                indent += '&nbsp;&nbsp;&nbsp;&nbsp;';
                            }
                            var icon = d.icon ? '<i class="layui-icon ' + escapeHtml(d.icon) + ' icon-preview"></i>' : '';
                            return indent + icon + escapeHtml(d.name);
                        }},
                        {field: 'icon', title: t('menu.icon'), width: 80, align: 'center', templet: function(d) {
                            return d.icon ? '<i class="layui-icon ' + escapeHtml(d.icon) + '" style="font-size:20px;"></i>' : '';
                        }},
                        {field: 'menu_type', title: t('menu.type'), width: 90, align: 'center', templet: function(d) {
                            var color = menuTypeColor[d.menu_type] || '#999';
                            return '<span style="color:' + color + ';font-weight:bold;">' + (menuTypeMap[d.menu_type] || t('common.unknown')) + '</span>';
                        }},
                        {field: 'sort', title: t('menu.sort'), width: 80, align: 'center'},
                        {field: 'visible', title: t('menu.visible'), width: 80, align: 'center', templet: function(d) {
                            return d.visible
                                ? '<span class="layui-badge layui-bg-green">' + (t('common.show') || '显示') + '</span>'
                                : '<span class="layui-badge layui-bg-gray">' + (t('common.hide') || '隐藏') + '</span>';
                        }},
                        {field: 'status', title: t('menu.status'), width: 80, align: 'center', templet: function(d) {
                            return d.status
                                ? '<span class="layui-badge layui-bg-green">' + t('common.enable') + '</span>'
                                : '<span class="layui-badge layui-bg-gray">' + t('common.disable') + '</span>';
                        }},
                        {field: 'backend_visible', title: t('menu.backendVisible') || '后台可见', width: 100, align: 'center', templet: function(d) {
                            return d.backend_visible
                                ? '<span class="layui-badge layui-bg-green">' + (t('common.show') || '显示') + '</span>'
                                : '<span class="layui-badge layui-bg-gray">' + (t('common.hide') || '隐藏') + '</span>';
                        }},
                        {field: 'frontend_visible', title: t('menu.frontendVisible') || '前台可见', width: 100, align: 'center', templet: function(d) {
                            return d.frontend_visible
                                ? '<span class="layui-badge layui-bg-green">' + (t('common.show') || '显示') + '</span>'
                                : '<span class="layui-badge layui-bg-gray">' + (t('common.hide') || '隐藏') + '</span>';
                        }},
                        {field: 'permission', title: t('menu.permission'), width: 160},
                        {title: t('common.operation'), width: 320, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
                    ]]
                });
            }
        });
    }

    function derivePermissionPrefix(menuData) {
        var code = String((menuData && menuData.permission) || '').trim();
        if (code.indexOf(':') > -1) return code.split(':')[0];
        var path = String((menuData && menuData.path) || '').replace(/^\/+|\/+$/g, '');
        if (path) {
            var segment = path.split('/').pop().replace('.html', '').replace(/-/g, '_');
            if (segment) return segment.toLowerCase();
        }
        return 'menu';
    }

    function actionLabel(action, lang) {
        return lang === 'en' ? (action.en || action.value) : (action.zh_hans || action.value);
    }

    function initPermissionShuttle(layero, menuData, treeData) {
        var root = $(layero);
        var currentUser = (window.parent && window.parent.currentUser) || {};
        var actions = currentUser.button_actions || [];
        var selected = {};

        function renderShuttle() {
            if (menuData) {
                var prefix = derivePermissionPrefix(menuData);
                function visit(nodes) {
                    (nodes || []).forEach(function(node) {
                        if (node.menu_type === 3 && node.permission && node.permission.indexOf(prefix + ':') === 0) {
                            var key = node.permission.split(':')[1];
                            if (key) selected[key] = true;
                        }
                        visit(node.children);
                    });
                }
                visit(treeData);
            }
            var availableHtml = actions.filter(function(a) { return !selected[a.value]; }).map(function(a) {
                return '<option value="' + escapeHtml(a.value) + '">' + escapeHtml(actionLabel(a, currentUser.language)) + '</option>';
            }).join('');
            var selectedHtml = actions.filter(function(a) { return selected[a.value]; }).map(function(a) {
                return '<option value="' + escapeHtml(a.value) + '">' + escapeHtml(actionLabel(a, currentUser.language)) + '</option>';
            }).join('');
            root.find('#availableActions').html(availableHtml);
            root.find('#selectedActions').html(selectedHtml);

            function move(from, to) {
                root.find(from + ' option:selected').each(function() {
                    root.find(to).append($(this).clone());
                    $(this).remove();
                });
            }
            root.find('#addAction').off('click').on('click', function() { move('#availableActions', '#selectedActions'); });
            root.find('#removeAction').off('click').on('click', function() { move('#selectedActions', '#availableActions'); });
            root.find('#addAllActions').off('click').on('click', function() { move('#availableActions', '#selectedActions'); });
            root.find('#removeAllActions').off('click').on('click', function() { move('#selectedActions', '#availableActions'); });
        }

        if (!actions.length) {
            getApi('/admin/api/rbac/userinfo/', function(res) {
                if (res.code === 200 && res.data) {
                    currentUser = res.data;
                    actions = currentUser.button_actions || [];
                }
                renderShuttle();
            });
        } else {
            renderShuttle();
        }
    }

    function selectedButtonActions(layero) {
        return $(layero).find('#selectedActions option').map(function() { return $(this).val(); }).get();
    }

    function generateButtons(menuId, layero, done) {
        var actions = selectedButtonActions(layero);
        postApi('/admin/api/rbac/menus/' + menuId + '/generate-permissions/', {
            actions: actions, replace: true
        }, function(res) {
            if (res.code !== 200) {
                layer.msg(res.msg || t('common.fail'), {icon: 2});
                done(false);
                return;
            }
            done(true);
        });
    }

    // 打开菜单表单弹窗
    function openMenuForm(menuData) {
        var isEdit = !!menuData;
        var title = isEdit ? t('menu.editForm.title') : t('menu.addForm.title');

        getApi('/admin/api/rbac/menus/tree/', function(res) {
            if (res.code !== 200) return;
            var treeData = enrichTree(res.data || [], 0);

            var layerIndex = LayuiUI.dialog({
                type: 1,
                title: title,
                area: ['600px', '580px'],
                content: renderTpl('menuFormTpl'),
                success: function(layero, index) {
                    var excludeId = isEdit ? menuData.id : null;
                    var optionsHtml = '<option value="">' + t('menu.topMenu') + '</option>' + buildParentOptions(treeData, '', excludeId);
                    layero.find('select[name="parent_id"]').html(optionsHtml);

                    if (isEdit) {
                        form.val('menuForm', {
                            id: menuData.id,
                            parent_id: menuData.parent_id || '',
                            menu_type: String(menuData.menu_type),
                            name: menuData.name,
                            name_en: menuData.name_en || '',
                            name_zh_hans: menuData.name_zh_hans || '',
                            icon: menuData.icon || '',
                            path: menuData.path || '',
                            component: menuData.component || '',
                            permission: menuData.permission || '',
                            sort: menuData.sort || 0,
                            visible: menuData.visible,
                            status: menuData.status,
                            backend_visible: menuData.backend_visible !== undefined ? menuData.backend_visible : true,
                            frontend_visible: menuData.frontend_visible !== undefined ? menuData.frontend_visible : true
                        });
                        if (menuData.icon) {
                            layero.find('#iconPreview').html('<i class="layui-icon ' + escapeHtml(menuData.icon) + '"></i> ').append(document.createTextNode(menuData.icon));
                        }
                        
                        // 初始化联动状态：如果 visible=false，禁用前后端可见性开关
                        if (!menuData.visible) {
                            layero.find('input[name="backend_visible"]').prop('disabled', true);
                            layero.find('input[name="frontend_visible"]').prop('disabled', true);
                            layero.find('.visibility-fields').css('opacity', '0.5');
                        }
                    } else if (menuData && menuData._parentId) {
                        form.val('menuForm', {
                            parent_id: menuData._parentId
                        });
                    }

                    initPermissionShuttle(layero, menuData, treeData);
                    form.render(null, 'menuForm');

                    // ===== 联动逻辑：visible 总开关控制 =====
                    bindFormOnce('switch(visibleSwitch)', function(data) {
                        var isVisible = data.elem.checked;
                        var $layero = $(layero);
                        
                        if (!isVisible) {
                            // visible=false 时，自动关闭 backend_visible 和 frontend_visible 并禁用
                            $layero.find('input[name="backend_visible"]').prop('checked', false).prop('disabled', true);
                            $layero.find('input[name="frontend_visible"]').prop('checked', false).prop('disabled', true);
                            $layero.find('.visibility-fields').css('opacity', '0.5');
                        } else {
                            // visible=true 时，恢复 backend_visible 和 frontend_visible 的控制
                            $layero.find('input[name="backend_visible"]').prop('checked', true).prop('disabled', false);
                            $layero.find('input[name="frontend_visible"]').prop('checked', true).prop('disabled', false);
                            $layero.find('.visibility-fields').css('opacity', '1');
                        }
                        form.render('checkbox', 'menuForm');
                    });

                    layero.find('input[name="icon"]').on('input', function() {
                        var val = $(this).val();
                        if (val) {
                            layero.find('#iconPreview').html('<i class="layui-icon ' + escapeHtml(val) + '"></i> ').append(document.createTextNode(val));
                        } else {
                            layero.find('#iconPreview').html('');
                        }
                    });

                    layero.find('#iconPickerBtn').on('click', function() {
                        openIconPicker(layero);
                    });

                    // 菜单类型切换
                    bindFormOnce('radio(menu_type)', function(data) {
                        toggleMenuFields(layero, data.value);
                    });

                    var currentType = isEdit ? String(menuData.menu_type) : '2';
                    toggleMenuFields(layero, currentType);
                }
            });
        });

        // 表单提交（绑定一次，避免重复绑定）
        form.on('submit(menuSubmit)', function(data) {
            var field = data.field;
            var id = field.id;
            var submitData = {
                name: field.name,
                name_en: field.name_en || '',
                name_zh_hans: field.name_zh_hans || '',
                icon: field.icon || 'layui-icon-app',
                path: field.path || '',
                component: field.component || '',
                menu_type: parseInt(field.menu_type),
                permission: field.permission || '',
                sort: parseInt(field.sort) || 0,
                visible: field.visible === 'on',
                status: field.status === 'on',
                backend_visible: field.backend_visible === 'on',
                frontend_visible: field.frontend_visible === 'on',
                parent_id: field.parent_id ? parseInt(field.parent_id) : null
            };

            // 获取提交按钮并添加动画
            var $btn = $('button[lay-filter="menuSubmit"]');
            $btn.prop('disabled', true).addClass('layui-btn-disabled').html('<i class="layui-icon layui-icon-loading-1 layui-anim layui-anim-rotate layui-anim-loop"></i> ' + (t('common.submitting') || '提交中...'));

            if (id) {
                putApi('/admin/api/rbac/menus/' + id + '/', submitData, function(res) {
                    if (res.code !== 200) {
                        $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    generateButtons(id, $btn.closest('.layui-layer'), function(success) {
                        $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                        if (!success) return;
                        layer.msg(t('common.updateSuccess'), {icon: 1});
                        layer.closeAll();
                        loadMenuTree();
                        loadTable();
                    });
                });
            } else {
                postApi('/admin/api/rbac/menus/create/', submitData, function(res) {
                    if (res.code !== 200) {
                        $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                        return;
                    }
                    generateButtons(res.data.id, $btn.closest('.layui-layer'), function(success) {
                        $btn.prop('disabled', false).removeClass('layui-btn-disabled').text(t('common.confirm') || '确认');
                        if (!success) return;
                        layer.msg(t('common.addSuccess'), {icon: 1});
                        layer.closeAll();
                        loadMenuTree();
                        loadTable();
                    });
                });
            }
            return false;
        });
    }

    // 根据菜单类型切换字段显示
    function toggleMenuFields(layero, type) {
        // 动态修改名称 label
        var nameLabels = {
            '1': t('menu.name.directory'),
            '2': t('menu.name.menu'),
            '3': t('menu.name.button')
        };
        var nameLabel = nameLabels[type] || t('menu.name');
        layero.find('input[name="name"]').attr('placeholder', nameLabel);
        layero.find('input[name="name"]').attr('lay-reqtext', nameLabel);
        layero.find('.layui-form-item:has(input[name="name"]) .layui-form-label').text(nameLabel);

        layero.find('.menu-field').each(function() {
            var types = $(this).data('types');
            if (types) {
                var typeArr = String(types).split(',');
                if (typeArr.indexOf(type) > -1) {
                    $(this).show();
                } else {
                    $(this).hide();
                }
            }
        });
    }

                function renderIcons(keyword) {
                    var html = '';
                    var filtered = keyword
                        ? icons.filter(function(icon) { return icon.indexOf(keyword) > -1; })
                        : icons;
                    for (var i = 0; i < filtered.length; i++) {
                        html += '<div class="icon-item" data-icon="' + filtered[i] + '" style="' +

                            'align-items:center;justify-content:center;cursor:pointer;' +
                            'border:1px solid var(--border-color);border-radius:4px;font-size:10px;' +
                            'transition:all 0.2s;" onmouseover="this.style.borderColor=\'var(--primary-color)\';this.style.color=\'var(--primary-color)\'"' +

                renderIcons('');

                layero.find('#iconSearchInput').on('input', function() {
                    renderIcons($(this).val().trim());
                });
            }
        });
    }

    // 工具栏事件
    table.on('toolbar(menuTable)', function(obj) {
        if (obj.event === 'addTop') {
            openMenuForm(null);
        } else if (obj.event === 'refresh') {
            loadMenuTree();
            loadTable();
        }
    });

    // 操作列事件
    table.on('tool(menuTable)', function(obj) {
        var data = obj.data;
        if (obj.event === 'addChild') {
            openMenuForm({_parentId: data.id});
        } else if (obj.event === 'edit') {
            openMenuForm(data);
        } else if (obj.event === 'del') {
            layer.confirm(t('common.confirmDelete') + '<br><b>' + escapeHtml(data.name) + '</b>', {
                icon: 3,
                title: t('common.deleteConfirm.title'),
                btn: [t('common.confirm'), t('common.cancel')]
            }, function(index) {
                deleteApi('/admin/api/rbac/menus/' + data.id + '/', function(res) {
                    if (res.code === 200) {
                        layer.msg(t('common.deleteSuccess'), {icon: 1});
                        layer.close(index);
                        loadMenuTree();
                        loadTable();
                    } else {
                        layer.msg(res.msg || t('common.fail'), {icon: 2});
                    }
                });
            });
        }
    });

    // 初始化
    loadMenuTree();
    loadTable();
});
