<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主题切换测试</title>
    <style>
        :root {
            --primary-color: #1e9fff;
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-primary: #1f2329;
        }
        
        html[data-theme="theme-element-blue"] {
            --primary-color: #409EFF;
            --bg-body: #eef5ff;
            --bg-card: #ffffff;
            --text-primary: #1f2329;
        }
        
        html[data-theme="theme-enterprise-purple"] {
            --primary-color: #8263B1;
            --bg-body: #f5f3ff;
            --bg-card: #ffffff;
            --text-primary: #1f2329;
        }
        
        html[data-theme="theme-deep-black"] {
            --primary-color: #00BCD4;
            --bg-body: #0d0d0d;
            --bg-card: #1a1a1a;
            --text-primary: #e5eaf3;
        }
        
        body {
            padding: 40px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-family: Arial, sans-serif;
        }
        
        .card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .btn {
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .color-box {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>主题切换测试</h1>
    <p>当前主题: <strong id="currentTheme"></strong></p>
    
    <div class="card">
        <h2>颜色预览</h2>
        <div>
            <div class="color-box" id="primaryBox" style="background: var(--primary-color);" title="主色"></div>
            <div class="color-box" id="bgBodyBox" style="background: var(--bg-body);" title="背景色"></div>
            <div class="color-box" id="bgCardBox" style="background: var(--bg-card); border: 1px solid #ddd;" title="卡片背景"></div>
        </div>
        <p>--primary-color: <span id="primaryValue"></span></p>
        <p>--bg-body: <span id="bgBodyValue"></span></p>
        <p>--bg-card: <span id="bgCardValue"></span></p>
    </div>
    
    <div class="card">
        <h2>主题切换按钮</h2>
        <button class="btn" onclick="setTheme('default')">默认主题</button>
        <button class="btn" onclick="setTheme('theme-element-blue')">Element蓝</button>
        <button class="btn" onclick="setTheme('theme-enterprise-purple')">企业紫</button>
        <button class="btn" onclick="setTheme('theme-deep-black')">深邃黑</button>
    </div>
    
    <script>
        function updateDisplay() {
            const theme = document.documentElement.getAttribute('data-theme') || '未设置';
            document.getElementById('currentTheme').textContent = theme;
            
            const styles = getComputedStyle(document.body);
            document.getElementById('primaryValue').textContent = styles.getPropertyValue('--primary-color');
            document.getElementById('bgBodyValue').textContent = styles.getPropertyValue('--bg-body');
            document.getElementById('bgCardValue').textContent = styles.getPropertyValue('--bg-card');
        }
        
        function setTheme(theme) {
            console.log('Setting theme:', theme);
            if (theme === 'default') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
            updateDisplay();
            console.log('Current data-theme:', document.documentElement.getAttribute('data-theme'));
        }
        
        updateDisplay();
    </script>
</body>
</html>
