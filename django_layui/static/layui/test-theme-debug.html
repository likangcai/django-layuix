<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>主题切换测试</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/themes.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css">
    <style>
        body { padding: 40px; background: var(--bg-body); }
        .test-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            margin: 10px;
            display: inline-block;
        }
        .btn {
            padding: 10px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
    <h1>主题切换测试</h1>
    <p>当前主题: <span id="currentTheme"></span></p>
    <p>当前模式: <span id="currentMode"></span></p>
    
    <h2>主题变量值:</h2>
    <div class="test-card">
        <p>--primary-color: <span id="primaryColor"></span></p>
        <p>--bg-body: <span id="bgBody"></span></p>
        <p>--bg-card: <span id="bgCard"></span></p>
        <p>--text-primary: <span id="textPrimary"></span></p>
    </div>
    
    <h2>颜色预览:</h2>
    <div>
        <div class="color-box" id="primaryBox" title="主色"></div>
        <div class="color-box" id="bgBodyBox" title="背景色"></div>
        <div class="color-box" id="bgCardBox" title="卡片背景"></div>
    </div>
    
    <h2>主题切换按钮:</h2>
    <button class="btn" onclick="applyThemeTest('theme-element-blue')">Element蓝</button>
    <button class="btn" onclick="applyThemeTest('theme-enterprise-purple')">企业紫</button>
    <button class="btn" onclick="applyThemeTest('theme-fresh-green')">清新绿</button>
    <button class="btn" onclick="applyThemeTest('theme-deep-black')">深邃黑</button>
    <button class="btn" onclick="applyThemeTest('theme-default-dark')">默认深色</button>
    <button class="btn" onclick="applyThemeTest('theme-default-light')">默认浅色</button>
    
    <script>
        function updateDisplay() {
            document.getElementById('currentTheme').textContent = document.documentElement.getAttribute('data-theme') || '未设置';
            document.getElementById('currentMode').textContent = document.documentElement.getAttribute('data-theme-mode') || '未设置';
            
            const styles = getComputedStyle(document.body);
            document.getElementById('primaryColor').textContent = styles.getPropertyValue('--primary-color');
            document.getElementById('bgBody').textContent = styles.getPropertyValue('--bg-body');
            document.getElementById('bgCard').textContent = styles.getPropertyValue('--card-bg');
            document.getElementById('textPrimary').textContent = styles.getPropertyValue('--text-primary');
            
            document.getElementById('primaryBox').style.background = styles.getPropertyValue('--primary-color');
            document.getElementById('bgBodyBox').style.background = styles.getPropertyValue('--bg-body');
            document.getElementById('bgCardBox').style.background = styles.getPropertyValue('--card-bg');
        }
        
        function applyThemeTest(theme) {
            console.log('Applying theme:', theme);
            document.documentElement.setAttribute('data-theme', theme);
            
            // 设置模式
            const darkThemes = ['theme-default-dark', 'theme-ant-design-black', 'theme-adminlte-blue', 
                               'theme-enterprise-purple', 'theme-enterprise-red', 'theme-deep-black', 
                               'theme-midnight-blue', 'theme-mint-cyan', 'theme-flame-red', 
                               'theme-aurora-purple', 'theme-geek-green', 'theme-cyberpunk', 
                               'theme-deep-sea', 'theme-premium-black'];
            const isDark = darkThemes.includes(theme);
            document.documentElement.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
            
            localStorage.setItem('theme', theme);
            updateDisplay();
            console.log('Theme applied. data-theme:', document.documentElement.getAttribute('data-theme'));
            console.log('data-theme-mode:', document.documentElement.getAttribute('data-theme-mode'));
        }
        
        // 初始化
        const savedTheme = localStorage.getItem('theme') || 'theme-default-dark';
        applyThemeTest(savedTheme);
        
        // 监听属性变化
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === 'data-theme' || mutation.attributeName === 'data-theme-mode') {
                    updateDisplay();
                }
            });
        });
        observer.observe(document.documentElement, { attributes: true });
    </script>
</body>
</html>
