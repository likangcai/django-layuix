<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <title data-i18n="permission_demo.title">权限示例订单</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css">
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size:15px;font-weight:600;color:var(--text-primary);">
                <i class="layui-icon layui-icon-form" style="color:var(--primary-color);"></i>
                <span data-i18n="permission_demo.title">权限示例订单</span>
            </span>
        </div>
        <div class="layui-card-body">
            <p class="muted" data-i18n="permission_demo.scopeHint">当前列表演示数据范围过滤与 ABAC 字段级控制</p>
            <table id="demoOrderTable" lay-filter="demoOrderTable"></table>
        </div>
    </div>
</div>
<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=1.4.2"></script>
<script src="/static/layui/js/i18n.js?v=1.4.2"></script>
<script>
I18N.getLang();
renderI18n();
document.title = t('permission_demo.title');
layui.use(['table'], function() {
    var table = layui.table;
    table.render({
        elem: '#demoOrderTable',
        url: '/admin/api/permission-demo/orders/',
        height: 'full-220',
        page: false,
        response: {statusCode: 200, dataName: 'data', countName: 'count'},
        cols: [[
            {field: 'id', title: 'ID', width: 70},
            {field: 'title', title: t('permission_demo.titleField'), minWidth: 180},
            {field: 'owner_name', title: t('permission_demo.owner'), width: 140},
            {field: 'department', title: t('permission_demo.department'), width: 140},
            {field: 'amount', title: t('permission_demo.amount'), width: 120},
            {field: 'cost', title: t('permission_demo.cost'), width: 120},
            {field: 'status', title: t('permission_demo.status'), width: 110}
        ]]
    });
});
</script>
</body>
</html>
