<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <link rel="icon" type="image/x-icon" href="/static/layui/favicon.ico">
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css?v=20261129a">
    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'light';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .search-bar { margin-bottom: 16px; }
        .search-bar .layui-form-item { margin-bottom: 16px; }
        .search-bar .layui-inline { margin-right: 16px; }
        .search-bar .layui-form-label { width: 120px; padding: 9px 12px 9px 0; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
    </style>
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size:15px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px;">
                <i class="layui-icon layui-icon-form" style="color:var(--primary-color);"></i> 订单管理
            </span>
        </div>
        <div class="layui-card-body">
            <!-- 搜索栏 -->
            <div class="search-bar">
                <form class="layui-form" lay-filter="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label" data-i18n="common.keyword">关键词</label>
                            <div class="layui-input-inline w-200">
                                <input type="text" name="keyword" id="searchKeyword" placeholder="{{ t('store.orderSearchPlaceholder') }}" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label" data-i18n="store.orderStatus">订单状态</label>
                            <div class="layui-input-inline w-150">
                                <select name="status" id="searchStatus">
                                    <option value="" data-i18n="store.all">全部</option>
                                    <option value="pending" data-i18n="store.pending">待付款</option>
                                    <option value="paid" data-i18n="store.paid">已付款</option>
                                    <option value="shipped" data-i18n="store.shipped">已发货</option>
                                    <option value="completed" data-i18n="store.completed">已完成</option>
                                    <option value="cancelled" data-i18n="store.cancelled">已取消</option>
                                    <option value="refunded" data-i18n="store.refunded">已退款</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline search-btns">
                            <button type="button" class="layui-btn layui-btn-sm" id="searchBtn">
                                <i class="layui-icon layui-icon-search"></i> <span data-i18n="common.search">搜索</span>
                            </button>
                            <button type="reset" class="layui-btn layui-btn-sm layui-btn-primary" id="resetBtn">
                                <i class="layui-icon layui-icon-refresh"></i> <span data-i18n="common.reset">重置</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- 表格 -->
            <table id="orderTable" lay-filter="orderTable"></table>
        </div>
    </div>
</div>

<!-- 工具栏模板 -->
<script type="text/html" id="toolbarTpl">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> <span data-i18n="store.addOrder">新增订单</span>
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="refresh">
            <i class="layui-icon layui-icon-refresh"></i> <span data-i18n="common.refresh">刷新</span>
        </button>
    </div>
</script>

<!-- 操作列模板：查看/编辑 直接展示，其他业务操作放在更多下拉菜单中 -->
<script type="text/html" id="operateTpl">
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="view"><span data-i18n="common.view">查看</span></a>
    <a class="layui-btn layui-btn-xs" lay-event="edit"><span data-i18n="common.edit">编辑</span></a>
    <a class="layui-btn layui-btn-xs" lay-event="more"><span data-i18n="store.more">更多</span><i class="layui-icon layui-icon-down" style="margin-left:3px;font-size:12px"></i></a>
</script>

<!-- 新增订单弹窗模板 (只有返回/保存按钮) -->
<script type="text/html" id="addFormTpl">
    <form class="layui-form" lay-filter="addForm" style="padding:20px 30px 0;">
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.customerName">客户姓名</label>
            <div class="layui-input-block">
                <input type="text" name="customer_name" lay-verify="required" placeholder="请输入客户姓名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.customerPhone">联系电话</label>
            <div class="layui-input-block">
                <input type="text" name="customer_phone" lay-verify="required" placeholder="请输入联系电话" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.shippingAddress">收货地址</label>
            <div class="layui-input-block">
                <input type="text" name="shipping_address" placeholder="请输入收货地址" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.orderStatus">订单状态</label>
            <div class="layui-input-inline w-150">
                <select name="status">
                    <option value="pending" data-i18n="store.pending">待付款</option>
                    <option value="paid" data-i18n="store.paid">已付款</option>
                    <option value="shipped" data-i18n="store.shipped">已发货</option>
                    <option value="completed" data-i18n="store.completed">已完成</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.orderAmount">订单金额</label>
            <div class="layui-input-block">
                <input type="number" name="total_amount" step="0.01" value="0" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.remark">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" placeholder="{{ t('store.remarkPlaceholder') }}" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item" style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border-color);padding-top:15px;margin-top:10px;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="addFormCancel">返回</button>
            <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="addSubmit">保存</button>
        </div>
    </form>
</script>

<!-- 编辑订单弹窗模板 -->
<script type="text/html" id="editFormTpl">
    <form class="layui-form" lay-filter="editForm" style="padding:20px 30px 0;">
        <input type="hidden" name="id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.orderNo">订单号</label>
            <div class="layui-input-block">
                <input type="text" name="order_no" readonly class="layui-input layui-disabled" style="background:var(--bg-tertiary);">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.customerName">客户姓名</label>
            <div class="layui-input-block">
                <input type="text" name="customer_name" lay-verify="required" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.customerPhone">联系电话</label>
            <div class="layui-input-block">
                <input type="text" name="customer_phone" lay-verify="required" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.shippingAddress">收货地址</label>
            <div class="layui-input-block">
                <input type="text" name="shipping_address" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.orderStatus">订单状态</label>
            <div class="layui-input-inline w-150">
                <select name="status">
                    <option value="pending" data-i18n="store.pending">待付款</option>
                    <option value="paid" data-i18n="store.paid">已付款</option>
                    <option value="shipped" data-i18n="store.shipped">已发货</option>
                    <option value="completed" data-i18n="store.completed">已完成</option>
                    <option value="cancelled" data-i18n="store.cancelled">已取消</option>
                    <option value="refunded" data-i18n="store.refunded">已退款</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.orderAmount">订单金额</label>
            <div class="layui-input-block">
                <input type="number" name="total_amount" step="0.01" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label" data-i18n="store.remark">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item" style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border-color);padding-top:15px;margin-top:10px;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="editFormCancel">返回</button>
            <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="editSubmit">保存</button>
        </div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261129a"></script>
<script src="/static/layui/js/i18n.js?v=20261129a"></script>
<script>
inheritTheme();
I18N.getLang();
renderI18n();

layui.use(['table', 'form', 'layer', 'dropdown'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var dropdown = layui.dropdown;
    var $ = layui.$;

    var tableIns = null;

    // 构建搜索参数
    function getSearchParams() {
        var params = {};
        var keyword = $('#searchKeyword').val().trim();
        if (keyword) params.keyword = keyword;
        var status = $('#searchStatus').val();
        if (status) params.status = status;
        return params;
    }

    // 状态样式映射
    var statusStyle = {
        'pending':    {color: '#faad14', label: t('store.pending')},
        'paid':       {color: '#1890ff', label: t('store.paid')},
        'shipped':    {color: '#722ed1', label: t('store.shipped')},
        'completed':  {color: '#52c41a', label: t('store.completed')},
        'cancelled':  {color: '#ff4d4f', label: t('store.cancelled')},
        'refunded':   {color: '#fa8c16', label: t('store.refunded')}
    };

    // 加载列表（使用 url 服务端分页）
    function loadTable() {
        tableIns = LayuiUI.table({
            elem: '#orderTable',
            url: '/admin/api/store/orders/',
            toolbar: '#toolbarTpl',
            defaultToolbar: [],
            where: getSearchParams(),
            height: 'full-220',
            page: {
                limit: 10,
                limits: [10, 30, 50, 100],
                layout: ['count', 'prev', 'page', 'next', 'skip', 'limit']
            },
            even: true,
            parseData: function(res) {
                return {
                    "code": res.code === 200 ? 0 : res.code,
                    "msg": res.msg,
                    "count": res.data ? res.data.total : 0,
                    "data": res.data ? res.data.list : []
                };
            },
            request: {
                pageName: 'page',
                limitName: 'page_size'
            },
            cols: [[
                {field: 'order_no', title: t('store.orderNo'), width: 180},
                {field: 'customer_name', title: '客户', width: 90},
                {field: 'customer_phone', title: t('store.customerPhone'), width: 130},
                {field: 'total_amount', title: '金额', width: 100, align: 'center',
                    templet: function(d) { return '¥<strong style="color:#1890ff">' + d.total_amount + '</strong>'; }
                },
                {field: 'status_label', title: t('common.status'), width: 90, align: 'center',
                    templet: function(d) {
                        var s = statusStyle[d.status] || {color: '#999', label: '未知'};
                        return '<span style="background:' + s.color + ';color:#fff;padding:2px 8px;border-radius:10px;font-size:12px">' + s.label + '</span>';
                    }
                },
                {field: 'remark', title: t('store.remark'), minWidth: 120},
                {field: 'create_time', title: '下单时间', width: 170, align: 'center'},
                {title: t('store.operation'), width: 230, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
            ]]
        });
    }

    // 打开新增弹窗 (只有返回/保存按钮)
    function openAddForm() {
        LayuiUI.dialog({
            type: 1,
            title: t('store.addOrder'),
            area: ['550px', 'auto'],
            content: $('#addFormTpl').html(),
            success: function(layero, index) {
                form.render(null, 'addForm');

                // 返回按钮（关闭弹窗）
                layero.find('#addFormCancel').on('click', function() {
                    layer.close(index);
                });
            }
        });
    }

    // 新增提交
    form.on('submit(addSubmit)', function(data) {
        var submitBtn = $(data.elem).prop('disabled', true).addClass('layui-btn-disabled');
        var field = data.field;
        postApi('/admin/api/store/orders/create/', field, function(res) {
            if (res.code === 200) {
                layer.msg(t('store.created'), {icon: 1});
                layer.closeAll();
                tableIns.reload({
                    where: getSearchParams()
                });
            } else {
                layer.msg(res.msg || t('store.createFailed'), {icon: 2});
            }
        }).always(function() {
            submitBtn.prop('disabled', false).removeClass('layui-btn-disabled');
        });
        return false;
    });

    // 打开编辑弹窗
    function openEditForm(rowData) {
        LayuiUI.dialog({
            type: 1,
            title: '编辑订单 - ' + rowData.order_no,
            area: ['550px', 'auto'],
            content: $('#editFormTpl').html(),
            success: function(layero, index) {
                form.val('editForm', {
                    id: rowData.id,
                    order_no: rowData.order_no,
                    customer_name: rowData.customer_name,
                    customer_phone: rowData.customer_phone,
                    shipping_address: rowData.shipping_address,
                    status: rowData.status,
                    total_amount: rowData.total_amount,
                    remark: rowData.remark
                });
                form.render(null, 'editForm');

                // 返回按钮（关闭弹窗）
                layero.find('#editFormCancel').on('click', function() {
                    layer.close(index);
                });
            }
        });
    }

    // 编辑提交
    form.on('submit(editSubmit)', function(data) {
        var submitBtn = $(data.elem).prop('disabled', true).addClass('layui-btn-disabled');
        var field = data.field;
        var id = field.id;
        putApi('/admin/api/store/orders/' + id + '/', field, function(res) {
            if (res.code === 200) {
                layer.msg(t('store.updated'), {icon: 1});
                layer.closeAll();
                tableIns.reload({
                    where: getSearchParams()
                });
            } else {
                layer.msg(res.msg || t('store.updateFailed'), {icon: 2});
            }
        }).always(function() {
            submitBtn.prop('disabled', false).removeClass('layui-btn-disabled');
        });
        return false;
    });

    // 搜索
    $(document).off('click.orderSearch').on('click.orderSearch', '#searchBtn', function(e) {
        e.preventDefault();
        tableIns.reload({
            where: getSearchParams(),
            page: {curr: 1}
        });
    });

    // 重置
    $(document).off('click.orderReset').on('click.orderReset', '#resetBtn', function(e) {
        e.preventDefault();
        $('#searchKeyword').val('');
        $('#searchStatus').val('');
        form.render('select');
        tableIns.reload({
            where: {},
            page: {curr: 1}
        });
    });

    // 回车搜索
    $(document).off('keydown.orderSearch').on('keydown.orderSearch', '#searchKeyword', function(e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            tableIns.reload({
                where: getSearchParams(),
                page: {curr: 1}
            });
        }
    });

    // 工具栏事件
    table.on('toolbar(orderTable)', function(obj) {
        if (obj.event === 'add') {
            openAddForm();
        } else if (obj.event === 'refresh') {
            tableIns.reload({
                where: getSearchParams()
            });
        }
    });

    // 操作列事件
    table.on('tool(orderTable)', function(obj) {
        var data = obj.data;
        if (obj.event === 'view') {
            var s = statusStyle[data.status] || {color: '#999', label: '未知'};
            // 构建商品明细
            var itemsHtml = '';
            if (data.items && data.items.length > 0) {
                itemsHtml = '<table class="layui-table" style="margin:0"><thead><tr><th>商品</th><th>编码</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>';
                for (var i = 0; i < data.items.length; i++) {
                    var item = data.items[i];
                    itemsHtml += '<tr><td>' + escapeHtml(item.product_name) + '</td><td>' + escapeHtml(item.product_sku) + '</td><td>¥' + item.unit_price + '</td><td>' + item.quantity + '</td><td>¥' + item.subtotal + '</td></tr>';
                }
                itemsHtml += '</tbody></table>';
            } else {
                itemsHtml = '<span style="color:var(--text-muted)">暂无明细</span>';
            }
            var content = '<div style="padding:20px 30px;">' +
                '<div class="layui-form-item"><label class="layui-form-label" data-i18n="store.orderNo">订单号</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.order_no || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">客户</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.customer_name || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">电话</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.customer_phone || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">地址</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.shipping_address || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">金额</label><div class="layui-input-block"><input type="text" value="¥' + escapeHtml(data.total_amount || '0') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label" data-i18n="common.status">状态</label><div class="layui-input-block"><input type="text" value="' + s.label + '" style="color:' + s.color + ';font-weight:bold" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label" data-i18n="store.remark">备注</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>' + escapeHtml(data.remark || '') + '</textarea></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">下单时间</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.create_time || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">商品明细</label><div class="layui-input-block">' + itemsHtml + '</div></div>' +
                '</div>';
            LayuiUI.dialog({
                type: 1,
                title: '查看订单 - ' + data.order_no,
                area: ['700px', 'auto'],
                content: content,
                btn: ['关闭']
            });
        } else if (obj.event === 'edit') {
            openEditForm(data);
        } else if (obj.event === 'more') {
            // 使用 layui.dropdown 展示更多操作
            var items = [];
            if (data.status === 'paid') {
                items.push({title: '订单发货', id: 'ship'});
            }
            if (data.status === 'pending' || data.status === 'paid') {
                items.push({title: '取消订单', id: 'cancel'});
            }
            items.push({title: '删除订单', id: 'del'});

            dropdown.render({
                elem: this,
                show: true,
                data: items,
                click: function(menuitem) {
                    if (menuitem.id === 'ship') {
                        layer.confirm('确认将订单 <b>' + escapeHtml(data.order_no) + '</b> 标记为已发货吗？', {
                            icon: 3, title: '订单发货', btn: ['确认', '取消']
                        }, function(index) {
                            putApi('/admin/api/store/orders/' + data.id + '/', {status: 'shipped'}, function(res) {
                                if (res.code === 200) {
                                    layer.msg('发货成功', {icon: 1});
                                    layer.close(index);
                                    tableIns.reload({where: getSearchParams()});
                                } else {
                                    layer.msg(res.msg || '操作失败', {icon: 2});
                                }
                            });
                        });
                    } else if (menuitem.id === 'cancel') {
                        layer.confirm('确认取消订单 <b>' + escapeHtml(data.order_no) + '</b> 吗？', {
                            icon: 3, title: '取消订单', btn: ['确认', '取消']
                        }, function(index) {
                            putApi('/admin/api/store/orders/' + data.id + '/', {status: 'cancelled'}, function(res) {
                                if (res.code === 200) {
                                    layer.msg('订单已取消', {icon: 1});
                                    layer.close(index);
                                    tableIns.reload({where: getSearchParams()});
                                } else {
                                    layer.msg(res.msg || '操作失败', {icon: 2});
                                }
                            });
                        });
                    } else if (menuitem.id === 'del') {
                        layer.confirm('确认删除订单 <b>' + escapeHtml(data.order_no) + '</b> 吗？', {
                            icon: 3, title: '确认删除', btn: ['确认', '取消']
                        }, function(index) {
                            deleteApi('/admin/api/store/orders/' + data.id + '/', function(res) {
                                if (res.code === 200) {
                                    layer.msg('删除成功', {icon: 1});
                                    layer.close(index);
                                    tableIns.reload({where: getSearchParams()});
                                } else {
                                    layer.msg(res.msg || '删除失败', {icon: 2});
                                }
                            });
                        });
                    }
                }
            });
        }
    });

    // 初始化
    loadTable();
});
</script>
</body>
</html>
