<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理</title>
    <link rel="stylesheet" href="/static/layui/lib/layui.css">
    <link rel="stylesheet" href="/static/layui/css/admin.css">
    <script>
        function syncParentTheme() {
            var themeMode = 'dark';
            try {
                if (window.parent && window.parent.document) {
                    themeMode = window.parent.document.documentElement.getAttribute('data-theme-mode') || 'dark';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme-mode', themeMode);
        }
        syncParentTheme();
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'themeChange') {
                document.documentElement.setAttribute('data-theme-mode', e.data.themeMode);
            }
        });
    </script>
    <style>
        body { padding: 0; margin: 0; background: var(--bg-primary); }
        .page-container { background: var(--bg-primary); padding: 20px 24px; min-height: 100%; }
        .search-bar { margin-bottom: 16px; }
        .search-bar .layui-form-item { margin-bottom: 16px; }
        .search-bar .layui-inline { margin-right: 16px; }
        .search-bar .layui-form-label { width: 120px; padding: 9px 12px 9px 0; }
        .layui-card { border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--shadow-sm); }
        .layui-card-header { border-bottom: 1px solid var(--card-border); }
    </style>
</head>
<body>
<div class="page-container">
    <div class="layui-card">
        <div class="layui-card-header">
            <span style="font-size:15px;font-weight:600;color:var(--text-primary);display:flex;align-items:center;gap:6px;">
                <i class="layui-icon layui-icon-cart-simple" style="color:var(--primary-color);"></i> 商品管理
            </span>
        </div>
        <div class="layui-card-body">
            <!-- 搜索栏 -->
            <div class="search-bar">
                <form class="layui-form" lay-filter="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline">
                            <label class="layui-form-label">关键词</label>
                            <div class="layui-input-inline" style="width:200px;">
                                <input type="text" name="keyword" id="searchKeyword" placeholder="商品名称/编码" autocomplete="off" class="layui-input">
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">分类</label>
                            <div class="layui-input-inline" style="width:160px;">
                                <select name="category_id" id="searchCategory">
                                    <option value="">全部</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <label class="layui-form-label">状态</label>
                            <div class="layui-input-inline" style="width:120px;">
                                <select name="status" id="searchStatus">
                                    <option value="">全部</option>
                                    <option value="1">上架</option>
                                    <option value="0">下架</option>
                                    <option value="2">售罄</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline">
                            <button type="button" class="layui-btn layui-btn-sm" id="searchBtn">
                                <i class="layui-icon layui-icon-search"></i> 搜索
                            </button>
                            <button type="reset" class="layui-btn layui-btn-sm layui-btn-primary" id="resetBtn">
                                <i class="layui-icon layui-icon-refresh"></i> 重置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- 表格 -->
            <table id="productTable" lay-filter="productTable"></table>
        </div>
    </div>
</div>

<!-- 工具栏模板 -->
<script type="text/html" id="toolbarTpl">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add">
            <i class="layui-icon layui-icon-add-1"></i> 新增商品
        </button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="refresh">
            <i class="layui-icon layui-icon-refresh"></i> 刷新
        </button>
    </div>
</script>

<!-- 操作列模板：默认显示查看/编辑，多余操作在更多下拉菜单中 -->
<script type="text/html" id="operateTpl">
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="view">查看</a>
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-xs" lay-event="more">更多<i class="layui-icon layui-icon-down" style="margin-left:3px;font-size:12px"></i></a>
</script>

<!-- 新增商品弹窗模板 (只有返回/保存按钮) -->
<script type="text/html" id="addFormTpl">
    <form class="layui-form" lay-filter="addForm" style="padding:20px 30px 0;">
        <div class="layui-form-item">
            <label class="layui-form-label">商品名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" lay-verify="required" placeholder="请输入商品名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">商品编码</label>
            <div class="layui-input-block">
                <input type="text" name="sku" lay-verify="required" placeholder="请输入商品编码（唯一）" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">分类</label>
            <div class="layui-input-block">
                <select name="category_id" id="addCategorySelect"><option value="">请选择分类</option></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">售价(元)</label>
            <div class="layui-input-block">
                <input type="number" name="price" step="0.01" lay-verify="required" value="0" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">成本价(元)</label>
            <div class="layui-input-block">
                <input type="number" name="cost_price" step="0.01" value="0" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">库存</label>
            <div class="layui-input-inline" style="width:120px;">
                <input type="number" name="stock" value="0" class="layui-input">
            </div>
            <label class="layui-form-label" style="width:80px;">状态</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="status">
                    <option value="1">上架</option>
                    <option value="0">下架</option>
                    <option value="2">售罄</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">推荐</label>
            <div class="layui-input-block">
                <input type="checkbox" name="is_featured" lay-skin="switch" lay-text="是|否">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">描述</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="请输入商品描述" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item" style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border-color);padding-top:15px;margin-top:10px;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="addFormCancel">返回</button>
            <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="addSubmit">保存</button>
        </div>
    </form>
</script>

<!-- 编辑商品弹窗模板 -->
<script type="text/html" id="editFormTpl">
    <form class="layui-form" lay-filter="editForm" style="padding:20px 30px 0;">
        <input type="hidden" name="id" value="">
        <div class="layui-form-item">
            <label class="layui-form-label">商品名称</label>
            <div class="layui-input-block">
                <input type="text" name="name" lay-verify="required" placeholder="请输入商品名称" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">商品编码</label>
            <div class="layui-input-block">
                <input type="text" name="sku" lay-verify="required" placeholder="请输入商品编码（唯一）" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">分类</label>
            <div class="layui-input-block">
                <select name="category_id" id="editCategorySelect"></select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">售价(元)</label>
            <div class="layui-input-block">
                <input type="number" name="price" step="0.01" lay-verify="required" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">成本价(元)</label>
            <div class="layui-input-block">
                <input type="number" name="cost_price" step="0.01" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">库存</label>
            <div class="layui-input-inline" style="width:120px;">
                <input type="number" name="stock" class="layui-input">
            </div>
            <label class="layui-form-label" style="width:80px;">状态</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="status">
                    <option value="1">上架</option>
                    <option value="0">下架</option>
                    <option value="2">售罄</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">推荐</label>
            <div class="layui-input-block">
                <input type="checkbox" name="is_featured" lay-skin="switch" lay-text="是|否">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">描述</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="请输入商品描述" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item" style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border-color);padding-top:15px;margin-top:10px;">
            <button type="button" class="layui-btn layui-btn-sm layui-btn-primary" id="editFormCancel">返回</button>
            <button type="button" class="layui-btn layui-btn-sm" lay-submit lay-filter="editSubmit">保存</button>
        </div>
    </form>
</script>

<script src="/static/layui/lib/layui.js"></script>
<script src="/static/layui/js/common.js?v=20261124b"></script>
<script>
inheritTheme();

layui.use(['table', 'form', 'layer', 'dropdown'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var dropdown = layui.dropdown;
    var $ = layui.$;

    var tableIns = null;
    var categoryList = [];

    // 构建搜索参数
    function getSearchParams() {
        var params = {};
        var keyword = $('#searchKeyword').val().trim();
        if (keyword) params.keyword = keyword;
        var categoryId = $('#searchCategory').val();
        if (categoryId) params.category_id = categoryId;
        var status = $('#searchStatus').val();
        if (status) params.status = status;
        return params;
    }

    // 加载分类列表
    function loadCategories(callback) {
        getApi('/admin/api/store/categories/', function(res) {
            if (res.code === 200) {
                var rawData = res.data;
                categoryList = Array.isArray(rawData) ? rawData : (rawData.list || []);
            }
            if (typeof callback === 'function') callback();
        });
    }

    // 渲染分类下拉
    function renderCategorySelect(selectId, selectedId) {
        var html = '<option value="">请选择分类</option>';
        for (var i = 0; i < categoryList.length; i++) {
            var selected = categoryList[i].id === selectedId ? 'selected' : '';
            html += '<option value="' + categoryList[i].id + '" ' + selected + '>' + categoryList[i].name + '</option>';
        }
        $('#' + selectId).html(html);
        form.render('select');
    }

    // 初始化搜索分类下拉
    function initSearchCategories() {
        var html = '<option value="">全部</option>';
        for (var i = 0; i < categoryList.length; i++) {
            html += '<option value="' + categoryList[i].id + '">' + categoryList[i].name + '</option>';
        }
        $('#searchCategory').html(html);
        form.render('select');
    }

    // 加载列表（使用 url 服务端分页）
    function loadTable() {
        tableIns = table.render({
            elem: '#productTable',
            url: '/admin/api/store/products/',
            toolbar: '#toolbarTpl',
            defaultToolbar: [],
            where: getSearchParams(),
            height: 'full-220',
            page: {
                limit: 10,
                limits: [10, 30, 50, 100],
                layout: ['count', 'prev', 'page', 'next', 'skip', 'limit']
            },
            even: true,
            parseData: function(res) {
                return {
                    "code": res.code === 200 ? 0 : res.code,
                    "msg": res.msg,
                    "count": res.data ? res.data.total : 0,
                    "data": res.data ? res.data.list : []
                };
            },
            request: {
                pageName: 'page',
                limitName: 'page_size'
            },
            cols: [[
                {field: 'id', title: 'ID', width: 65, align: 'center'},
                {field: 'name', title: '商品名称', minWidth: 150},
                {field: 'sku', title: '编码', width: 140},
                {field: 'category_name', title: '分类', width: 100, align: 'center'},
                {field: 'price', title: '售价', width: 90, align: 'center',
                    templet: function(d) { return '¥<strong>' + d.price + '</strong>'; }
                },
                {field: 'stock', title: '库存', width: 70, align: 'center'},
                {field: 'sales', title: '销量', width: 70, align: 'center'},
                {field: 'status_label', title: '状态', width: 80, align: 'center',
                    templet: function(d) {
                        var colors = {'上架': '#52c41a', '下架': '#ff4d4f', '售罄': '#faad14'};
                        var color = colors[d.status_label] || '#999';
                        return '<span style="color:' + color + ';font-weight:bold">' + d.status_label + '</span>';
                    }
                },
                {field: 'is_featured', title: '推荐', width: 70, align: 'center',
                    templet: function(d) {
                        return d.is_featured ? '<span class="layui-badge layui-bg-orange">荐</span>' : '';
                    }
                },
                {field: 'create_time', title: '创建时间', width: 160, align: 'center'},
                {title: '操作', width: 280, align: 'center', fixed: 'right', toolbar: '#operateTpl'}
            ]]
        });
    }

    // 打开新增弹窗 (只有返回/保存按钮)
    function openAddForm() {
        loadCategories(function() {
            layer.open({
                type: 1,
                title: '新增商品',
                area: ['600px', 'auto'],
                content: $('#addFormTpl').html(),
                success: function(layero, index) {
                    renderCategorySelect('addCategorySelect', null);
                    form.render(null, 'addForm');

                    // 返回按钮（关闭弹窗）
                    layero.find('#addFormCancel').on('click', function() {
                        layer.close(index);
                    });
                }
            });
        });
    }

    // 新增提交
    form.on('submit(addSubmit)', function(data) {
        var field = data.field;
        field.is_featured = field.is_featured === 'on';
        postApi('/admin/api/store/products/create/', field, function(res) {
            if (res.code === 200) {
                layer.msg('创建成功', {icon: 1});
                layer.closeAll();
                tableIns.reload({
                    where: getSearchParams()
                });
            } else {
                layer.msg(res.msg || '创建失败', {icon: 2});
            }
        });
        return false;
    });

    // 打开编辑弹窗
    function openEditForm(rowData) {
        loadCategories(function() {
            layer.open({
                type: 1,
                title: '编辑商品 - ' + rowData.name,
                area: ['600px', 'auto'],
                content: $('#editFormTpl').html(),
                success: function(layero, index) {
                    renderCategorySelect('editCategorySelect', rowData.category_id);
                    form.val('editForm', {
                        id: rowData.id,
                        name: rowData.name,
                        sku: rowData.sku,
                        price: rowData.price,
                        cost_price: rowData.cost_price,
                        stock: rowData.stock,
                        status: String(rowData.status),
                        description: rowData.description,
                        is_featured: rowData.is_featured
                    });
                    form.render(null, 'editForm');

                    // 返回按钮（关闭弹窗）
                    layero.find('#editFormCancel').on('click', function() {
                        layer.close(index);
                    });
                }
            });
        });
    }

    // 编辑提交
    form.on('submit(editSubmit)', function(data) {
        var field = data.field;
        var id = field.id;
        field.is_featured = field.is_featured === 'on';
        putApi('/admin/api/store/products/' + id + '/', field, function(res) {
            if (res.code === 200) {
                layer.msg('更新成功', {icon: 1});
                layer.closeAll();
                tableIns.reload({
                    where: getSearchParams()
                });
            } else {
                layer.msg(res.msg || '更新失败', {icon: 2});
            }
        });
        return false;
    });

    // 搜索
    $(document).off('click.prodSearch').on('click.prodSearch', '#searchBtn', function(e) {
        e.preventDefault();
        tableIns.reload({
            where: getSearchParams(),
            page: {curr: 1}
        });
    });

    // 重置
    $(document).off('click.prodReset').on('click.prodReset', '#resetBtn', function(e) {
        e.preventDefault();
        $('#searchKeyword').val('');
        $('#searchCategory').val('');
        $('#searchStatus').val('');
        form.render('select');
        tableIns.reload({
            where: {},
            page: {curr: 1}
        });
    });

    // 回车搜索
    $(document).off('keydown.prodSearch').on('keydown.prodSearch', '#searchKeyword', function(e) {
        if (e.keyCode === 13) {
            e.preventDefault();
            tableIns.reload({
                where: getSearchParams(),
                page: {curr: 1}
            });
        }
    });

    // 工具栏事件
    table.on('toolbar(productTable)', function(obj) {
        if (obj.event === 'add') {
            openAddForm();
        } else if (obj.event === 'refresh') {
            tableIns.reload({
                where: getSearchParams()
            });
        }
    });

    // 操作列事件
    table.on('tool(productTable)', function(obj) {
        var data = obj.data;
        if (obj.event === 'view') {
            var colors = {'上架': '#52c41a', '下架': '#ff4d4f', '售罄': '#faad14'};
            var color = colors[data.status_label] || '#999';
            var featuredHtml = data.is_featured ? '是' : '否';
            var content = '<div style="padding:20px 30px;">' +
                '<div class="layui-form-item"><label class="layui-form-label">商品名称</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.name || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">商品编码</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.sku || '') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">分类</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.category_name || '-') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">售价</label><div class="layui-input-block"><input type="text" value="¥' + escapeHtml(data.price || '0') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">成本价</label><div class="layui-input-block"><input type="text" value="¥' + escapeHtml(data.cost_price || '0') + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">库存/销量</label><div class="layui-input-block"><input type="text" value="' + (data.stock || 0) + ' / ' + (data.sales || 0) + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><input type="text" value="' + data.status_label + '" style="color:' + color + ';font-weight:bold" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">推荐</label><div class="layui-input-block"><input type="text" value="' + featuredHtml + '" class="layui-input" readonly></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">描述</label><div class="layui-input-block"><textarea class="layui-textarea" readonly>' + escapeHtml(data.description || '') + '</textarea></div></div>' +
                '<div class="layui-form-item"><label class="layui-form-label">创建时间</label><div class="layui-input-block"><input type="text" value="' + escapeHtml(data.create_time || '') + '" class="layui-input" readonly></div></div>' +
                '</div>';
            layer.open({
                type: 1,
                title: '查看商品 - ' + data.name,
                area: ['600px', '520px'],
                content: content,
                btn: ['关闭']
            });
        } else if (obj.event === 'edit') {
            openEditForm(data);
        } else if (obj.event === 'more') {
            dropdown.render({
                elem: this,
                show: true,
                data: [{title: '删除商品', id: 'del'}],
                click: function(menuitem) {
                    layer.confirm('确认删除商品 <b>' + escapeHtml(data.name) + '</b> 吗？', {
                        icon: 3, title: '确认删除', btn: ['确认', '取消']
                    }, function(index) {
                        deleteApi('/admin/api/store/products/' + data.id + '/', function(res) {
                            if (res.code === 200) {
                                layer.msg('删除成功', {icon: 1});
                                layer.close(index);
                                tableIns.reload({where: getSearchParams()});
                            } else {
                                layer.msg(res.msg || '删除失败', {icon: 2});
                            }
                        });
                    });
                }
            });
        }
    });

    // 初始化
    loadCategories(function() {
        initSearchCategories();
    });
    loadTable();
});
</script>
</body>
</html>
