[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-layuix"
version = "1.4.7"
description = "基于 Layui 的 Django Admin 主题，集成 RBAC 权限系统和运维管理"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Yingzi", email = "yingzilkq@163.com"},
]
keywords = ["django", "admin", "layui", "theme", "rbac", "simpleui", "permission"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "Django>=3.2",
    "psutil>=5.9.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
ops = ["paramiko>=2.0", "webssh>=1.6.0"]
ai = ["openai>=1.0"]
all = ["paramiko>=2.0", "webssh>=1.6.0", "openai>=1.0"]
dev = ["build", "twine", "django-layuix[all]"]

[project.urls]
Homepage = "https://github.com/likangcai/django-layuix"
Documentation = "https://github.com/likangcai/django-layuix#readme"
Repository = "https://github.com/likangcai/django-layuix"
"Bug Tracker" = "https://github.com/likangcai/django-layuix/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["django_layuix*"]
